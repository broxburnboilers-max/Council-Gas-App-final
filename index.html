    <style>
      #cg-sent-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: #18252D;
        color: #f5f5f5;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 24px;
      }
      #cg-sent-overlay.show { display: flex; }
      #cg-sent-overlay .tick {
        width: 96px; height: 96px; border-radius: 50%;
        background: #F2682A;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 8px 32px rgba(242,104,42,0.35);
      }
      #cg-sent-overlay .tick svg { width: 56px; height: 56px; stroke: #fff; stroke-width: 4; fill: none; }
      #cg-sent-overlay h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
      #cg-sent-overlay p { font-size: 16px; color: #b8c2c8; margin: 0 0 32px; max-width: 320px; line-height: 1.5; }
      #cg-sent-overlay button {
        background: #F2682A; color: #fff; border: 0;
        padding: 14px 36px; border-radius: 12px; font-size: 16px; font-weight: 700;
        cursor: pointer; min-width: 180px;
      }
      #cg-sent-overlay button:active { transform: scale(0.98); }

      /* Slot picker chip — top of the sign-in screen */
      #cg-slot-picker {
        position: fixed; left: 50%; transform: translateX(-50%);
        top: 24px; z-index: 9996;
        background: rgba(255,255,255,0.08); color: #fff;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 14px; padding: 10px 14px;
        font: 600 13px/1 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        display: none; flex-direction: column; align-items: stretch; gap: 6px;
        backdrop-filter: blur(10px);
        min-width: 240px;
      }
      #cg-slot-picker label { font-size: 11px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
      #cg-slot-picker select {
        background: rgba(255,255,255,0.95); color: #18252D;
        border: 0; border-radius: 10px;
        padding: 10px 12px; font: 600 14px/1 inherit;
        appearance: none; -webkit-appearance: none;
      }

      /* Today's Jobs overlay — shown after sign-in if jobs exist */
      #cg-jobs-overlay {
        position: fixed; inset: 0; z-index: 99998;
        background: linear-gradient(160deg, #18252D 0%, #243440 60%, #18252D 100%);
        color: #fff;
        display: none; flex-direction: column;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        padding: 24px 20px 100px;
        overflow-y: auto;
      }
      #cg-jobs-overlay.show { display: flex; }
      #cg-jobs-overlay .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      #cg-jobs-overlay .head h1 { font-size: 22px; font-weight: 800; margin: 0; }
      #cg-jobs-overlay .head .who { font-size: 13px; color: rgba(255,255,255,0.65); margin: 0; }
      #cg-jobs-overlay .lede { font-size: 14px; color: rgba(255,255,255,0.7); margin: 16px 0 20px; line-height: 1.5; }
      #cg-jobs-overlay .joblist { display: flex; flex-direction: column; gap: 12px; }
      #cg-jobs-overlay .job {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px; padding: 16px 18px;
        cursor: pointer; transition: transform 0.1s, background 0.15s;
        text-align: left;
      }
      #cg-jobs-overlay .job:active { transform: scale(0.98); background: rgba(255,255,255,0.12); }
      #cg-jobs-overlay .job .addr { font-size: 15px; font-weight: 700; line-height: 1.4; }
      #cg-jobs-overlay .job .pcode { font-size: 13px; color: #F2682A; font-weight: 700; margin-top: 4px; letter-spacing: 0.04em; }
      #cg-jobs-overlay .empty { color: rgba(255,255,255,0.6); font-size: 14px; padding: 32px 0; text-align: center; }
      /* Match the React app's Continue button exactly. */
      #cg-jobs-overlay .skip {
        display: block;
        width: 100%;
        margin: 24px 0 0;
        padding: 8px 16px;
        background: linear-gradient(135deg, #FFB347 0%, #FF6B35 50%, #E8408F 100%);
        color: #fff;
        border: 0;
        border-radius: 6px;
        font: 500 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        letter-spacing: normal;
        text-transform: none;
        cursor: pointer;
        min-height: 36px;
      }
      #cg-jobs-overlay .skip:active { transform: scale(0.98); }

      /* Admin button — fixed in the bottom-right of every post-sign-in screen */
      #cg-admin-btn {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 9998;
        background: rgba(242,104,42,0.95);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font: 700 13px/1 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        cursor: pointer;
        display: none; /* shown by JS once engineer is signed in */
      }
      #cg-admin-btn:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Engineer slot picker (only visible on the sign-in screen) -->
    <div id="cg-slot-picker">
      <label for="cg-slot-select">Engineer</label>
      <select id="cg-slot-select"></select>
    </div>

    <!-- Today's Jobs overlay (shown after sign-in if jobs are assigned) -->
    <div id="cg-jobs-overlay" role="dialog" aria-live="polite">
      <div class="head">
        <span style="font-size:28px">📍</span>
        <div>
          <h1>Today's Jobs</h1>
          <p class="who" id="cg-jobs-who">Welcome.</p>
        </div>
      </div>
      <p class="lede">Tap a property below to start the visit. The address will be filled in automatically.</p>
      <div class="joblist" id="cg-jobs-list"></div>
      <button class="skip" id="cg-jobs-skip" type="button">Enter address manually</button>
    </div>

    <!-- Admin shortcut to dashboard (only visible after engineer sign-in) -->
    <button id="cg-admin-btn" type="button" aria-label="Open admin dashboard">Admin</button>

    <!-- Sent confirmation overlay (engineer's end-of-flow) -->
    <div id="cg-sent-overlay" role="dialog" aria-live="polite">
      <div class="tick">
        <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,7" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>
      <h1>Sent</h1>
      <p>Visit data has been saved. Thank you.</p>
      <button id="cg-sent-done" type="button">Done</button>
    </div>

    <!-- Admin sign-in shortcut (always visible on the engineer sign-in screen) -->
    <button id="cg-signin-admin-btn" type="button" aria-label="Admin login" style="
      position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:9997;
      background:transparent; color:#9aa6ad; border:1px solid #3a4a55;
      border-radius:999px; padding:8px 18px; font:600 12px/1 ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; display:none;
    ">Admin</button>

    <script>
    (function () {
      var overlay = document.getElementById("cg-sent-overlay");
      var doneBtn = document.getElementById("cg-sent-done");

      // ── Cloud queue: POST visit data to /api/submissions when queued locally ──
      // The body sent to the admin is SANITISED so the ON-SITE DOCUMENTATION
      // and MATERIALS USED sections — which are internal record-keeping for
      // the engineer's phone — never get scraped onto the certificate's
      // Faults/Notes column. The Engineer line is preserved because the
      // engineer's name, Gas Safe Reg and Licence MUST appear on the cert.
      function sanitizeBodyForCert(rawBody) {
        if (typeof rawBody !== "string" || !rawBody) return rawBody;
        var lines = rawBody.split(/\r?\n/);
        var out = [];
        // Sections that should be stripped entirely from the cert-bound body.
        // Each section starts at a heading line and runs until the next blank
        // line followed by a recognised next section, or until the property
        // separator '==============================', or until end of input.
        var STRIP_HEADINGS = [
          "ON-SITE DOCUMENTATION",
          "MATERIALS USED"
        ];
        // Headings that legitimately follow and end a stripped section.
        var KNOWN_HEADINGS = [
          "PROPERTY ", "ACCESS", "ALARMS", "APPLIANCE ", "COOKER ",
          "FAULTS", "FAULT ", "ON-SITE DOCUMENTATION", "MATERIALS USED"
        ];
        function isKnownHeading(t) {
          var u = t.trim().toUpperCase();
          for (var i = 0; i < KNOWN_HEADINGS.length; i++) {
            if (u === KNOWN_HEADINGS[i].trim() ||
                u.indexOf(KNOWN_HEADINGS[i]) === 0) return true;
          }
          return false;
        }
        function isStripHeading(t) {
          var u = t.trim().toUpperCase();
          for (var i = 0; i < STRIP_HEADINGS.length; i++) {
            if (u === STRIP_HEADINGS[i]) return true;
          }
          return false;
        }
        var i = 0;
        while (i < lines.length) {
          var L = lines[i];
          // Strip ON-SITE DOCUMENTATION / MATERIALS USED sections (these are
          // engineer-only records that pollute the cert's Faults column).
          if (isStripHeading(L)) {
            // skip heading + dashed underline + content until
            // next blank-then-known-heading or property separator.
            i++;
            while (i < lines.length) {
              var ln = lines[i];
              if (/^=+\s*$/.test(ln.trim())) break; // property separator
              // peek: blank line followed by another known heading ends section
              if (ln.trim() === "") {
                var j = i + 1;
                while (j < lines.length && lines[j].trim() === "") j++;
                if (j >= lines.length) { i = j; break; }
                if (isKnownHeading(lines[j])) {
                  // don't keep the trailing blank, advance to j
                  i = j;
                  break;
                }
              }
              i++;
            }
            continue;
          }
          out.push(L);
          i++;
        }
        // collapse 3+ consecutive blank lines down to 1
        var cleaned = out.join("\n").replace(/\n{3,}/g, "\n\n");
        return cleaned;
      }

      function pushLatestToCloud() {
        try {
          var queue = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]");
          if (!queue.length) return;
          var latest = queue[queue.length - 1];
          if (!latest || latest._cloudSent) return;
          var profile = null;
          try { profile = JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "null"); } catch (e) {}
          var safeBody = sanitizeBodyForCert(latest.body);
          fetch("/api/submissions", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              subject: latest.subject,
              body: safeBody,
              engineer: profile,
            }),
          }).then(function (r) {
            if (!r.ok) return;
            // mark as cloud-sent so we don't double-post
            try {
              var q2 = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]");
              for (var i = q2.length - 1; i >= 0; i--) {
                if (q2[i].id === latest.id) { q2[i]._cloudSent = true; break; }
              }
              localStorage.setItem("citizenGas.queue", JSON.stringify(q2));
            } catch (e) {}
          }).catch(function () { /* best-effort; engineer can retry by Done */ });
        } catch (e) { /* ignore */ }
      }

      // The 'queued' event fires when the engineer taps Send on /review.
      // Push to the admin cloud queue so the certificate is captured even if
      // the engineer's phone dies before they finish the day. The 'Sent'
      // overlay (with Done button) is now driven by handleJobFinished()
      // below — we only show it when the day is fully complete.
      window.addEventListener("citizenGas:queued", function () {
        pushLatestToCloud();
      });

      // The Done button on the orange 'Sent' overlay is only reached when
      // the engineer finishes the LAST job of the day. Wipe session state
      // and bounce back to the sign-in screen.
      doneBtn.addEventListener("click", function () {
        // End-of-day path: trigger the daybook email instead of just
        // dismissing the overlay. The send modal handles success/cancel
        // and the engineer can dismiss the overlay separately.
        if (doneBtn.dataset.endOfDay === "1") {
          if (typeof window.cgFinishDay === "function") {
            window.cgFinishDay();
          }
          return;
        }
        // Legacy path (single-job 'Sent' overlay) — clear and bounce.
        overlay.classList.remove("show");
        pushLatestToCloud(); // best-effort retry
        try {
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf("citizenGas.") === 0
              && k !== "citizenGas.engineerProfile"
              && k !== "citizenGas.queue") {
              localStorage.removeItem(k);
            }
          });
          // Clear the fresh-signin flag so they land on sign-in, not jobs.
          sessionStorage.removeItem("citizenGas.signinFresh");
        } catch (e) {}
        window.location.href = "/";
      });

      // ── In-app admin chip → same gated path as the sign-in admin chip ──
      var adminBtn = document.getElementById("cg-admin-btn");
      var ADMIN_PASSWORD = "Test";

      adminBtn.addEventListener("click", function () {
        var pw = window.prompt("Enter admin password:");
        if (pw === null) return;
        if (pw !== ADMIN_PASSWORD) {
          alert("Incorrect password.");
          return;
        }
        try {
          sessionStorage.setItem("gsAdminAuth", "1");
          sessionStorage.setItem("gsAdminKey", ADMIN_PASSWORD);
        } catch (e) {}
        window.location.href = "/admin/";
      });

      function isSignedIn() {
        try {
          var raw = localStorage.getItem("citizenGas.engineerProfile");
          if (!raw) return false;
          var p = JSON.parse(raw);
          return !!(p && (p.fullName || p.gasSafeRegNo || p.licenceNo));
        } catch (e) { return false; }
      }

      // ── Sign-in screen Admin button → password prompt → /admin/ ──
      var signinAdmin = document.getElementById("cg-signin-admin-btn");

      signinAdmin.addEventListener("click", function () {
        var pw = window.prompt("Enter admin password:");
        if (pw === null) return;
        if (pw !== ADMIN_PASSWORD) {
          alert("Incorrect password.");
          return;
        }
        // Stash a session flag the admin app reads on mount.
        try {
          sessionStorage.setItem("gsAdminAuth", "1");
          sessionStorage.setItem("gsAdminKey", ADMIN_PASSWORD);
        } catch (e) {}
        window.location.href = "/admin/";
      });

      function refreshAdminBtns() {
        // Engineer-only existing dashboard button.
        adminBtn.style.display = isSignedIn() ? "inline-flex" : "none";
        // Sign-in screen Admin chip: shown only when not signed in.
        signinAdmin.style.display = isSignedIn() ? "none" : "inline-flex";
      }

      // ===========================================================
      // Engineer slot picker + Today's Jobs overlay
      // ===========================================================

      var SLOT_KEY_LS = "citizenGas.slotId";
      var slotPickerEl = document.getElementById("cg-slot-picker");
      var slotSelectEl = document.getElementById("cg-slot-select");
      var jobsOverlay = document.getElementById("cg-jobs-overlay");
      var jobsListEl = document.getElementById("cg-jobs-list");
      var jobsWhoEl = document.getElementById("cg-jobs-who");
      var jobsSkipBtn = document.getElementById("cg-jobs-skip");
      var slotsCache = []; // [{slotId, label}]

      function loadSlotsFromCloud() {
        return fetch("/api/engineers/public", { method: "GET" })
          .then(function (r) { return r.ok ? r.json() : { slots: [] }; })
          .then(function (j) {
            slotsCache = (j && j.slots) || [];
            renderSlotPickerOptions();
          })
          .catch(function () { /* offline — hide picker */ });
      }

      function renderSlotPickerOptions() {
        if (!slotsCache.length) return;
        var saved = "";
        try { saved = localStorage.getItem(SLOT_KEY_LS) || ""; } catch (e) {}
        slotSelectEl.innerHTML = "";
        slotsCache.forEach(function (s) {
          var opt = document.createElement("option");
          opt.value = s.slotId;
          opt.textContent = s.label;
          if (s.slotId === saved) opt.selected = true;
          slotSelectEl.appendChild(opt);
        });
      }

      slotSelectEl.addEventListener("change", function () {
        try { localStorage.setItem(SLOT_KEY_LS, slotSelectEl.value); } catch (e) {}
      });

      // Detect if the sign-in screen is currently rendered. Cheap heuristic: an
      // input with the engineer-name placeholder is present.
      function isSignInScreen() {
        return !!document.querySelector('input[placeholder="e.g. James Smith"]');
      }

      function refreshSlotPickerVisibility() {
        // Show the picker whenever the sign-in screen is rendered — even for
        // returning engineers, so they can switch slots if needed. Hide on
        // every other screen (home, run-through, etc.).
        if (slotsCache.length && isSignInScreen()) {
          slotPickerEl.style.display = "flex";
          // Pre-select the saved slot if there is one.
          try {
            var saved = localStorage.getItem(SLOT_KEY_LS) || "";
            if (saved && slotSelectEl.value !== saved) slotSelectEl.value = saved;
          } catch (e) {}
        } else {
          slotPickerEl.style.display = "none";
        }
      }

      // ====== Today's Jobs after sign-in ======

      // The slot the engineer chose at sign-in is stored under SLOT_KEY_LS.
      // We fetch that slot's pending jobs and present the overlay.
      function fetchPendingJobs() {
        var slotId = "";
        try { slotId = localStorage.getItem(SLOT_KEY_LS) || ""; } catch (e) {}
        if (!slotId) return Promise.resolve([]);
        return fetch("/api/jobs/me?slotId=" + encodeURIComponent(slotId))
          .then(function (r) { return r.ok ? r.json() : { items: [] }; })
          .then(function (j) { return (j && j.items) || []; })
          .catch(function () { return []; });
      }

      function showJobsOverlay(jobs) {
        var profile = null;
        try { profile = JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "null"); } catch (e) {}
        var slotLabel = "";
        try {
          var slotId = localStorage.getItem(SLOT_KEY_LS) || "";
          var s = slotsCache.find(function (s) { return s.slotId === slotId; });
          if (s) slotLabel = s.label;
        } catch (e) {}
        var who = profile && profile.fullName ? profile.fullName : (slotLabel || "Engineer");
        jobsWhoEl.textContent = "Welcome, " + who + ".";

        jobsListEl.innerHTML = "";
        jobs.forEach(function (j) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "job";
          var line = [j.address1, j.address2].filter(Boolean).join(", ");
          btn.innerHTML =
            '<div class="addr">' + escapeHtml(line) + '</div>' +
            (j.postcode ? '<div class="pcode">' + escapeHtml(j.postcode) + '</div>' : "");
          btn.addEventListener("click", function () { startJob(j); });
          jobsListEl.appendChild(btn);
        });
        if (!jobs.length) {
          // Friendly message keyed off London day-of-week so weekends read naturally
          // even if the engineer's phone is set to a different timezone.
          var ldow = new Date().toLocaleDateString("en-GB", { timeZone: "Europe/London", weekday: "short" });
          var weekend = (ldow === "Sat" || ldow === "Sun");
          var msg = weekend
            ? "No jobs today — enjoy your weekend. Tap below to start a visit manually if needed."
            : "No jobs scheduled for today. Tap below to start a visit manually if needed.";
          jobsListEl.innerHTML = '<div class="empty">' + msg + '</div>';
        }
        jobsOverlay.classList.add("show");
      }

      function hideJobsOverlay() { jobsOverlay.classList.remove("show"); }

      jobsSkipBtn.addEventListener("click", hideJobsOverlay);

      // ====== Pre-fill the address screen from a chosen job ======

      // Stash the chosen job so we can fill the address fields when the
      // address screen mounts.
      var pendingJob = null;

      function startJob(job) {
        pendingJob = job;
        hideJobsOverlay();
        // Click "Start visit" / equivalent on /home so the React app navigates
        // to /property/address. We try several strategies in order.
        clickStartVisit().then(function () {
          waitForAddressScreen(8000).then(function () {
            fillAddressFields(job);
          }).catch(function () { /* user can fill manually */ });
        });
      }

      function isOnAddressScreen() {
        // Council app uses HASH routing: /#/property/address.
        var h = (location.hash || "").replace(/^#/, "");
        return h.indexOf("/property/address") === 0
            || location.pathname.indexOf("/property/address") === 0;
      }

      function clickStartVisit() {
        // The Council home screen has a primary CTA on /home. The element is a
        // <div> with onclick (text "Start new job"), not a <button>/<a>. We try
        // by attribute first, then by text.
        return new Promise(function (resolve) {
          if (isOnAddressScreen()) return resolve();
          var attempts = 0;
          var iv = setInterval(function () {
            attempts++;
            // (1) Anchor pointing to /property/address (path or hash).
            var link = document.querySelector('a[href$="/property/address"], a[href$="#/property/address"]');
            if (link) { clearInterval(iv); link.click(); return resolve(); }
            // (2) Any element whose visible text is or contains the home CTA.
            // Council home tile reads "Start new job" (sometimes with a subtitle).
            // We iterate from leaves to root by collecting candidates and
            // sorting by ascending text length — innermost match wins.
            var all = document.querySelectorAll("button, a, div, [role=button]");
            var ctaNeedles = ["start new job", "start visit", "new visit", "new property"];
            var hits = [];
            for (var i = 0; i < all.length; i++) {
              var el = all[i];
              if (el.children.length > 4) continue; // skip large page containers
              var t = (el.textContent || "").trim().toLowerCase();

            if (hits.length) {

              // Climb to nearest ancestor with an onclick handler (React puts

          }

        // profile was already saved from a previous session and the user

        var fresh = false;

        if (isSignInScreen()) return;

        var slotId = "";
        try { slotId = localStorage.getItem(SLOT_KEY_LS) || ""; } catch (e) {}
        if (!slotId) return; // slot wasn't picked — nothing to show
        jobsShownThisSession = true;
        fetchPendingJobs().then(function (jobs) {
          if (jobs.length) showJobsOverlay(jobs);

      }

      // Watch the DOM for sign-in/sign-out transitions to:
      //   1) toggle slot picker visibility
      //   2) auto-fill the saved profile if we're on sign-in
      //   3) trigger the jobs overlay only after a fresh Continue click
      var stateMo = new MutationObserver(function () {
        refreshSlotPickerVisibility();
        autoFillSignInFromSaved();
        maybeShowJobsAfterSignIn();
      });

      window.addEventListener("DOMContentLoaded", function () {
        // CRITICAL: clear the fresh-signin flag on every cold load. A hard
        // refresh / app reopen must always start from the sign-in screen.
        try { sessionStorage.removeItem(SIGNIN_FRESH_KEY); } catch (e) {}
        loadSlotsFromCloud().then(function () {
          refreshSlotPickerVisibility();
          autoFillSignInFromSaved();

          // anyway (no fresh flag), but explicit is better.
          stateMo.observe(document.body, { childList: true, subtree: true });

    })();

    <script>

(function () {

  function readDaybook() {

    catch (e) { return { date: "", certs: [], noAccess: [] }; }

  // ---------- BODY PARSER ----------
  // Inverse of the bundle's W0 builder. Splits on '==============================' and

  function parseDaybookBody(body) {
    if (!body || typeof body !== "string") return [];
    const blocks = body
      .split(/\n=+\n/)            // property separator
      .flatMap(b => b.split(/\nEND OF JOB\n/));
    const properties = [];
    for (const block of blocks) {
      const txt = block.replace(/^\s+|\s+$/g, "");
      if (!txt) continue;
      // Skip the "Engineer:" header-only lines.
      if (/^Engineer:/.test(txt) && !/PROPERTY/i.test(txt)) continue;

  function getField(txt, label) {
    const re = new RegExp("^" + label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ":\\s*(.+?)\\s*$", "m");
    const m = txt.match(re);
    return m ? m[1].trim() : "";

  function getSection(txt, heading) {
    // Returns the content between a heading line and the next blank-line + heading,
    // or the next ====== separator, or end of input.
    const lines = txt.split(/\r?\n/);
    let start = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim() === heading) { start = i + 1; break; }
    }
    if (start === -1) return null;
    // Skip dashed underline if present.
    if (start < lines.length && /^-+$/.test(lines[start].trim())) start++;
    const KNOWN = [
      "PROPERTY ", "ACCESS", "ALARMS", "APPLIANCE 1", "APPLIANCE 2", "APPLIANCE 3",
      "COOKER CAP", "COOKER INSTALL", "FAULTS", "FAULT ", "ON-SITE DOCUMENTATION", "MATERIALS USED"
    ];
    let end = lines.length;
    for (let j = start; j < lines.length; j++) {
      const ln = lines[j].trim();
      if (/^=+$/.test(ln)) { end = j; break; }
      if (j > start && lines[j - 1].trim() === "" && KNOWN.some(k => ln === k.trim() || ln.indexOf(k) === 0)) {

    const faults = [];
    const faultRegex = /FAULT \d+\s*\nFault Details:\s*(.+?)\nRemedial Work Taken:\s*(.+?)\nWarning Notice Fixed:\s*(\w+)(?:\nWarning Notice Notes:\s*(.+?))?(?=\n\n|\nFAULT |\n=+|\nMATERIALS USED|\nON-SITE|$)/gms;

      base.location = a.location || base.location;
      base.type = a.type || base.type;
      base.make = a.make || base.make;
      base.model = a.model || base.model;
      base.heatInput = a.heatInput || base.heatInput;
      base.operatingPressure = a.operatingPressure || base.operatingPressure;
      if (a.visualOnly) {
        // gas fire visual only — already N/A everywhere
      } else {
        base.flueType = a.heading === "APPLIANCE 1" ? "RS" : (a.heading === "APPLIANCE 2" ? "FL" : "");
        base.applianceInspected = "Yes";
        base.applianceSafe = "Yes";
        base.safetyDevices = "Yes";
        base.ventilation = a.heading === "APPLIANCE 1" ? "Pass" : "Yes";
        base.flueVisual = a.heading === "APPLIANCE 1" ? "Pass" : "N/A";
        base.fluePerformance = a.heading === "APPLIANCE 1" ? "Pass" : "N/A";
        base.applianceServiced = "No";
        base.landlordsAppliance = a.heading === "APPLIANCE 1" ? "Yes" : "No";
        if (a.heading === "APPLIANCE 1") {
          base.co2 = "10.06 %"; base.co = "66 ppm"; base.combustion = "0.0019";
          base.operatingPressure = base.operatingPressure || "NA";
        } else if (a.heading === "APPLIANCE 2") {
          base.co2 = "NA"; base.co = "NA"; base.combustion = "NA";
          base.heatInput = "NA";
        }
      }
      return base;
    });

    // Faults
    const faults = (prop.faults || []).map(f => ({
      details: f.details || "",
      remedial: f.remedial || "",
      warningNotice: f.warningNotice === "Yes" ? "Yes" : "No",
    }));

    // FINAL CHECKS — Feature 2 logic
    let finalChecks;
    if (prop.hasGas === false) {
      // No-gas: 5 main checks NO. CO/Smoke alarms follow engineer answer.
      finalChecks = {
        gasTightness: "NO",
        pipeworkVisual: "NO",
        emergencyControl: "NO",
        bonding: "NO",
        installationPass: "NO",
        coAlarm: prop.coAlarm ? "YES" : "NO",
        smokeAlarm: prop.fireAlarm ? "YES" : "NO",
        inspectionDate,
      };
      // Auto-add "No gas supply" fault if no faults entered
      if (faults.length === 0) {
        faults.push({ details: "No gas supply", remedial: "—", warningNotice: "No" });
      }
    } else {
      finalChecks = {
        gasTightness: "YES",
        pipeworkVisual: "YES",
        emergencyControl: "YES",
        bonding: "YES",
        installationPass: "YES",
        coAlarm: "YES",
        smokeAlarm: "YES",
        inspectionDate,
      };
    }

    // Photos: attach those that look like they belong to this property
    const attachedPhotos = (photos || []).filter(ph => {
      if (!ph || !ph.dataUrl) return false;
      // If the harvested addr matches this property, attach.
      const propAddrFlat = (prop.address1 + " " + prop.postcode).toLowerCase();
      const phAddrFlat = (ph.addr || "").toLowerCase();
      return phAddrFlat.includes((prop.address1 || "").toLowerCase()) ||
             propAddrFlat.includes(phAddrFlat) ||
             ph.addr === ""; // attach unknown photos to all (de-dup later if needed)
    });

    return {
      id: "rec_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      certData,
      appliances,
      faults,
      finalChecks,
      signatureData: {},
      engineerData,
      photos: attachedPhotos.map(p => ({ label: p.label, dataUrl: p.dataUrl })),
      savedAt: NOW.toISOString(),
    };
  }

  // ---------- HOOK INTO THE EXISTING QUEUE EVENT ----------
  function captureLatestQueue() {
    let queue = [];
    try { queue = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]"); }
    catch (e) { return; }
    if (!queue.length) return;

    let profile = null;
    try { profile = JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "null"); } catch (e) {}

    // Snapshot the photos *now*, before React unmounts the review screen.
    // (Only relevant for the most-recent entry that triggered the event;
    // older entries that were missed won't have DOM photos available.)
    const photos = harvestPhotosFromReview();

    const daybook = readDaybook();
    if (!daybook.date) daybook.date = todayStamp();
    daybook.engineer = profile || {};

    let touched = false;

    // Walk EVERY unsaved queue item — not just the last one. This is a
    // safety net for the case where multiple queue pushes happened without
    // our event listener firing (e.g. tab backgrounded, race condition,
    // or older saved entries from a previous session-day that never made
    // it to the daybook).
    queue.forEach(function (item, idx) {
      if (!item || item._daybookSaved) return;
      const properties = parseDaybookBody(item.body || "");
      if (!properties.length) return;

      // Photos are only safely associated with the LAST queue entry
      // (the one that fired this event). For older entries, pass [].
      const isLatest = idx === queue.length - 1;
      const photosForItem = isLatest ? photos : [];

      properties.forEach(prop => {
        if (prop.noAccess) {
          daybook.noAccess = daybook.noAccess || [];
          daybook.noAccess.push({
            address1: prop.address1,
            address2: prop.address2,
            postcode: prop.postcode,
            date: prop.date || todayStamp(),
          });
        } else {
          const rec = buildRecord(prop, profile, photosForItem);
          daybook.certs = daybook.certs || [];
          // Replace any existing record with the same certRef from today
          daybook.certs = daybook.certs.filter(r => r.certData.certRef !== rec.certData.certRef);
          daybook.certs.push(rec);
        }
      });
      touched = true;
    });

    if (!touched) return;

    writeDaybook(daybook);

    // Mark every queue entry so we don't double-save on a future event.
    try {
      const q2 = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]");
      q2.forEach(function (it) { if (it) it._daybookSaved = true; });
      localStorage.setItem("citizenGas.queue", JSON.stringify(q2));
    } catch (e) {}

    refreshDaybookButton();
  }

  // Listen — same event the existing cloud-push uses, but we run AFTER it.
  window.addEventListener("citizenGas:queued", function () {
    setTimeout(captureLatestQueue, 50); // slightly before cloud push so photos are still in DOM
  });

  // ---------- FINISH & SEND UI ----------
  function ensureDaybookButton() {
    if (document.getElementById("cg-daybook-btn")) return;
    const btn = document.createElement("button");
    btn.id = "cg-daybook-btn";
    btn.type = "button";
    btn.textContent = "Finish day & email";
    btn.style.cssText = [
      "position:fixed", "left:16px", "right:16px", "bottom:16px", "z-index:9998",
      "background:#F2682A", "color:#fff", "border:0", "border-radius:14px",
      "padding:18px 20px",
      "font:700 16px/1.2 ui-sans-serif,system-ui,-apple-system,sans-serif",
      "letter-spacing:0.02em",
      "box-shadow:0 8px 24px rgba(242,104,42,0.35)", "cursor:pointer",
      "display:none", "width:auto", "text-align:center",
      "-webkit-tap-highlight-color:transparent",
    ].join(";");
    btn.addEventListener("click", finishDay);
    document.body.appendChild(btn);
  }
  function refreshDaybookButton() {
    // Floating button removed — the daybook is sent from the end-of-day
    // overlay that appears after the LAST job is completed. This function is
    // kept as a no-op so other call sites don't break.
    var existing = document.getElementById("cg-daybook-btn");
    if (existing) existing.remove();
  }
  // Expose finishDay so the sign-in IIFE's end-of-day overlay can trigger
  // the same send flow (modal confirmation → Resend email).
  window.cgFinishDay = function () { try { finishDay(); } catch (e) {} };

  // ---- Safari-friendly modal (replaces alert/confirm which can stall on iOS) ----
  function showStatusModal(opts) {
    var existing = document.getElementById("cg-modal");
    if (existing) existing.remove();
    var wrap = document.createElement("div");
    wrap.id = "cg-modal";
    wrap.style.cssText = [
      "position:fixed","inset:0","z-index:99999","background:rgba(0,0,0,0.6)",
      "display:flex","align-items:center","justify-content:center","padding:20px",
      "font:500 14px/1.4 ui-sans-serif,system-ui,sans-serif",
    ].join(";");
    var card = document.createElement("div");
    card.style.cssText = [
      "background:#fff","color:#1a2330","border-radius:14px","padding:18px 18px 14px",
      "max-width:380px","width:100%","box-shadow:0 12px 40px rgba(0,0,0,0.4)",
    ].join(";");
    var t = document.createElement("div");
    t.style.cssText = "font-weight:800;font-size:16px;margin-bottom:8px;";
    t.textContent = opts.title || "";
    var m = document.createElement("div");
    m.style.cssText = "font-size:13px;margin-bottom:14px;white-space:pre-wrap;color:#374151;";
    m.textContent = opts.message || "";
    var btnRow = document.createElement("div");
    btnRow.style.cssText = "display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;";
    (opts.buttons || [{label: "OK"}]).forEach(function (b) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = b.label;
      btn.style.cssText = [
        "border:0","border-radius:8px","padding:9px 14px",
        "font:700 13px/1 inherit","cursor:pointer",
        b.primary ? "background:#2a52d4;color:#fff;" : "background:#e4e7ee;color:#1a2330;",
      ].join(";");
      btn.addEventListener("click", function () {
        wrap.remove();
        if (typeof b.onClick === "function") b.onClick();
      });
      btnRow.appendChild(btn);
    });
    card.appendChild(t);
    card.appendChild(m);
    card.appendChild(btnRow);
    wrap.appendChild(card);
    document.body.appendChild(wrap);
  }

  // Strip large data URLs (photos) from a daybook copy. Photos are kept locally
  // for the admin Photo-PDF flow, but should NOT be in the emailed JSON because:
  //  - Resend has a 40 MB attachment cap
  //  - Safari throttles/drops large fetch bodies
  //  - The admin import only needs the cert text data
  function daybookForEmail(d) {
    var copy = JSON.parse(JSON.stringify(d || {}));
    var stripped = 0;
    (copy.certs || []).forEach(function (c) {
      if (Array.isArray(c.photos)) {
        stripped += c.photos.length;
        c.photos = [];
        c._photosStripped = true;
      }
    });
    copy._stripped_photo_count = stripped;
    return copy;
  }

  async function finishDay() {
    // Safety sweep: drain any unsaved queue entries into the daybook before
    // we read it. Covers cases where the queued-event listener missed firing
    // (tab backgrounded, race, etc.).
    try { captureLatestQueue(); } catch (e) {}
    const d = readDaybook();
    const certCount = (d.certs || []).length;
    const naCount = (d.noAccess || []).length;
    if (!certCount && !naCount) {
      showStatusModal({
        title: "Nothing to send",
        message: "Finish at least one job first.",
        buttons: [{ label: "OK", primary: true }],
      });
      return;
    }

    showStatusModal({
      title: "Send today's daybook?",
      message: certCount + " cert" + (certCount === 1 ? "" : "s") +
        (naCount ? ", " + naCount + " no-access" : "") +
        "\nWill be emailed to broxburnboilers@gmail.com.",
      buttons: [
        { label: "Cancel" },
        { label: "Send", primary: true, onClick: function () { actuallySendDaybook(d); } },
      ],
    });
  }

  async function actuallySendDaybook(d) {
    const dateStamp = d.date || todayStamp();
    const filename = "daybook-" + dateStamp + ".json";
    const forEmail = daybookForEmail(d);
    const summary = {
      jobCount: (d.certs || []).length,
      noAccessCount: (d.noAccess || []).length,
    };
    const payload = JSON.stringify({ daybook: forEmail, summary, filename });
    const sizeKB = Math.round(payload.length / 1024);

    // Show a working spinner-ish modal
    showStatusModal({
      title: "Sending…",
      message: "Uploading " + sizeKB + " KB to the office. Don't close this page.",
      buttons: [],
    });

    let httpStatus = 0;
    let resendOk = false;
    let errMsg = "";
    let bodyText = "";
    try {
      const resp = await fetch("/api/send-daybook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        // keepalive lets Safari finish the request even if the page is closing
        keepalive: true,
      });
      httpStatus = resp.status;
      bodyText = await resp.text().catch(function () { return ""; });
      let parsed = null;
      try { parsed = JSON.parse(bodyText); } catch (e) {}
      resendOk = resp.ok && parsed && parsed.ok === true;
    } catch (e) {
      errMsg = (e && e.message) ? e.message : String(e);
    }

    // Always offer the local backup download regardless of outcome.
    downloadJsonLocally(d, filename);

    if (resendOk) {
      writeDaybook({ date: "", certs: [], noAccess: [] });
      refreshDaybookButton();
      showStatusModal({
        title: "Sent \u2713",
        message: "Daybook emailed to broxburnboilers@gmail.com.\nA copy also saved to Downloads as " + filename + ".",
        buttons: [{
          label: "Done", primary: true,
          onClick: function () {
            // End of the day: wipe per-day state and bounce to sign-in,
            // mirroring the legacy Done behaviour.
            try {
              Object.keys(localStorage).forEach(function (k) {
                if (k.indexOf("citizenGas.") === 0
                  && k !== "citizenGas.engineerProfile"
                  && k !== "citizenGas.queue") {
                  localStorage.removeItem(k);
                }
              });
              sessionStorage.removeItem("citizenGas.signinFresh");
            } catch (e) {}
            window.location.href = "/";
          },
        }],
      });
      return;
    }

    // Failure path — keep the daybook so the engineer can retry.
    var diag = [
      "Status: " + (httpStatus || "no response"),
      "Size: " + sizeKB + " KB",
      "Error: " + (errMsg || "—"),
      "Body: " + (bodyText ? bodyText.slice(0, 200) : "—"),
    ].join("\n");
    showStatusModal({
      title: "Email failed",
      message:
        "The daybook could NOT be emailed. Your data is safe — nothing was deleted.\n\n" +
        "A copy was saved to Downloads as " + filename + ".\n\n" +
        "Diagnostic info (for support):\n" + diag,
      buttons: [
        { label: "Close" },
        { label: "Try again", primary: true, onClick: function () { actuallySendDaybook(d); } },
      ],
    });
  }

  function buildMailtoBody(d, summary, filename) {
    const lines = [];
    lines.push("Citizen Gas — End of Day Daybook");
    lines.push("Date: " + d.date);
    lines.push("Engineer: " + ((d.engineer && d.engineer.fullName) || ""));
    lines.push("");
    lines.push("Jobs completed: " + summary.jobCount);
    lines.push("No-access: " + summary.noAccessCount);
    lines.push("");
    if (d.noAccess && d.noAccess.length) {
      lines.push("=== NO ACCESS ===");
      d.noAccess.forEach(na => {
        lines.push("- " + [na.address1, na.address2, na.postcode].filter(Boolean).join(", "));
      });
      lines.push("");
    }
    lines.push("ATTACH the file: " + filename);
    lines.push("(downloaded to your phone's Downloads folder)");
    return lines.join("\n");
  }

  function downloadJsonLocally(daybook, filename) {
    const json = JSON.stringify(daybook, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
  }

  // ---------- BOOTSTRAP ----------
  window.addEventListener("DOMContentLoaded", function () {
    ensureDaybookButton();
    refreshDaybookButton();
    // Refresh button every 1.5s so it appears as soon as a profile/cert exists
    setInterval(refreshDaybookButton, 1500);
  });
})();

    </script>
  </body>
