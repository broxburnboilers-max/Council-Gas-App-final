    // BUG-FIX (Photo capture loss):
    // Photos in the engineer SPA flow as React state populated by FileReader.readAsDataURL.
    // The previous photo harvester scraped <img src="data:image/..."> from the review-screen

    // tags — synchronously, so the data URLs may not be in DOM at scrape time. Result: 0 photos.
    //
    // Fix: bucket every photo at the moment FileReader produces its data URL. This runs
    // BEFORE the bundle even mounts React, so we capture every photo the engineer ever
    // takes during the session, regardless of which screen is currently mounted. The

        FileReader.prototype.readAsDataURL = function (blob) {
          var fr = this;
          fr.addEventListener("load", function () {
            try {
              var r = fr.result;
              if (typeof r === "string" && r.indexOf("data:image/") === 0) {

                // It may not exist yet at first call — fall back to a
                // simple inline dedup against existing bucket entries.
                if (typeof window.cgPushPhotoIfNew === "function") {
                  window.cgPushPhotoIfNew(r);
                } else {
                  var b = window.__cgPhotoBucket;
                  var dup = false;
                  for (var k = 0; k < b.length; k++) {
                    if (b[k] && b[k].dataUrl === r) { dup = true; break; }
                  }
                  if (!dup) b.push({ dataUrl: r, capturedAt: Date.now() });
                }
                if (window.__cgPhotoBucket.length > 200) {
                  window.__cgPhotoBucket.splice(0, window.__cgPhotoBucket.length - 200);
                }
              }
            } catch (e) {}
          });
          return origRead.apply(fr, arguments);
        };
      } catch (e) {
        console.warn("[cg] photo bucket install failed", e);
      }
      // BUG-FIX (Task 2 — photos missing in downloaded JSON):
      // The FileReader-prototype hook above is the primary capture path,
      // but it can be defeated in real-world conditions (extensions, race
      // conditions, mobile Safari quirks). We add THREE independent
      // backup paths so photos always end up in the bucket:
      //
      //   (1) Persist bucket to sessionStorage on every push, restore on
      //       boot. Survives the SPA's accidental full-page reloads.
      //   (2) Listen for `change` events on every file input on the page

      //       FileReader directly, bypassing whatever the bundle does.
      //   (3) Reset bucket only on successful end-of-day send (existing).

          // 5MB sessionStorage limit (each ~150KB photo).

          sessionStorage.setItem("citizenGas.photoBucket", JSON.stringify(b));
        } catch (e) { /* quota exceeded — just continue */ }
      }
      function restoreBucket() {
        try {
          var raw = sessionStorage.getItem("citizenGas.photoBucket");
          if (!raw) return;
          var arr = JSON.parse(raw);

            window.__cgPhotoBucket = arr;

      window.__cgPhotoBucket.push = function () {
        var r = origPush.apply(this, arguments);

        return r;

        try { window.__cgPhotoBucket = []; } catch (e) {}
        try { sessionStorage.removeItem("citizenGas.photoBucket"); } catch (e) {}
      };

      // NOTE on aggressive sizing:
      // Netlify Functions cap each request body at ~6 MB. Resend's envelope

              canvas.height = th;

      // (manual address screen, per-screen photo box, or Today's Jobs).

          var lab = (typeof window.cgInferCurrentLabel === "function")
            ? (window.cgInferCurrentLabel() || "")
            : "";

            window.cgPhotoSections.setPhoto(lab, dataUrl);
          }
          return lab;
        } catch (e) { return ""; }
      }

        if (typeof dataUrl !== "string") return;
        if (dataUrl.indexOf("data:image/") !== 0) return;

            // recognised label and the previous entry had none, upgrade it.

            return;
          }

              b[i].dataUrl.length === dataUrl.length &&
              b[i].dataUrl.slice(0, 200) === dataUrl.slice(0, 200)) {
            var lab1 = tagAndMap(dataUrl);
            if (lab1 && !b[i].fnLabel) b[i].fnLabel = lab1;
            return;
          }

        var fnLabel = tagAndMap(dataUrl);

        // save CPU. Otherwise downscale before storing.

          }

          // upload pass uses this exact value).
          if (fnLabel && window.cgPhotoSections && typeof window.cgPhotoSections.setPhoto === "function") {
            try { window.cgPhotoSections.setPhoto(fnLabel, compressed); } catch (e) {}
          }
          window.__cgPhotoBucket.push({ dataUrl: compressed, capturedAt: Date.now(), fnLabel: fnLabel });

      }
      window.cgPushPhotoIfNew = pushIfNew;
      function blobUrlToDataUrl(blobUrl) {
        try {
          fetch(blobUrl).then(function (r) { return r.blob(); }).then(function (blob) {
            var fr = new FileReader();
            fr.onload = function () { pushIfNew(fr.result); };
            fr.readAsDataURL(blob);
          }).catch(function () {});
        } catch (e) {}

      function scanImg(node) {
        if (!node || node.nodeType !== 1) return;
        if (node.tagName === "IMG") {

        if (node.querySelectorAll) {

          for (var i = 0; i < imgs.length; i++) {

    (function () {

      // ── Cloud queue: POST visit data to /api/submissions when queued locally ──
      // The body sent to the admin is SANITISED so the ON-SITE DOCUMENTATION
      // and MATERIALS USED sections — which are internal record-keeping for
      // the engineer's phone — never get scraped onto the certificate's
      // Faults/Notes column. The Engineer line is preserved because the
      // engineer's name, Gas Safe Reg and Licence MUST appear on the cert.
      function sanitizeBodyForCert(rawBody) {
        if (typeof rawBody !== "string" || !rawBody) return rawBody;
        var lines = rawBody.split(/\r?\n/);
        var out = [];
        // Sections that should be stripped entirely from the cert-bound body.
        // Each section starts at a heading line and runs until the next blank
        // line followed by a recognised next section, or until the property
        // separator '==============================', or until end of input.
        var STRIP_HEADINGS = [
          "ON-SITE DOCUMENTATION",
          "MATERIALS USED"
        ];
        // Headings that legitimately follow and end a stripped section.
        var KNOWN_HEADINGS = [
          "PROPERTY ", "ACCESS", "ALARMS", "APPLIANCE ", "COOKER ",
          "FAULTS", "FAULT ", "ON-SITE DOCUMENTATION", "MATERIALS USED"
        ];
        function isKnownHeading(t) {
          var u = t.trim().toUpperCase();
          for (var i = 0; i < KNOWN_HEADINGS.length; i++) {
            if (u === KNOWN_HEADINGS[i].trim() ||
                u.indexOf(KNOWN_HEADINGS[i]) === 0) return true;
          }
          return false;
        }
        function isStripHeading(t) {
          var u = t.trim().toUpperCase();
          for (var i = 0; i < STRIP_HEADINGS.length; i++) {
            if (u === STRIP_HEADINGS[i]) return true;
          }
          return false;
        }
        var i = 0;
        while (i < lines.length) {
          var L = lines[i];
          // Strip ON-SITE DOCUMENTATION / MATERIALS USED sections (these are
          // engineer-only records that pollute the cert's Faults column).
          if (isStripHeading(L)) {
            // skip heading + dashed underline + content until
            // next blank-then-known-heading or property separator.
            i++;
            while (i < lines.length) {
              var ln = lines[i];
              if (/^=+\s*$/.test(ln.trim())) break; // property separator
              // peek: blank line followed by another known heading ends section
              if (ln.trim() === "") {
                var j = i + 1;
                while (j < lines.length && lines[j].trim() === "") j++;
                if (j >= lines.length) { i = j; break; }
                if (isKnownHeading(lines[j])) {
                  // don't keep the trailing blank, advance to j
                  i = j;
                  break;
                }
              }
              i++;
            }
            continue;
          }
          out.push(L);
          i++;
        }

        var cleaned = out.join("\n").replace(/\n{3,}/g, "\n\n");
        return cleaned;
      }

      function pushLatestToCloud() {
        try {
          var queue = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]");
          if (!queue.length) return;
          var latest = queue[queue.length - 1];
          if (!latest || latest._cloudSent) return;
          var profile = null;
          try { profile = JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "null"); } catch (e) {}
          var safeBody = sanitizeBodyForCert(latest.body);
          fetch("/api/submissions", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              subject: latest.subject,
              body: safeBody,
              engineer: profile,
            }),
          }).then(function (r) {
            if (!r.ok) return;
            // mark as cloud-sent so we don't double-post
            try {
              var q2 = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]");
              for (var i = q2.length - 1; i >= 0; i--) {
                if (q2[i].id === latest.id) { q2[i]._cloudSent = true; break; }
              }

            } catch (e) {}
          }).catch(function () { /* best-effort; engineer can retry by Done */ });

      // The 'queued' event fires when the engineer taps Send on /review.

      // the engineer's phone dies before they finish the day. The 'Sent'
      // overlay (with Done button) is now driven by handleJobFinished()

      window.addEventListener("citizenGas:queued", function () {

      doneBtn.addEventListener("click", function () {

        // dismissing the overlay. The send modal handles success/cancel
        // and the engineer can dismiss the overlay separately.
        if (doneBtn.dataset.endOfDay === "1") {
          if (typeof window.cgFinishDay === "function") {
            window.cgFinishDay();

          return;
        }

        //
        // BUG-FIX (Visit-1 / Visit-2 capture loss):
        // Previously this branch wiped most citizenGas.* localStorage keys
        // (everything except engineerProfile and queue). That included
        // citizenGas.daybook — so if this branch ever fired between cert
        // sends, the engineer's already-captured certs would silently
        // disappear. We now leave per-day state alone here. The proper
        // end-of-day clear happens in actuallySendDaybook after a
        // successful email.
        overlay.classList.remove("show");
        pushLatestToCloud(); // best-effort retry
      });

      // ── In-app admin chip → same gated path as the sign-in admin chip ──
      var adminBtn = document.getElementById("cg-admin-btn");
      var ADMIN_PASSWORD = "Test";

      adminBtn.addEventListener("click", function () {

          sessionStorage.setItem("gsAdminAuth", "1");
          sessionStorage.setItem("gsAdminKey", ADMIN_PASSWORD);
        } catch (e) {}

      });

      function isSignedIn() {
        try {
          var raw = localStorage.getItem("citizenGas.engineerProfile");
          if (!raw) return false;
          var p = JSON.parse(raw);
          return !!(p && (p.fullName || p.gasSafeRegNo || p.licenceNo));
        } catch (e) { return false; }
      }

      // ── Sign-in screen Admin button → password prompt → /admin/ ──
      var signinAdmin = document.getElementById("cg-signin-admin-btn");

      signinAdmin.addEventListener("click", function () {
        var pw = window.prompt("Enter admin password:");
        if (pw === null) return;
        if (pw !== ADMIN_PASSWORD) {

          return;
        }

      function refreshAdminBtns() {

      }

      // ===========================================================
      // Engineer slot picker + Today's Jobs overlay
      // ===========================================================

      var SLOT_KEY_LS = "citizenGas.slotId";
      var slotPickerEl = document.getElementById("cg-slot-picker");
      var slotSelectEl = document.getElementById("cg-slot-select");
      var jobsOverlay = document.getElementById("cg-jobs-overlay");
      var jobsListEl = document.getElementById("cg-jobs-list");
      var jobsWhoEl = document.getElementById("cg-jobs-who");
      var jobsSkipBtn = document.getElementById("cg-jobs-skip");

      function loadSlotsFromCloud() {

      // Detect if the sign-in screen is currently rendered. Cheap heuristic: an

      function isSignInScreen() {

      }

      function refreshSlotPickerVisibility() {
        // Show the picker whenever the sign-in screen is rendered — even for

      function fetchPendingJobs() {

        try { slotId = localStorage.getItem(SLOT_KEY_LS) || ""; } catch (e) {}

      function showJobsOverlay(jobs) {
        var profile = null;
        try { profile = JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "null"); } catch (e) {}
        var slotLabel = "";
        try {
          var slotId = localStorage.getItem(SLOT_KEY_LS) || "";

          var weekend = (ldow === "Sat" || ldow === "Sun");

      function hideJobsOverlay() { jobsOverlay.classList.remove("show"); }

      jobsSkipBtn.addEventListener("click", hideJobsOverlay);

      // ====== Pre-fill the address screen from a chosen job ======

      // Stash the chosen job so we can fill the address fields when the
      // address screen mounts.
      var pendingJob = null;

      function startJob(job) {
        pendingJob = job;
        hideJobsOverlay();
        // Click "Start visit" / equivalent on /home so the React app navigates
        // to /property/address. We try several strategies in order.
        clickStartVisit().then(function () {
          waitForAddressScreen(8000).then(function () {
            fillAddressFields(job);
          }).catch(function () { /* user can fill manually */ });
        });
      }

      function isOnAddressScreen() {
        // Council app uses HASH routing: /#/property/address.
        var h = (location.hash || "").replace(/^#/, "");
        return h.indexOf("/property/address") === 0
            || location.pathname.indexOf("/property/address") === 0;
      }

      function clickStartVisit() {
        // The Council home screen has a primary CTA on /home. The element is a
        // <div> with onclick (text "Start new job"), not a <button>/<a>. We try
        // by attribute first, then by text.
        return new Promise(function (resolve) {
          if (isOnAddressScreen()) return resolve();
          var attempts = 0;
          var iv = setInterval(function () {
            attempts++;
            // (1) Anchor pointing to /property/address (path or hash).
            var link = document.querySelector('a[href$="/property/address"], a[href$="#/property/address"]');
            if (link) { clearInterval(iv); link.click(); return resolve(); }
            // (2) Any element whose visible text is or contains the home CTA.
            // Council home tile reads "Start new job" (sometimes with a subtitle).
            // We iterate from leaves to root by collecting candidates and
            // sorting by ascending text length — innermost match wins.
            var all = document.querySelectorAll("button, a, div, [role=button]");
            var ctaNeedles = ["start new job", "start visit", "new visit", "new property"];
            var hits = [];
            for (var i = 0; i < all.length; i++) {
              var el = all[i];
              if (el.children.length > 4) continue; // skip large page containers
              var t = (el.textContent || "").trim().toLowerCase();
              if (!t || t.length > 120) continue;
              for (var n = 0; n < ctaNeedles.length; n++) {
                if (t.indexOf(ctaNeedles[n]) !== -1) {
                  hits.push({ el: el, len: t.length });
                  break;
                }
              }
            }
            if (hits.length) {
              // Pick the shortest-text match (most specific to the CTA tile).
              hits.sort(function (a, b) { return a.len - b.len; });
              var matchEl = hits[0].el;
              // Climb to nearest ancestor with an onclick handler (React puts
              // it on the wrapper div, not the inner text span). Stop climbing
              // once we've moved up to a too-large parent.
              var target = matchEl;
              for (var d = 0; d < 4 && target; d++) {
                if (target.onclick || target.getAttribute("role") === "button") break;
                target = target.parentElement;
                if (target && (target.children.length > 6 || (target.textContent || "").length > 200)) {
                  target = matchEl; // bail — clicking the inner element is safer
                  break;
                }
              }
              if (!target) target = matchEl;
              clearInterval(iv);
              target.click();
              return resolve();
            }
            // (3) Hard fallback: hash navigation (Council app uses HashRouter).
            if (attempts >= 10) {
              clearInterval(iv);
              try {
                location.hash = "#/property/address";
                window.dispatchEvent(new HashChangeEvent("hashchange"));
              } catch (e) {}
              return resolve();
            }
          }, 200);
        });
      }

      function waitForAddressScreen(timeoutMs) {
        return new Promise(function (resolve, reject) {
          var start = Date.now();
          var iv = setInterval(function () {
            // Address screen has 3 inputs (placeholders: "e.g. 23 Church Road",
            // "e.g. Coventry", "e.g. CV1 1SD"). We probe by URL + input count.
            var inputs = document.querySelectorAll('input[type="text"], input:not([type])');
            if (isOnAddressScreen() && inputs.length >= 3) { clearInterval(iv); return resolve(inputs); }
            if (Date.now() - start > timeoutMs) { clearInterval(iv); return reject(new Error("timeout")); }
          }, 100);
        });
      }

      function setReactInputValue(el, value) {
        var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
        setter.call(el, value);

        el.dispatchEvent(new Event("change", { bubbles: true }));
      }

      function fillAddressFields(job) {
        // Find the three address inputs by looking for their visible labels above.
        // The screen typically has Address 1, Address 2 (optional), Postcode.
        var inputs = document.querySelectorAll('input[type="text"], input:not([type])');
        if (inputs.length < 3) return;
        // We don't know exact ordering; map by adjacent label text if possible.
        var byLabel = {};
        inputs.forEach(function (inp) {
          var labelText = "";
          // Walk up to nearest label container.
          var p = inp;
          for (var i = 0; i < 5 && p; i++) {
            var lab = p.previousElementSibling && p.previousElementSibling.textContent;
            if (lab && lab.trim()) { labelText = lab.trim().toLowerCase(); break; }
            // Or a label inside the parent.
            if (p.parentElement) {
              var inLabel = p.parentElement.querySelector("label");
              if (inLabel && inLabel.textContent) { labelText = inLabel.textContent.trim().toLowerCase(); break; }
            }
            p = p.parentElement;
          }
          byLabel[labelText] = inp;
        });
        // Heuristic mapping.
        // Council placeholders: "e.g. 23 Church Road", "e.g. Coventry", "e.g. CV1 1SD".
        var a1 = findInputByPlaceholderLike(inputs, ["church road", "address line 1", "address 1"]) || inputs[0];
        var a2 = findInputByPlaceholderLike(inputs, ["coventry", "town", "address 2"]) || inputs[1];
        var pc = findInputByPlaceholderLike(inputs, ["cv1", "postcode", "post code"]) || inputs[2];
        if (a1) setReactInputValue(a1, job.address1 || "");
        if (a2) setReactInputValue(a2, job.address2 || "");
        if (pc) setReactInputValue(pc, job.postcode || "");
      }

      function findInputByPlaceholderLike(inputs, needles) {
        for (var i = 0; i < inputs.length; i++) {
          var ph = (inputs[i].placeholder || "").toLowerCase();
          for (var n = 0; n < needles.length; n++) {
            if (ph.indexOf(needles[n]) !== -1) return inputs[i];
          }
        }
        return null;
      }

      function findInputByLabelLike(inputs, needles) {
        for (var i = 0; i < inputs.length; i++) {
          var inp = inputs[i];
          // Climb to common parent and read sibling text.
          var ctx = inp;
          for (var depth = 0; depth < 4 && ctx; depth++) {
            var txt = (ctx.textContent || "").toLowerCase();
            for (var n = 0; n < needles.length; n++) {
              if (txt.indexOf(needles[n]) !== -1) return inp;
            }
            ctx = ctx.parentElement;
          }
        }
        return null;
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
        });
      }

      // ====== Job-completion + multi-job continuation ======
      // After every Send: (1) mark this job complete server-side,
      // (2) refetch remaining jobs for the slot, (3) either return to
      // Today's Jobs (more remaining) OR show the end-of-day Sent overlay.
      var lastStartedJobId = null;
      var origStartJob = startJob;
      startJob = function (job) {
        lastStartedJobId = job.id;
        return origStartJob(job);
      };

      // Track locally-completed jobs for this session so a stale server
      // response (Netlify Blobs are eventually consistent) can't make the
      // engineer re-do a job they just finished. Keyed by London-today date
      // so completions naturally clear at midnight.
      var COMPLETED_KEY = "citizenGas.completedJobIds";
      function londonTodayKey() {
        try {
          return new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" });
        } catch (e) { return new Date().toISOString().slice(0, 10); }
      }
      function getCompletedSet() {
        try {
          var raw = sessionStorage.getItem(COMPLETED_KEY);
          if (!raw) return {};
          var obj = JSON.parse(raw);
          // Drop entries for any other date — only keep today.
          var today = londonTodayKey();
          if (obj.date !== today) return {};
          return obj.ids || {};
        } catch (e) { return {}; }
      }
      function addCompletedId(id) {
        if (!id) return;
        try {
          var ids = getCompletedSet();
          ids[id] = 1;
          sessionStorage.setItem(COMPLETED_KEY, JSON.stringify({
            date: londonTodayKey(),
            ids: ids,
          }));
        } catch (e) {}
      }

      function markJobCompleteAndContinue() {
        var slotId = "";
        try { slotId = localStorage.getItem(SLOT_KEY_LS) || ""; } catch (e) {}
        if (!slotId) {
          // No slot context (engineer used 'Or enter address manually' from
          // home). Treat as end-of-day.
          showEndOfDayOverlay();
          return;
        }
        var jobId = lastStartedJobId;
        lastStartedJobId = null;

        // Optimistically record the completion locally BEFORE the server call.
        // This way even if the POST fails or Blobs is stale, we won't ask the
        // engineer to re-do this job.
        if (jobId) addCompletedId(jobId);

        // Mark this job complete (best-effort), THEN refetch.
        var done = jobId
          ? fetch("/api/jobs/complete", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ id: jobId, slotId: slotId }),
            }).catch(function () {})
          : Promise.resolve();

        done.then(function () {
          return fetchPendingJobs();
        }).then(function (jobs) {
          // Filter out anything we already completed locally. Protects against
          // Netlify Blobs eventual-consistency (where a just-deleted job can
          // still appear in a GET that fires moments after the DELETE/POST).
          var completedIds = getCompletedSet();
          var remaining = (jobs || []).filter(function (j) {
            return !completedIds[j.id];
          });
          if (remaining.length) {
            // More to do — return to Today's Jobs without showing the

    // or the next ====== separator, or end of input.
    const lines = txt.split(/\r?\n/);
    let start = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim() === heading) { start = i + 1; break; }
    }
    if (start === -1) return null;
    // Skip dashed underline if present.
    if (start < lines.length && /^-+$/.test(lines[start].trim())) start++;
    const KNOWN = [
      "PROPERTY ", "ACCESS", "ALARMS", "APPLIANCE 1", "APPLIANCE 2", "APPLIANCE 3",
      "COOKER CAP", "COOKER INSTALL", "FAULTS", "FAULT ", "ON-SITE DOCUMENTATION", "MATERIALS USED"
    ];
    let end = lines.length;
    for (let j = start; j < lines.length; j++) {
      const ln = lines[j].trim();
      if (/^=+$/.test(ln)) { end = j; break; }
      if (j > start && lines[j - 1].trim() === "" && KNOWN.some(k => ln === k.trim() || ln.indexOf(k) === 0)) {
        end = j - 1;
        break;
      }
    }
    return lines.slice(start, end).join("\n").trim();
  }

  function parseProperty(txt) {
    // Detect no-access first.
    const access = getSection(txt, "ACCESS");
    const certRef = getField(txt, "Cert Ref") || "";
    const address1 = getField(txt, "Install Address 1") || "";
    const address2 = getField(txt, "Install Address 2") || "";
    const postcode = getField(txt, "Install Postcode") || "";
    const visit = parseInt(getField(txt, "Visit") || "1", 10);
    const date = getField(txt, "Date") || "";

    if (!certRef && !address1) return null;

    const noAccess = access && /no access gained/i.test(access);

    // Alarms
    const alarmsBlock = getSection(txt, "ALARMS");
    const alarmField = (label) => {
      if (!alarmsBlock) return null;
      const m = alarmsBlock.match(new RegExp(label + ":\\s*(\\w+)", "i"));
      return m ? m[1] : null;
    };
    const coAlarm = alarmField("Carbon Monoxide Alarm");
    const fireAlarm = alarmField("Fire Alarm");
    const hasGas = !alarmsBlock; // ALARMS section is only emitted when !hasGas

    // Appliances
    const appliances = [];
    function readAppliance(heading, isVisualOnly) {
      const blk = getSection(txt, heading);
      if (!blk) return null;
      return {
        heading,
        location: (blk.match(/Location:\s*(.+)/) || [])[1] || "",
        type: (blk.match(/Type:\s*(.+)/) || [])[1] || "",
        make: (blk.match(/Make:\s*(.+)/) || [])[1] || "",
        model: (blk.match(/Model:\s*(.+)/) || [])[1] || "",
        heatInput: (blk.match(/Heat Input:\s*(.+)/) || [])[1] || "",
        operatingPressure: (blk.match(/Operating Pressure:\s*(.+)/) || [])[1] || "",
        visualOnly: !!isVisualOnly,
      };
    }
    const a1 = readAppliance("APPLIANCE 1", false); if (a1) appliances.push(a1);
    const a2 = readAppliance("APPLIANCE 2", false); if (a2) appliances.push(a2);
    const a3 = readAppliance("APPLIANCE 3", true);  if (a3) appliances.push(a3);

    // Faults (multiple FAULT N blocks, or "None reported.")
    const faults = [];
    const faultRegex = /FAULT \d+\s*\nFault Details:\s*(.+?)\nRemedial Work Taken:\s*(.+?)\nWarning Notice Fixed:\s*(\w+)(?:\nWarning Notice Notes:\s*(.+?))?(?=\n\n|\nFAULT |\n=+|\nMATERIALS USED|\nON-SITE|$)/gms;
    let fm;
    while ((fm = faultRegex.exec(txt)) !== null) {
      faults.push({
        details: (fm[1] || "").trim(),
        remedial: (fm[2] || "").trim(),
        warningNotice: /yes/i.test(fm[3] || "") ? "Yes" : "No",
      });
    }

    // Materials Used (engineer-only, do NOT emit to cert).
    // FEATURE (Materials in daily email): preserve the engineer's MATERIALS
    // USED section per property as both a raw text blob and a parsed list of
    // line items, so the daily email body can summarise materials used.
    var materialsBlock = getSection(txt, "MATERIALS USED");
    var materialsList = [];
    if (materialsBlock) {
      // Split into non-empty trimmed lines. Engineer SPA typically writes one
      // material per line or as "<qty> x <item>" / bullet style. We normalise
      // by stripping leading bullets/dashes/numbering.
      materialsBlock.split(/\r?\n/).forEach(function (ln) {
        // Strip ONLY leading bullet markers: "- ", "* ", "• ",
        // and numbered list markers like "1. " or "1) " — but NEVER strip
        // a bare leading digit (e.g. "1 x Gas hose" must stay intact).
        var t = ln.replace(/^\s*([-*•]|\d+[\.\)])\s+/, "").trim();
        if (t) materialsList.push(t);
      });
    }
    // Documentation flags (engineer-only)
    return {
      certRef,
      address1, address2, postcode,
      visit, date,
      noAccess,
      hasGas,
      coAlarm: coAlarm ? /yes/i.test(coAlarm) : null,
      fireAlarm: fireAlarm ? /yes/i.test(fireAlarm) : null,
      appliances,
      faults,
      materialsBlock: materialsBlock || "",
      materials: materialsList,
    };
  }

  // ---------- PHOTO HARVESTER ----------
  // BUG-FIX (Photo capture loss):
  // Two-source harvest. The DOM scrape (legacy) and the global photo bucket
  // (filled by the FileReader hook in <head>) are MERGED and deduped by
  // dataUrl. The bucket guarantees we don't miss photos when the auto-skip
  // review races the React render — those photos are already in the bucket
  // because FileReader produced them earlier in the engineer flow.
  function harvestPhotosFromReview() {
    const photos = []; // [{label, dataUrl, addr}]
    const seen = Object.create(null);

    // Source 1: DOM <img src="data:image/..."> (label + addr available here).
    const imgs = document.querySelectorAll("img");
    imgs.forEach(img => {
      const src = img.getAttribute("src") || "";
      if (!src.startsWith("data:image/")) return;
      if (seen[src]) return;
      seen[src] = true;
      let label = "";
      const parent = img.closest("div");
      if (parent) {
        const txt = (parent.textContent || "").trim().toLowerCase();
        if (txt.length < 80) label = txt;
      }
      // Also try data-testid for label (more reliable than text).
      if (!label) {
        const t = img.getAttribute("data-testid") || "";
        const m = t.match(/img-review-([a-z-]+?)(?:-\d+)?$/i);
        if (m) label = m[1].replace(/-/g, " ");
      }
      let addr = "";
      let walker = img.parentElement;
      for (let depth = 0; depth < 12 && walker; depth++) {
        const h = walker.querySelector && walker.querySelector("h2, h3, h4, [class*='Heading']");
        if (h && h.textContent && h.textContent.length < 200) { addr = h.textContent.trim(); break; }
        walker = walker.parentElement;
      }
      photos.push({ label, dataUrl: src, addr });
    });

    // Source 2: global photo bucket (FileReader-hooked). Photos here have no
    // DOM context (label/addr) so we tag them as "capture" — the admin PDF
    // generator already labels them as "Photo N" if no label is set.
    try {
      const bucket = (window.__cgPhotoBucket || []);
      bucket.forEach(p => {
        if (!p || !p.dataUrl) return;
        if (seen[p.dataUrl]) return;
        seen[p.dataUrl] = true;
        photos.push({ label: (p.fnLabel || "capture"), fnLabel: p.fnLabel || "", dataUrl: p.dataUrl, addr: "" });
      });
    } catch (e) {}

    return photos;
  }

  // ---------- BUILD CERT RECORD ----------
  // Convert a parsed property + harvested photos into the admin's record shape.
  //
  // Bug 2 fix: Use the engineer-entered date (prop.date, in DD/MM/YYYY format)
  // for BOTH certDate (date of work) AND inspectionDate (next inspection due,
  // exactly 12 months after work date). NEVER fall back to today.
  function parseEngineerDate(s) {
    if (!s || typeof s !== "string") return null;
    // Accept DD/MM/YYYY (engineer form output) or YYYY-MM-DD.
    var m1 = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (m1) {
      var d = new Date(Date.UTC(+m1[3], +m1[2] - 1, +m1[1], 12, 0, 0));
      if (!isNaN(d.getTime())) return d;
    }
    var m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m2) {
      var d2 = new Date(Date.UTC(+m2[1], +m2[2] - 1, +m2[3], 12, 0, 0));
      if (!isNaN(d2.getTime())) return d2;
    }
    return null;
  }

  function buildRecord(prop, engineerProfile, photos, functionMap) {
    // BUG 2 FIX: Use the engineer-entered date, not today.
    const workDate = parseEngineerDate(prop.date) || new Date();
    const certDate = workDate.toISOString();
    // Next inspection due: 12 months after the work date (UTC arithmetic to
    // avoid DST drift).
    const nextDue = new Date(Date.UTC(
      workDate.getUTCFullYear() + 1,
      workDate.getUTCMonth(),
      workDate.getUTCDate(),
      12, 0, 0
    ));
    const inspectionDate = nextDue.toISOString();

    const engineerData = Object.assign({}, COMPANY_DEFAULTS, {
      gasSafeNo: engineerProfile && engineerProfile.gasSafeRegNo || "",
      engineerName: engineerProfile && engineerProfile.fullName || "",
      gasId: engineerProfile && engineerProfile.licenceNo || "",
      certDate,
    });

    const visitNumForCert = (typeof prop.visit === "number" && prop.visit) || parseInt(prop.visit || "1", 10) || 1;
    const certData = Object.assign({}, DEFAULT_CLIENT, {
      certRef: prop.certRef,
      instName: "The Tenant",
      instAddr1: prop.address1 || "",
      instAddr2: prop.address2 || "",
      instAddr3: "",
      instPostcode: prop.postcode || "",
      instTel: "NA",
      // BUG-FIX (Visit badge on PDF): persist the visit number so the admin
      // cert preview can render a bold "Visit 1" / "Visit 2" label under the
      // Certificate No. on the PDF.
      visit: visitNumForCert,
    });

    // Translate parsed appliances into the admin's wide record shape
    function naAppliance() {
      return {
        location: "", type: "", make: "", model: "", flueType: "",
        landlordsAppliance: "N/A", applianceInspected: "N/A",
        co2: "", co: "", combustion: "",
        operatingPressure: "", heatInput: "",
        spillageTest: "N/A", flueFlow: "N/A", ventilation: "N/A",
        flueVisual: "N/A", fluePerformance: "N/A",
        applianceServiced: "N/A", applianceSafe: "N/A", safetyDevices: "N/A",
      };
    }
    // VISIT 1 RULE (per user spec): cooker info MUST NOT appear on the
    // gas-safety certificate. Photos still flow through. APPLIANCE 2 is
    // therefore stripped from the appliances array on visit 1, even though
    // the engineer captured the cooker's location/make/pressure as part of
    // the cap-tightness workflow.
    const visitNum = (typeof prop.visit === "number" && prop.visit) || parseInt(prop.visit || "1", 10) || 1;
    const filteredApps = (prop.appliances || []).filter(function (a) {
      if (visitNum === 1 && a && a.heading === "APPLIANCE 2") return false;
      return true;
    });
    const appliances = filteredApps.map(a => {
      const base = naAppliance();
      base.location = a.location || base.location;
      base.type = a.type || base.type;
      base.make = a.make || base.make;
      // Model: render as "NA" if engineer didn't enter one (per user spec).
      base.model = (a.model && a.model.trim()) ? a.model.trim() : "NA";
      base.heatInput = a.heatInput || base.heatInput;
      base.operatingPressure = a.operatingPressure || base.operatingPressure;
      if (a.visualOnly) {
        // BUG-FIX (Task 1 — gas fire row blank on cert):
        // Gas fire is a visual-only inspection per the engineer's spec, but
        // the certificate row must still be POPULATED — all-N/A reads as
        // "not inspected" on the printed cert. Mirror the cooker's pattern:
        // mark inspected + safe with Pass for the visual-only checks, NA
        // for the readings that don't apply to a visual-only fire.
        if (a.heading === "APPLIANCE 3") {
          base.flueType = "OF"; // open-flue (typical for living-room gas fires)
          base.landlordsAppliance = "Yes";
          base.applianceInspected = "Yes";
          base.applianceSafe = "Yes";
          base.safetyDevices = "Yes";
          base.ventilation = "Pass";
          base.flueVisual = "Pass";
          base.fluePerformance = "Pass";
          base.applianceServiced = "No";
          base.spillageTest = "Pass";
          base.flueFlow = "Pass";
          base.co2 = "N/A"; base.co = "N/A"; base.combustion = "N/A";
          // Heat Input + Operating Pressure stay as the engineer entered them
          // (or empty/NA if they left them blank); we don't force a number
          // because visual-only fires are not metered.
          if (!base.heatInput) base.heatInput = "N/A";
          if (!base.operatingPressure) base.operatingPressure = "N/A";
        }
      } else {
        base.flueType = a.heading === "APPLIANCE 1" ? "RS" : (a.heading === "APPLIANCE 2" ? "FL" : "");
        base.applianceInspected = "Yes";
        base.applianceSafe = "Yes";
        base.safetyDevices = "Yes";
        base.ventilation = a.heading === "APPLIANCE 1" ? "Pass" : "Yes";
        base.flueVisual = a.heading === "APPLIANCE 1" ? "Pass" : "N/A";
        base.fluePerformance = a.heading === "APPLIANCE 1" ? "Pass" : "N/A";
        base.applianceServiced = "No";
        base.landlordsAppliance = a.heading === "APPLIANCE 1" ? "Yes" : "No";
        if (a.heading === "APPLIANCE 1") {
          base.co2 = "10.06 %"; base.co = "66 ppm"; base.combustion = "0.0019";
          base.operatingPressure = base.operatingPressure || "NA";
        } else if (a.heading === "APPLIANCE 2") {
          base.co2 = "NA"; base.co = "NA"; base.combustion = "NA";
          base.heatInput = "NA";
        }
      }
      return base;
    });

    // Faults
    const faults = (prop.faults || []).map(f => ({
      details: f.details || "",
      remedial: f.remedial || "",
      warningNotice: f.warningNotice === "Yes" ? "Yes" : "No",
    }));

    // FINAL CHECKS — Feature 2 logic
    let finalChecks;
    if (prop.hasGas === false) {
      // No-gas: 5 main checks NO. CO/Smoke alarms follow engineer answer.
      finalChecks = {
        gasTightness: "NO",
        pipeworkVisual: "NO",
        emergencyControl: "NO",
        bonding: "NO",
        installationPass: "NO",
        coAlarm: prop.coAlarm ? "YES" : "NO",
        smokeAlarm: prop.fireAlarm ? "YES" : "NO",
        inspectionDate,
      };
      // Auto-add "No gas supply" fault if no faults entered
      if (faults.length === 0) {
        faults.push({ details: "No gas supply", remedial: "—", warningNotice: "No" });
      }
      // BUG-FIX (No-gas property): the cert appliance details table must show
      // "No gas appliances" at Location 1 instead of being blank, so anyone
      // reading the cert immediately sees there are no gas appliances.
      // Replace whatever appliances were parsed (typically none for a no-gas
      // property) with a single placeholder row at location 1.
      appliances.length = 0;
      var noGasRow = naAppliance();
      noGasRow.location = "Location 1";
      noGasRow.type = "No gas appliances";
      noGasRow.make = "N/A";
      noGasRow.model = "N/A";
      noGasRow.flueType = "N/A";
      noGasRow.heatInput = "N/A";
      noGasRow.operatingPressure = "N/A";
      noGasRow.co2 = "N/A";
      noGasRow.co = "N/A";
      noGasRow.combustion = "N/A";
      noGasRow.landlordsAppliance = "N/A";
      noGasRow.applianceInspected = "N/A";
      noGasRow.applianceSafe = "N/A";
      noGasRow.safetyDevices = "N/A";
      noGasRow.ventilation = "N/A";
      noGasRow.flueVisual = "N/A";
      noGasRow.fluePerformance = "N/A";
      noGasRow.spillageTest = "N/A";
      noGasRow.flueFlow = "N/A";
      noGasRow.applianceServiced = "N/A";
      appliances.push(noGasRow);
    } else {
      finalChecks = {
        gasTightness: "YES",
        pipeworkVisual: "YES",
        emergencyControl: "YES",
        bonding: "YES",
        installationPass: "YES",
        coAlarm: "YES",
        smokeAlarm: "YES",
        inspectionDate,
      };
    }

    // Photos: attach those that look like they belong to this property.
    // BUG 3 FIX: If a single send has just one property (the common case —
    // engineer sends each cert separately), every harvested photo belongs to
    // that property, no matter what the addr-match heuristic says.
    // The caller (sweepQueue/ingestQueueItem) tells us via prop._singleSend
    // whether the body has just one property.
    const attachedPhotos = (photos || []).filter(ph => {
      if (!ph || !ph.dataUrl) return false;
      if (prop._singleSend) return true; // single-property body — take all
      // Multi-property body: try to match by address.
      const propAddrFlat = (prop.address1 + " " + prop.postcode).toLowerCase();
      const phAddrFlat = (ph.addr || "").toLowerCase();
      return phAddrFlat.includes((prop.address1 || "").toLowerCase()) ||
             propAddrFlat.includes(phAddrFlat) ||
             ph.addr === ""; // attach unknown photos to all (de-dup later if needed)
    });

    return {
      id: "rec_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      certData,
      appliances,
      faults,
      finalChecks,
      signatureData: {},
      engineerData,
      // Photos: prefer the function-keyed map captured per screen
      // (Door / Cooker | Hob / Gas Fire / Boiler / Fault / Warning Notice
      // / Materials).  Each entry becomes one cert.photos slot with the
      // function name as its label.  Fall back to the legacy bucket-
      // dedup path when no functionMap is present (older queue entries
      // pinned before this change shipped).
      photos: (function () {
        if (functionMap && typeof functionMap === "object") {
          var ORDER = ["Door", "Cooker", "Hob", "Gas Fire", "Boiler", "Fault", "Warning Notice", "Materials"];
          var out = [];
          for (var k = 0; k < ORDER.length; k++) {
            var lab = ORDER[k];
            var du = functionMap[lab];
            if (du) out.push({ label: lab, dataUrl: du });
          }
          return out;
        }
        // Legacy fallback: dedup bucket photos.
        var seen = Object.create(null);
        var out2 = [];
        for (var i = 0; i < attachedPhotos.length; i++) {
          var p = attachedPhotos[i];
          if (!p || !p.dataUrl) continue;
          var fp = p.dataUrl.length + "|" + p.dataUrl.slice(0, 200);
          if (seen[fp]) continue;
          seen[fp] = true;
          out2.push({ label: (p.fnLabel || p.label || "Photo"), dataUrl: p.dataUrl });
        }
        return out2;
      })(),
      // FEATURE (Materials in daily email): carry materials through to the cert
      // so the email body / admin import / JSON download can list them.
      materials: Array.isArray(prop.materials) ? prop.materials.slice() : [],
      savedAt: new Date().toISOString(),
    };
  }

  // ---------- BUG 1 + BUG 3 FIX ----------
  // The legacy approach (listen for citizenGas:queued, walk localStorage,
  // harvest photos with a 50 ms delay) was racy: photos disappeared from the
  // DOM as React navigated away, and entries that didn't parse on first pass
  // got marked _daybookSaved and lost forever.
  //
  // New approach:
  //   1. Monkey-patch localStorage.setItem so we run SYNCHRONOUSLY the
  //      moment React writes citizenGas.queue. The review-screen DOM is
  //      still mounted at this exact instant, so photos are harvestable.
  //   2. For every queue entry that doesn't already have a captured copy in
  //      the daybook (keyed by queue id, not certRef), parse its body and
  //      attach photos snapshotted RIGHT NOW.
  //   3. Also keep a fallback path on the citizenGas:queued event AND on
  //      finishDay so anything missed gets caught.

  // Records the queue ids we've already processed into the daybook, so we
  // never double-process and never lose entries.
  const PROCESSED_KEY = "citizenGas.daybookProcessed";
  // Photo pin: maps queue entry id → array of photos harvested at the
  // moment that entry was created. Survives across reloads.
  const PHOTO_PIN_KEY = "citizenGas.daybookPhotoPin";
  function readPhotoPin() {
    try { return JSON.parse(localStorage.getItem(PHOTO_PIN_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writePhotoPin(map) {
    try { localStorage.setItem(PHOTO_PIN_KEY, JSON.stringify(map)); } catch (e) {}
  }
  function readProcessed() {
    try { return JSON.parse(localStorage.getItem(PROCESSED_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeProcessed(map) {
    try { localStorage.setItem(PROCESSED_KEY, JSON.stringify(map)); } catch (e) {}
  }

  // Process exactly one queue entry into the daybook. Photos must be passed
  // in (already harvested), because by the time we async over to handle them
  // the DOM may be gone.
  function ingestQueueItem(item, photos, profile, functionMap) {
    if (!item || !item.id) return false;
    // BUG-FIX (Visit-1 / Visit-2 / no-access capture loss):
    //
    // We used to block reprocessing on `processed[item.id]`. That made the
    // pipeline fragile: any path that wiped the daybook (legacy doneBtn,
    // accidental midnight-rollover archive, manual cleanup) but left the
    // `processed` map intact would silently lose certs forever — re-sweeps
    // would skip the queue entry and the cert never reappeared.
    //
    // New approach: ALWAYS re-parse and re-merge. The dedup by
    // certRef|workDate inside the cert merge is idempotent, so reprocessing
    // is safe. We still write `processed` to record what we've seen (for
    // diagnostics and photo-pin cleanup), but we no longer use it to gate
    // ingestion. This means: if the daybook is empty when finishDay reads
    // it, the queue entries get re-ingested and the certs reappear.
    const processed = readProcessed();
    const alreadyProcessed = !!processed[item.id];

    const properties = parseDaybookBody(item.body || "");
    if (!properties.length) {
      // Mark as processed anyway so we don't keep retrying a malformed entry.
      processed[item.id] = { at: Date.now(), parsed: 0 };
      writeProcessed(processed);
      return false;
    }

    let daybook = readDaybook();
    // If the daybook is from a previous day, archive it and start a fresh
    // one. Also clear the processed-queue map so the new day captures
    // everything cleanly.
    if (daybook.date && daybook.date !== todayStamp()) {
      try {
        const archiveKey = "citizenGas.daybook.archive." + daybook.date;
        localStorage.setItem(archiveKey, JSON.stringify(daybook));
      } catch (e) {}
      daybook = { date: "", certs: [], noAccess: [] };
      writeProcessed({});
    }
    if (!daybook.date) daybook.date = todayStamp();
    daybook.engineer = profile || daybook.engineer || {};
    daybook.certs = daybook.certs || [];
    daybook.noAccess = daybook.noAccess || [];

    const singleSend = properties.length === 1;
    properties.forEach(function (prop) {
      prop._singleSend = singleSend;
      if (prop.noAccess) {
        // BUG-FIX: Dedup no-access entries by address1+postcode+date so
        // re-ingesting the same queue entry doesn't pile up duplicates.
        var naKey = (prop.address1 || "") + "|" + (prop.postcode || "") + "|" + (prop.date || "");
        var alreadyHave = daybook.noAccess.some(function (n) {
          return ((n.address1 || "") + "|" + (n.postcode || "") + "|" + (n.date || "")) === naKey;
        });
        if (!alreadyHave) {
          daybook.noAccess.push({
            address1: prop.address1,
            address2: prop.address2,
            postcode: prop.postcode,
            date: prop.date || todayStamp(),
            // FEATURE (Materials in daily email): include any materials the
            // engineer logged even on a no-access visit (e.g. card left).
            materials: Array.isArray(prop.materials) ? prop.materials.slice() : [],
          });
        }
      } else {
        const rec = buildRecord(prop, profile, photos, functionMap);
        // BUG 1 FIX: De-dup by certRef + work-date so two visits to the same
        // address on different days both survive, and a re-send of the same
        // visit (same date) replaces (doesn't duplicate). Previously dedup
        // was certRef-only, which caused returns/visit-2 to clobber visit-1.
        const refKey = (rec.certData.certRef || "") + "|" + (rec.engineerData.certDate || "").slice(0, 10);
        daybook.certs = daybook.certs.filter(function (r) {
          var existingKey = (r.certData.certRef || "") + "|" + (r.engineerData && r.engineerData.certDate ? r.engineerData.certDate.slice(0, 10) : "");
          return existingKey !== refKey;
        });
        daybook.certs.push(rec);
      }
    });

    writeDaybook(daybook);
    processed[item.id] = { at: Date.now(), parsed: properties.length, photoCount: (photos || []).length };
    writeProcessed(processed);
    // BUG-FIX: Do NOT free the photo pin here. We now allow re-ingestion
    // of any queue entry (in case the daybook was wiped between sends),
    // and re-ingestion needs the photos. The pin is cleared only when the
    // daybook is successfully emailed (actuallySendDaybook clears the
    // queue + pin together).
    return true;
  }

  function getCurrentProfile() {
    try { return JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "null"); }
    catch (e) { return null; }
  }

  // Walk the entire queue and ingest any unprocessed entries. Used as a
  // safety-net sweep on event, on a polling interval, and on finishDay.
  // For each queue entry, photos come from PHOTO_PIN_KEY (pinned at the
  // moment that entry was added). Falls back to latestPhotos for the last
  // entry if no pin exists (legacy / event-only path).
  function sweepQueue(latestPhotos) {
    let queue = [];
    try { queue = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]"); }
    catch (e) { return 0; }
    if (!queue.length) return 0;
    const profile = getCurrentProfile();
    const pin = readPhotoPin();
    let count = 0;
    queue.forEach(function (item, idx) {
      let photos = [];
      let functionMap = null;
      if (item && item.id && pin[item.id]) {
        var slot = pin[item.id];
        if (Array.isArray(slot)) {
          photos = slot;  // legacy array shape
        } else if (slot && typeof slot === "object") {
          photos = Array.isArray(slot.photos) ? slot.photos : [];
          functionMap = slot.functionMap || null;
        }
      } else if (idx === queue.length - 1 && latestPhotos && latestPhotos.length) {
        photos = latestPhotos;
      }
      if (ingestQueueItem(item, photos, profile, functionMap)) count++;
    });
    if (count) refreshDaybookButton();
    return count;
  }

  // ─── PHOTO SECTIONS — mandatory function-named photos per screen ────
  // Engineers must capture one photo per function on the relevant screen
  // (Door / Cooker | Hob / Gas Fire / Boiler / Fault / Warning Notice /
  // Materials).  The photo is keyed by function label inside a per-job
  // map persisted in sessionStorage; at queue-write time the map is
  // pinned alongside the queue id so buildRecord can convert it into the
  // function-keyed cert.photos array.  Continue/Next is blocked until
  // the photo is taken on screens where it's required.
  const PHOTO_FN_CURRENT_KEY = "citizenGas.photoFunctions.current";
  // sessionStorage so it lives across screen navigations within one job
  // and is naturally cleared on tab close / new job reset.
  function readCurrentFnMap() {
    try { return JSON.parse(sessionStorage.getItem(PHOTO_FN_CURRENT_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function writeCurrentFnMap(m) {
    try { sessionStorage.setItem(PHOTO_FN_CURRENT_KEY, JSON.stringify(m || {})); } catch (e) {}
  }
  function clearCurrentFnMap() {
    try { sessionStorage.removeItem(PHOTO_FN_CURRENT_KEY); } catch (e) {}
  }
  function setCurrentFnPhoto(label, dataUrl) {
    var m = readCurrentFnMap();
    m[label] = dataUrl;
    writeCurrentFnMap(m);
  }
  function getCurrentFnPhoto(label) {
    return readCurrentFnMap()[label] || null;
  }

  window.cgPhotoSections = {
    read: readCurrentFnMap,
    setPhoto: setCurrentFnPhoto,
    getPhoto: getCurrentFnPhoto,
    clear: clearCurrentFnMap,
  };

  // ── Screen detectors (route + body-text fingerprints) ──
  function _hash() {
    try { return String(window.location.hash || window.location.pathname || ""); } catch (e) { return ""; }
  }
  function _bodyText() { try { return document.body.innerText || ""; } catch (e) { return ""; } }

  function isOnAddressPage() {
    var h = _hash();
    if (h.indexOf("/property/address") !== -1) return true;
    return !!document.querySelector('[data-testid="input-address1"]');
  }
  function isOnBoilerPage() {
    var h = _hash();
    if (h.indexOf("/property/boiler") !== -1) return true;
    return !!document.querySelector('[data-testid="input-boiler-make"]');
  }
  function isOnFaultsPage() {
    var h = _hash();
    if (h.indexOf("/property/faults") !== -1) return true;
    return /Any faults\?/i.test(_bodyText());
  }
  function isOnMaterialsPage() {
    var h = _hash();
    if (h.indexOf("/property/materials") !== -1) return true;
    return /Were any materials used on this job\?/i.test(_bodyText());
  }

  // Yes/No screen-question state — reads the live React DOM by inspecting
  // the gradient class the bundle puts on the selected button.
  function _yesSelected(testid) {
    try {
      var btn = document.querySelector('[data-testid="' + testid + '-yes"]');
      if (!btn) return false;
      // The bundle marks the active answer with the citizen-gradient-bg
      // class (same pattern as visit selector).
      return /citizen-gradient-bg/.test(btn.className || "")
        || btn.getAttribute("aria-pressed") === "true";
    } catch (e) { return false; }
  }
  function gasFireYes() { return _yesSelected("button-fire"); }
  function cookerHobYes() { return _yesSelected("button-cooker"); }
  function faultsYes() { return _yesSelected("button-has-faults"); }
  function materialsYes() { return _yesSelected("button-materials-any"); }
  // Warning notice yes/no testid is `button-warning-${faultIdx}-yes/-no`.
  function anyWarningNoticeYes() {
    try {
      var btns = document.querySelectorAll('[data-testid^="button-warning-"]');
      for (var i = 0; i < btns.length; i++) {
        var t = btns[i].getAttribute("data-testid") || "";
        if (/^button-warning-\d+-yes$/.test(t)
            && (/citizen-gradient-bg/.test(btns[i].className || "")
                || btns[i].getAttribute("aria-pressed") === "true")) {
          return true;
        }
      }
    } catch (e) {}
    return false;
  }

  // The cooker/hob screen needs to know whether the engineer picked
  // Cooker or Hob.  The existing __cgCookerExtra carries that selection
  // (writeCookerExtraToStorage stores `type`).
  function cookerOrHobLabel() {
    var t = (window.__cgCookerExtra && window.__cgCookerExtra.type) || "";
    if (/^Hob$/i.test(t)) return "Hob";
    if (/^Cooker$/i.test(t)) return "Cooker";
    return "";
  }

  // Global label inferer — every photo capture path uses this to decide
  // which function the photo represents based on the current screen.
  // Returns one of: Door, Cooker, Hob, Gas Fire, Boiler, Fault,
  // Warning Notice, Materials — or "" if no recognised screen.
  window.cgInferCurrentLabel = function () {
    try {
      // Boiler page → always Boiler
      if (typeof isOnBoilerPage === "function" && isOnBoilerPage()) return "Boiler";
      // Gas fire page → only when Yes is selected
      if (typeof isOnGasFirePage === "function" && isOnGasFirePage()
          && typeof gasFireYes === "function" && gasFireYes()) return "Gas Fire";
      // Cooker/Hob page → only when Yes selected; pick from __cgCookerExtra.type
      if (typeof isOnCookerHobPage === "function" && isOnCookerHobPage()
          && typeof cookerHobYes === "function" && cookerHobYes()) {
        var ch = cookerOrHobLabel();
        if (ch) return ch;
      }
      // Faults page → only when Yes selected; warning notice takes precedence
      // when any warning-yes is set on that same page.
      if (typeof isOnFaultsPage === "function" && isOnFaultsPage()) {
        if (typeof anyWarningNoticeYes === "function" && anyWarningNoticeYes()) return "Warning Notice";
        if (typeof faultsYes === "function" && faultsYes()) return "Fault";
      }
      // Materials page → only when Yes selected
      if (typeof isOnMaterialsPage === "function" && isOnMaterialsPage()
          && typeof materialsYes === "function" && materialsYes()) return "Materials";
      // Address page (manual entry path) → Door
      if (typeof isOnAddressPage === "function" && isOnAddressPage()) return "Door";
    } catch (e) {}
    return "";
  };

  // ── Photo box UI ──

      "cursor:pointer","display:none",
    ].join(";");
    retakeBtn.addEventListener("click", function () { fileInput.click(); });
    btnRow.appendChild(retakeBtn);

    wrap.appendChild(btnRow);

    function showCaptured(dataUrl) {
      thumb.src = dataUrl;
      thumb.style.display = "block";
      takeBtn.style.display = "none";
      retakeBtn.style.display = "inline-block";
      hint.textContent = "Photo captured. Tap Retake to replace.";
      hint.style.color = "rgba(255,255,255,0.65)";
    }
    function showEmpty() {
      thumb.style.display = "none";
      thumb.removeAttribute("src");
      takeBtn.style.display = "inline-block";
      retakeBtn.style.display = "none";
      hint.textContent = opts.required
        ? "Please take a photo to continue."
        : "Optional photo for this section.";
      hint.style.color = "rgba(255,255,255,0.85)";
    }

    // Pre-fill from existing capture for this label.
    var existingDataUrl = getCurrentFnPhoto(opts.label);
    if (existingDataUrl) showCaptured(existingDataUrl);
    else showEmpty();

    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var url = reader.result;
        if (typeof url !== "string") return;
        // Down-scale for storage size (sessionStorage cap ~5 MB).
        compressDataUrl(url, 1600, 0.78).then(function (compressed) {
          setCurrentFnPhoto(opts.label, compressed);
          showCaptured(compressed);
          fileInput.value = "";
          // Re-evaluate continue button immediately.
          try { applyContinueGate(opts.continueGate); } catch (e) {}
        }).catch(function () {
          setCurrentFnPhoto(opts.label, url);
          showCaptured(url);
          fileInput.value = "";
          try { applyContinueGate(opts.continueGate); } catch (e) {}
        });
      };
      reader.readAsDataURL(f);
    });

    opts.anchor.appendChild(wrap);
    return wrap;
  }

  // Compress a data URL via canvas — same pattern the React bundle uses
  // (the file goes through __cgPhotoBucket but only in some flows; on
  // these injected screens we control the capture path entirely).
  function compressDataUrl(dataUrl, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxDim || h > maxDim) {
            var r = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality || 0.78));
        } catch (e) { reject(e); }
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  // ── Continue button blocker ──
  function applyContinueGate(gate) {
    if (!gate || !gate.required) return;
    var btn = document.querySelector(gate.selector);
    if (!btn) return;
    var have = !!gate.hasPhoto();
    if (have) {
      btn.removeAttribute("aria-disabled");
      btn.style.removeProperty("opacity");
      btn.style.removeProperty("pointer-events");
      btn.title = "";
      btn.__cgPhotoBlocked = false;
    } else {
      btn.setAttribute("aria-disabled", "true");
      btn.style.opacity = "0.4";
      btn.style.pointerEvents = "none";
      btn.title = "Please take a photo to continue";
      btn.__cgPhotoBlocked = true;
    }
    // Also install a capturing click interceptor (in case React rerenders
    // and clears our pointer-events style).  Only install once.
    if (!btn.__cgPhotoInterceptInstalled) {
      btn.__cgPhotoInterceptInstalled = true;
      btn.addEventListener("click", function (e) {
        if (btn.__cgPhotoBlocked) {
          e.preventDefault();
          e.stopImmediatePropagation();
          // Surface a hint by flashing the photo box, if present.
          if (gate.flashId) {
            var box = document.getElementById(gate.flashId);
            if (box) {
              box.style.transition = "border-color 200ms";
              box.style.borderColor = "#ff5252";
              setTimeout(function () { box.style.borderColor = "rgba(242,104,42,0.65)"; }, 600);
            }
          }
        }
      }, true);
    }
  }

  // Splice Gas Fire fields into APPLIANCE 3 block of an outgoing body.
  // The body emitted by the React bundle for visit-2 (with cooker = No) has:
  //   APPLIANCE 3
  //   ----------
  //   Make: ...
  //   Model: ...
  // We insert Location/Type at the top of the block, and Heat Input /
  // Operating Pressure at the bottom — so parseProperty() can pick them up.
  function injectGasFireExtraIntoBody(body) {
    if (!body || typeof body !== "string") return body;
    var extra = readGasFireExtraFromStorage();
    var location = (extra.location || "").trim();
    var type = (extra.type || "").trim();
    var heatInput = (extra.heatInput || "").trim();
    var operatingPressure = (extra.operatingPressure || "").trim();
    var lines = body.split(/\r?\n/);
    var i = lines.findIndex(function (l) { return l.trim() === "APPLIANCE 3"; });
    if (i < 0) return body; // No APPLIANCE 3 — no gas fire.
    var insertAt = i + 1;
    if (insertAt < lines.length && /^-+$/.test(lines[insertAt].trim())) insertAt++;
    // Find block end (blank line or property separator).
    var blockEnd = insertAt;
    while (blockEnd < lines.length && lines[blockEnd].trim() !== "" && !/^=+$/.test(lines[blockEnd].trim())) blockEnd++;
    // Strip any existing Location/Type/Heat Input/Operating Pressure lines.
    var blockLines = lines.slice(insertAt, blockEnd).filter(function (l) {
      var t = l.trim();
      return !/^Location:/i.test(t)
          && !/^Type:/i.test(t)
          && !/^Heat Input:/i.test(t)
          && !/^Operating Pressure:/i.test(t);
    });
    var newBlock = [];
    if (location) newBlock.push("Location: " + location);
    if (type) newBlock.push("Type: " + type);
    newBlock = newBlock.concat(blockLines);
    if (heatInput) newBlock.push("Heat Input: " + heatInput);
    if (operatingPressure) newBlock.push("Operating Pressure: " + operatingPressure);
    var out = lines.slice(0, insertAt).concat(newBlock, lines.slice(blockEnd));
    return out.join("\n");
  }

      if (/Install cooker.*tightness test/i.test(bodyTxt)) return true;
      if (/Cooker installed/i.test(bodyTxt)) return true;

  function watchVisitSelector() {

      var sel = null;
      btns.forEach(function (b) {
        var t = (b.textContent || "").trim();
        var hasGrad = /citizen-gradient-bg/.test(b.className || "");

  // ---------- TASK 2: DD/MM/YYYY DATE DISPLAY ----------
  // BUG-FIX (Date format): the inspection-date page uses <input type="date">
  // which renders in the OS / browser locale (e.g. MM/DD/YYYY on US Android).
  // We overlay a DD/MM/YYYY text label on top of the native input so the
  // engineer always sees the UK format — the native picker still works
  // because we keep the input clickable.
  function ddmmyyyy(iso) {
    if (!iso) return "";
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return iso;
    return m[3] + "/" + m[2] + "/" + m[1];
  }
  function ensureDateOverlay() {
    try {
      var hash = window.location.hash || "";
      var onDate = hash.indexOf("/property/date") !== -1;
      var existing = document.getElementById("cg-date-overlay");
      if (!onDate) { if (existing) existing.remove(); return; }
      var input = document.querySelector('input[type="date"]');
      if (!input) return;
      // Wrap the input in a relative container exactly once.
      var parent = input.parentElement;
      if (!parent) return;
      if (existing) {
        var newText = ddmmyyyy(input.value);
        if (existing.textContent !== newText) existing.textContent = newText;
        return;
      }
      // Hide the native rendered text by making the input transparent
      // (it still receives taps and opens the picker).
      input.style.color = "transparent";
      input.style.caretColor = "transparent";
      // Make sure the parent is positioned so the overlay can sit on top.
      var cs = getComputedStyle(parent);
      if (cs.position === "static") parent.style.position = "relative";
      var overlay = document.createElement("div");
      overlay.id = "cg-date-overlay";
      overlay.textContent = ddmmyyyy(input.value);
      overlay.style.cssText = [
        "position:absolute",
        "left:14px","top:50%","transform:translateY(-50%)",
        "pointer-events:none",
        "font:600 16px/1 ui-sans-serif,system-ui,-apple-system,sans-serif",
        "color:#fff","z-index:5",
      ].join(";");
      parent.appendChild(overlay);
      // Refresh overlay text whenever the value changes.
      input.addEventListener("change", function () {
        overlay.textContent = ddmmyyyy(input.value);
      });
      input.addEventListener("input", function () {
        overlay.textContent = ddmmyyyy(input.value);
      });
    } catch (e) { /* never break the page */ }
  }

  function dataUrlToFile(dataUrl, filename) {

  // Re-check on every DOM mutation so we catch React route transitions.
  var __cookerMo = null;

  // Splice Type / Model lines into the APPLIANCE 2 block of an outgoing body.
  // VISIT 1 RULE: do NOT inject Type/Model on visit 1 — cooker info must not
  // appear on the cert when the engineer is only capping. We detect visit 1
  // by looking for `Visit: 1` in the property block.
  function injectCookerExtraIntoBody(body) {
    if (!body || typeof body !== "string") return body;
    // Detect visit number from body. If visit 1, leave body alone (cooker
    // info is not part of visit-1 cert).
    var visitMatch = body.match(/^Visit:\s*(\d+)/m);
    var visit = visitMatch ? parseInt(visitMatch[1], 10) : 0;
    if (visit === 1) return body;
    var extra = readCookerExtraFromStorage();
    var type = (extra.type || "").trim();
    var model = (extra.model || "").trim() || "NA";
    // Find APPLIANCE 2 block.
    var lines = body.split(/\r?\n/);
    var i = lines.findIndex(function (l) { return l.trim() === "APPLIANCE 2"; });
    if (i < 0) return body; // No APPLIANCE 2 — visit 1 or no cooker. Leave body alone.
    // Skip past dashed underline if present.
    var insertAt = i + 1;
    if (insertAt < lines.length && /^-+$/.test(lines[insertAt].trim())) insertAt++;
    // Replace any existing Type:/Model: lines in this block first — don't double up.
    var blockEnd = insertAt;
    while (blockEnd < lines.length && lines[blockEnd].trim() !== "" && !/^=+$/.test(lines[blockEnd].trim())) blockEnd++;
    var blockLines = lines.slice(insertAt, blockEnd).filter(function (l) {
      return !/^Type:/i.test(l.trim()) && !/^Model:/i.test(l.trim());
    });
    // Build replacement block: Type and Model first, then the rest.
    var newBlock = [];
    if (type) newBlock.push("Type: " + type);
    newBlock.push("Model: " + model);
    newBlock = newBlock.concat(blockLines);
    var out = lines.slice(0, insertAt).concat(newBlock, lines.slice(blockEnd));
    return out.join("\n");
  }

  // BUG 1 + BUG 3 FIX — synchronous monkey-patch of localStorage.setItem.
  // When React writes citizenGas.queue, we intercept the write AND
  // synchronously harvest photos from the still-mounted review screen.
  // The photos are pinned to the SPECIFIC queue entry id that was just
  // appended, so that even if multiple sends happen in rapid succession,
  // each entry gets the photos that were in the DOM at its own send moment.
  (function patchSetItem() {
    if (window.__cgDaybookPatched) return;
    window.__cgDaybookPatched = true;
    const origSet = Storage.prototype.setItem;
    Storage.prototype.setItem = function (key, value) {
      // Re-entrancy guard: don't recurse when we write the photo pin.
      const isQueueWrite = (this === window.localStorage && key === "citizenGas.queue");
      let newEntryId = null;
      let photos = [];
      if (isQueueWrite) {
        // Inject Cooker Type + Model into the body of every queue entry that
        // has an APPLIANCE 2 block. Re-serialise the queue with the spliced body.
        try {
          var parsed = JSON.parse(value || "[]");
          if (Array.isArray(parsed)) {
            var changed = false;
            for (var qi = 0; qi < parsed.length; qi++) {
              var entry = parsed[qi];
              if (entry && typeof entry.body === "string") {
                var newBody = entry.body;
                if (newBody.indexOf("APPLIANCE 2") !== -1) {
                  newBody = injectCookerExtraIntoBody(newBody);
                }
                if (newBody.indexOf("APPLIANCE 3") !== -1) {
                  newBody = injectGasFireExtraIntoBody(newBody);
                }
                if (newBody !== entry.body) {
                  entry.body = newBody;
                  changed = true;
                }
              }
            }
            if (changed) {
              value = JSON.stringify(parsed);
              arguments[1] = value;
            }
          }
        } catch (e) {}
        // Pre-parse the new value so we know which entry id was just added.
        try {
          const newQ = JSON.parse(value || "[]");
          if (Array.isArray(newQ) && newQ.length) {
            newEntryId = (newQ[newQ.length - 1] || {}).id || null;
          }
        } catch (e) {}
        try { photos = harvestPhotosFromReview(); } catch (e) {}
      }
      const ret = origSet.apply(this, arguments);
      if (isQueueWrite && newEntryId) {
        // Pin BOTH the legacy photo array AND the new function-keyed map
        // (Door / Cooker / Hob / Gas Fire / Boiler / Fault / Warning
        // Notice / Materials).  buildRecord prefers the map when present.
        try {
          const pin = readPhotoPin();
          // Back-compat: keep array shape on the same pin entry by
          // storing { photos, functionMap } when we have either.
          const fnMap = readCurrentFnMap();
          const fnHasAny = fnMap && Object.keys(fnMap).length > 0;
          if (photos.length || fnHasAny) {
            pin[newEntryId] = { photos: photos, functionMap: fnHasAny ? fnMap : null };
            writePhotoPin(pin);
          }
          // Clear the in-progress per-job map now this queue entry has
          // captured it — keeps a fresh map for the next property.
          if (fnHasAny) clearCurrentFnMap();
        } catch (e) {}
      }
      if (isQueueWrite) {
        // BUG-FIX: Run sweepQueue SYNCHRONOUSLY here. The microtask
        // version was racy — if React (or any other write) re-entered
        // localStorage.setItem before our microtask ran, we could see
        // intermediate or wiped state. Direct sync ingestion guarantees
        // every queue write lands in the daybook before this setItem
        // returns to the caller.
        try { sweepQueue(photos); } catch (e) { console.error("daybook sweep failed", e); }
      }
      return ret;
    };
  })();

  // Belt-and-braces fallback: also catch the queued event in case the patch
  // got swallowed (extensions, future bundle changes).
  window.addEventListener("citizenGas:queued", function () {
    let photos = [];
    try { photos = harvestPhotosFromReview(); } catch (e) {}
    sweepQueue(photos);
    // Re-sweep after 200 ms in case React rendered photos slightly late.
    setTimeout(function () { sweepQueue(harvestPhotosFromReview()); }, 200);
  });

  // Polling safety net: every 2 s, sweep any unprocessed queue entries.
  // Cheap, and covers tab-backgrounded / extension-blocked cases.
  setInterval(function () { sweepQueue([]); }, 2000);

  // Backwards-compat alias used by finishDay.
  function captureLatestQueue() {
    let photos = [];
    try { photos = harvestPhotosFromReview(); } catch (e) {}
    sweepQueue(photos);
  }

  // ---------- FINISH & SEND UI ----------
  function ensureDaybookButton() {
    if (document.getElementById("cg-daybook-btn")) return;

    btn.id = "cg-daybook-btn";
    btn.type = "button";
    btn.textContent = "Finish day & email";
    btn.style.cssText = [
      "position:fixed", "left:16px", "right:16px", "bottom:16px", "z-index:9998",
      "background:#F2682A", "color:#fff", "border:0", "border-radius:14px",

      "font:700 16px/1.2 ui-sans-serif,system-ui,-apple-system,sans-serif",
      "letter-spacing:0.02em",
      "box-shadow:0 8px 24px rgba(242,104,42,0.35)", "cursor:pointer",
      "display:none", "width:auto", "text-align:center",
      "-webkit-tap-highlight-color:transparent",
