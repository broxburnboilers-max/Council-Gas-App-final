  // BUG-FIX (Photos missing in emailed JSON):
  // Previously this function ALWAYS stripped photos out of the emailed copy
  // because of Resend's 40 MB cap. That meant the user could never see
  // photos in the JSON they downloaded from the email — the photos only
  // travelled by the separate /api/daybook channel to admin.
  //
  // New behaviour: keep photos in the emailed JSON whenever the resulting
  // payload would be UNDER ~15 MB (well below Resend's cap). Only strip
  // when the daybook is genuinely too big to email. The vast majority of
  // daily daybooks (1-10 certs, ~5 photos each) are well under this size.
  function daybookForEmail(d) {
    var copy = JSON.parse(JSON.stringify(d || {}));
    var size = JSON.stringify(copy).length;
    var SAFE_EMAIL_SIZE = 15 * 1024 * 1024; // 15 MB
    if (size <= SAFE_EMAIL_SIZE) {
      // Small enough — keep photos in the emailed JSON.
      copy._stripped_photo_count = 0;
      copy._photoEmailMode = "included";
      return copy;
    }
    // Too big — strip photos and rely on the /api/daybook side-channel.
    var stripped = 0;
    (copy.certs || []).forEach(function (c) {
      if (Array.isArray(c.photos)) {
        stripped += c.photos.length;
        c.photos = [];
        c._photosStripped = true;
      }
    });
    copy._stripped_photo_count = stripped;
    copy._photoEmailMode = "stripped_oversize";
    return copy;
  }

  async function finishDay() {
    // Safety sweep: drain any unsaved queue entries into the daybook before
    // we read it. Covers cases where the queued-event listener missed firing
    // (tab backgrounded, race, etc.).
    //
    // BUG-FIX (Visit-1 / Visit-2 capture loss):
    // The single sweep above is not enough. If the daybook was wiped at any
    // point during the day (legacy doneBtn, midnight rollover, manual
    // intervention) but the queue is still intact, the cert bodies are
    // still recoverable from the queue. We now FORCE a recovery sweep
    // here: wipe the processed-flag map first so every queue entry is
    // re-ingested, then run the sweep. The dedup inside ingestQueueItem
    // makes this safe even if some certs are already in the daybook.
    try {
      var queueLen = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]").length;
      if (queueLen > 0) {
        // Clear processed flags so reingestion is unconditional. The
        // ingestQueueItem dedup logic (by certRef|date for certs, by
        // address+postcode+date for no-access) is idempotent.
        try { localStorage.removeItem("citizenGas.daybookProcessed"); } catch (e) {}
      }
    } catch (e) {}
    try { captureLatestQueue(); } catch (e) {}
    const d = readDaybook();
    const certCount = (d.certs || []).length;
    const naCount = (d.noAccess || []).length;
    if (!certCount && !naCount) {
      showStatusModal({
        title: "Nothing to send",
        message: "Finish at least one job first.",
        buttons: [{ label: "OK", primary: true }],
      });
      return;
    }

    showStatusModal({
      title: "Send today's daybook?",
      message: certCount + " cert" + (certCount === 1 ? "" : "s") +
        (naCount ? ", " + naCount + " no-access" : "") +
        "\nWill be emailed to broxburnboilers@gmail.com (with photos + JSON attached).",
      buttons: [
        { label: "Cancel" },
        { label: "Send", primary: true, onClick: function () { actuallySendDaybook(d); } },
      ],
    });
  }

  async function actuallySendDaybook(d) {
    const dateStamp = d.date || todayStamp();
    const filename = "daybook-" + dateStamp + ".json";

    // BUG-FIX (Photos missing in JSON — last-mile backfill):
    // If any cert in the daybook has an empty photos array but the photo
    // bucket has photos that were never attached (because the harvest
    // raced React, or addr-matching failed, or the bucket filled AFTER
    // ingestion), attach all unassigned bucket photos to certs that
    // have no photos. This is a best-effort fallback that guarantees
    // photos appear in the JSON download as long as the engineer took
    // them at some point during the session.
    try {
      var bucket = (window.__cgPhotoBucket || []).slice();
      // Build set of dataUrls already attached anywhere in the daybook
      var attached = Object.create(null);
      (d.certs || []).forEach(function (c) {
        (c.photos || []).forEach(function (p) {
          if (p && p.dataUrl) attached[p.dataUrl] = true;
        });
      });
      var orphans = bucket.filter(function (p) { return p && p.dataUrl && !attached[p.dataUrl]; });
      if (orphans.length) {
        // Find certs missing photos and distribute orphans equally.
        var emptyCerts = (d.certs || []).filter(function (c) { return !(c.photos && c.photos.length); });
        if (emptyCerts.length) {
          // Spread orphans across empty certs, photo-by-photo round robin.
          orphans.forEach(function (p, i) {
            var target = emptyCerts[i % emptyCerts.length];
            target.photos = target.photos || [];
            target.photos.push({ label: (p.fnLabel || "capture"), dataUrl: p.dataUrl });
          });
        } else if ((d.certs || []).length === 1) {
          // Single-cert daybook: attach all orphans to it.
          d.certs[0].photos = (d.certs[0].photos || []).concat(
            orphans.map(function (p) { return { label: (p.fnLabel || "capture"), dataUrl: p.dataUrl }; })
          );
        }
        // Persist the backfilled daybook so the local download has photos.
        try { writeDaybook(d); } catch (e) {}
      }
    } catch (e) { console.warn("[cg] photo backfill failed", e); }

    // ─── OAuth Drive photo upload pass (per-engineer Drive) ─────────────
    // The previous server-side service-account flow returned 403
    // storageQuotaExceeded because SAs have no quota on personal Drive.
    // We now sign the engineer in with their own Google account and
    // upload photos + cert JSON directly into a date-named folder in
    // THEIR Drive, sharing read access with the admin email so the admin
    // app (signed in as the admin Google account) can still display them.
    if (!window.cgGoogleAuth || !window.cgGoogleAuth.isSignedIn()) {
      // Try a silent token first.  If the user has never signed in, we
      // need an interactive consent and we surface a blocking modal.
      try {
        await window.cgGoogleAuth.getValidToken({ interactive: true });
      } catch (e) {
        showStatusModal({
          title: "Google sign-in required",
          message:
            "To save photos to Drive, please tap the white \"Sign in with Google\" button at the top right of the screen, then try Send again.",
          buttons: [{ label: "OK", primary: true }],
        });
        return;
      }
    }

    showStatusModal({
      title: "Uploading photos…",
      message: "Saving to your Google Drive. Don't close this page.",
      buttons: [],
    });

    async function driveAuthHeader() {
      const t = await window.cgGoogleAuth.getValidToken({ interactive: true });
      return "Bearer " + t.access_token;
    }

    function ukDateFolderName() {
      // YYYY-MM-DD in UK time so dates flip over at UK midnight.
      const fmt = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit",
      });
      return "Citizen Gas — " + fmt.format(new Date());
    }

    // Find or create the engineer's date folder, then grant the admin
    // read access (best-effort; logged but not fatal if it fails).
    async function ensureDateFolder() {
      const name = ukDateFolderName();
      const auth = await driveAuthHeader();
      const q = "name = '" + name.replace(/'/g, "\\'") + "' and " +
        "mimeType = 'application/vnd.google-apps.folder' and trashed = false";
      const searchUrl = "https://www.googleapis.com/drive/v3/files?q=" +
        encodeURIComponent(q) + "&fields=" + encodeURIComponent("files(id,name)");
      const sresp = await fetch(searchUrl, { headers: { Authorization: auth } });
      if (!sresp.ok) throw new Error("Drive search failed: " + sresp.status);
      const sjson = await sresp.json();
      if (sjson.files && sjson.files.length > 0) {
        return { id: sjson.files[0].id, name: name, created: false };
      }
      const cresp = await fetch("https://www.googleapis.com/drive/v3/files?fields=id,name", {
        method: "POST",
        headers: { Authorization: auth, "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, mimeType: "application/vnd.google-apps.folder" }),
      });
      if (!cresp.ok) throw new Error("Drive folder create failed: " + cresp.status);
      const cjson = await cresp.json();
      // Share the new folder with the admin so all files inside inherit
      // read access.  drive.file scope only lets us touch files our app
      // created — this folder qualifies.
      try {
        await fetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(cjson.id) + "/permissions?sendNotificationEmail=false", {
          method: "POST",
          headers: { Authorization: auth, "Content-Type": "application/json" },
          body: JSON.stringify({ role: "reader", type: "user", emailAddress: ADMIN_EMAIL }),
        });
      } catch (e) { console.warn("[cg] could not share folder with admin", e); }
      return { id: cjson.id, name: name, created: true };
    }

    // Resumable upload for files > 4 MB; multipart for the rest.
    async function driveUploadBytes(bytes, mimeType, filename, parentFolderId) {
      const auth = await driveAuthHeader();
      const metadata = { name: filename, parents: [parentFolderId] };
      if (bytes.byteLength <= 4 * 1024 * 1024) {
        // multipart upload
        const boundary = "cg" + Math.random().toString(36).slice(2);
        const meta = "--" + boundary + "\r\n" +
          "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
          JSON.stringify(metadata) + "\r\n" +
          "--" + boundary + "\r\n" +
          "Content-Type: " + mimeType + "\r\n\r\n";
        const tail = "\r\n--" + boundary + "--";
        const body = new Blob([meta, bytes, tail], { type: "multipart/related; boundary=" + boundary });
        const resp = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
          method: "POST",
          headers: { Authorization: auth, "Content-Type": "multipart/related; boundary=" + boundary },
          body: body,
        });
        if (!resp.ok) {
          const txt = await resp.text().catch(function () { return ""; });
          throw new Error("Drive multipart upload failed " + resp.status + ": " + txt.slice(0, 200));
        }
        return await resp.json();
      }
      // resumable upload
      const startResp = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,webViewLink", {
        method: "POST",
        headers: {
          Authorization: auth,
          "Content-Type": "application/json; charset=UTF-8",
          "X-Upload-Content-Type": mimeType,
          "X-Upload-Content-Length": String(bytes.byteLength),
        },
        body: JSON.stringify(metadata),
      });
      if (!startResp.ok) throw new Error("Drive resumable init failed: " + startResp.status);
      const sessionUrl = startResp.headers.get("Location");
      if (!sessionUrl) throw new Error("Drive resumable init: no Location header");
      const putResp = await fetch(sessionUrl, {
        method: "PUT",
        headers: { "Content-Type": mimeType },
        body: new Blob([bytes], { type: mimeType }),
      });
      if (!putResp.ok) throw new Error("Drive resumable PUT failed: " + putResp.status);
      return await putResp.json();
    }

    // Grant the admin email reader on a specific file.  Belt-and-braces
    // alongside the folder-level grant; ensures admin can fetch even if
    // a file ends up outside the folder.
    async function shareFileWithAdmin(fileId) {
      try {
        const auth = await driveAuthHeader();
        await fetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "/permissions?sendNotificationEmail=false", {
          method: "POST",
          headers: { Authorization: auth, "Content-Type": "application/json" },
          body: JSON.stringify({ role: "reader", type: "user", emailAddress: ADMIN_EMAIL }),
        });
      } catch (e) { console.warn("[cg] could not share file " + fileId, e); }
    }

    try {
      const folder = await ensureDateFolder();
      const folderId = folder.id;
      const folderName = folder.name;
      const ownerEmail = (window.cgGoogleAuth.isSignedIn() && JSON.parse(localStorage.getItem(GOOGLE_TOKEN_KEY) || "null") || {}).email || null;

      // Collect every photo across every cert into a flat list.
      // Filename rule (per user spec): <address1>-<postcode>-<label>.<ext>
      // Strip path-illegal chars; keep capitalisation; collapse spaces.
      function sanitiseForFilename(s) {
        return String(s || "")
          .replace(/[\\\/:*?"<>|]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }
      const photoTasks = [];
      (d.certs || []).forEach(function (cert, certIdx) {
        const certRef = (cert.certData && cert.certData.certRef) || ("cert" + (certIdx + 1));
        const addr1Clean = sanitiseForFilename((cert.certData && cert.certData.instAddr1) || "");
        const postcodeClean = sanitiseForFilename((cert.certData && cert.certData.instPostcode) || "");
        (cert.photos || []).forEach(function (photo, photoIdx) {
          if (!photo || !photo.dataUrl) return;
          if (photo.driveFileId) return;  // re-send: already uploaded
          const m = String(photo.dataUrl).match(/^data:([^;]+);base64,(.+)$/);
          if (!m) return;
          const mimeType = m[1];
          const ext = mimeType === "image/png" ? "png" : (mimeType === "image/webp" ? "webp" : "jpg");
          const labelClean = sanitiseForFilename(photo.label || ("Photo " + (photoIdx + 1)));
          // <address1>-<postcode>-<label>.<ext>
          const filename = [addr1Clean, postcodeClean, labelClean]
            .filter(Boolean).join("-") + "." + ext;
          photoTasks.push({
            certIdx: certIdx, photoIdx: photoIdx, certRef: certRef,
            filename: filename, mimeType: mimeType, base64: m[2],
            label: photo.label || "",
          });
        });
      });

      const CONCURRENCY = 3;
      let uploaded = 0, failed = 0;
      let cursor = 0;

      async function uploadOne(task) {
        try {
          const bin = atob(task.base64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const driveData = await driveUploadBytes(bytes, task.mimeType, task.filename, folderId);
          if (!driveData || !driveData.id) { failed++; return; }
          // The folder share already grants admin access to children, but
          // we add an explicit per-file grant in case the engineer ever
          // moves the file out of the folder.
          shareFileWithAdmin(driveData.id);
          const cert = d.certs[task.certIdx];
          if (cert && cert.photos && cert.photos[task.photoIdx]) {
            cert.photos[task.photoIdx] = {
              label: task.label,
              filename: task.filename,
              mimeType: task.mimeType,
              driveFileId: driveData.id,
              webViewLink: driveData.webViewLink || null,
              ownerEmail: ownerEmail,
              folderId: folderId,
              folderName: folderName,
            };
          }
          uploaded++;
        } catch (e) {
          console.warn("[cg] photo upload failed", e);
          failed++;
        }
      }

      async function worker() {
        while (true) {
          const i = cursor++;
          if (i >= photoTasks.length) return;
          await uploadOne(photoTasks[i]);
          if ((uploaded + failed) % 3 === 0) {
            try {
              showStatusModal({
                title: "Uploading photos…",
                message: (uploaded + failed) + " of " + photoTasks.length + " done" +
                  (failed ? " (" + failed + " failed — JSON download is your backup)" : ""),
                buttons: [],
              });
            } catch (e) {}
          }
        }
      }
      const workers = [];
      for (let i = 0; i < CONCURRENCY; i++) workers.push(worker());
      await Promise.all(workers);

      // Upload one cert JSON per cert into the same folder.  Strip the
      // photo dataUrls (they've been replaced by Drive references above).
      try {
        for (let ci = 0; ci < (d.certs || []).length; ci++) {
          const cert = d.certs[ci];
          const certRef = (cert.certData && cert.certData.certRef) || ("cert" + (ci + 1));
          const safeRef = String(certRef).replace(/[^A-Za-z0-9_-]/g, "_");
          const certJson = JSON.stringify(cert, null, 2);
          const certBytes = new TextEncoder().encode(certJson);
          try {
            const cdata = await driveUploadBytes(certBytes, "application/json", safeRef + ".json", folderId);
            if (cdata && cdata.id) {
              shareFileWithAdmin(cdata.id);
              cert._certJsonDriveId = cdata.id;
            }
          } catch (e) { console.warn("[cg] cert JSON upload failed", certRef, e); }
        }
      } catch (e) { console.warn("[cg] cert JSON pass failed", e); }

      try { writeDaybook(d); } catch (e) {}
      if (failed > 0) {
        console.warn("[cg] " + failed + " of " + photoTasks.length + " photo uploads failed");
      }
    } catch (e) {
      console.warn("[cg] OAuth Drive upload pass failed", e);
      showStatusModal({
        title: "Drive upload failed",
        message: "Could not upload to your Google Drive: " + (e && e.message ? e.message : e) + "\n\nThe local JSON download is still your backup.",
        buttons: [{ label: "OK", primary: true }],
      });
      // Don't return — fall through so the engineer at least gets the
      // local JSON.  (Photo bytes will still be in the daybook and the
      // send-daybook email path may still work for small days.)
    }
    // ────────────────────────────────────────────────────────────────────

    const forEmail = daybookForEmail(d);
    const summary = {
      jobCount: (d.certs || []).length,
      noAccessCount: (d.noAccess || []).length,
    };
    // BUG-FIX (Photos missing in email): the size shown to the engineer must
    // reflect the WHOLE payload (including photos) since we now send photos.
    const payload = JSON.stringify({ daybook: d, summary, filename });
    const sizeKB = Math.round(payload.length / 1024);

    // Show a working spinner-ish modal
    showStatusModal({
      title: "Sending…",
      message: "Uploading " + sizeKB + " KB to the office. Don't close this page.",
      buttons: [],
    });

    let httpStatus = 0;
    let resendOk = false;
    let errMsg = "";
    let bodyText = "";

    // BUG-FIX (Photos missing in email — third attempt, simplest path):
    // Forget the JSON-attachment route entirely. Send the FULL daybook (photos
    // included) to /api/send-daybook so the server can attach photos directly
    // to the Resend email AND embed them inline in the HTML body. The user
    // will SEE photos in the email itself — no JSON unzip needed.
    var fullPayload = JSON.stringify({
      daybook: d, // <-- photos intact, NOT stripped
      summary: summary,
      filename: filename,
    });

    try {
      const resp = await fetch("/api/send-daybook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: fullPayload,
        // keepalive lets Safari finish the request even if the page is closing
        keepalive: true,
      });
      httpStatus = resp.status;
      bodyText = await resp.text().catch(function () { return ""; });
      let parsed = null;
      try { parsed = JSON.parse(bodyText); } catch (e) {}
      resendOk = resp.ok && parsed && parsed.ok === true;
    } catch (e) {
      errMsg = (e && e.message) ? e.message : String(e);
    }

    // BUG-FIX (Photos missing on admin PDFs):
    // The /api/send-daybook payload above has photos stripped (Resend has
    // attachment caps and the email parser can't carry binary).  Photos
    // therefore have to travel by a SEPARATE channel.  We POST the full
    // daybook (with photo data URLs intact) to /api/daybook — Netlify Blobs
    // queue — so the admin app can pull it down on next load and import
    // photos automatically.  This call is best-effort and never blocks the
    // success path: if it fails the user still has the local JSON download.
    try {
      const fullPayload = JSON.stringify({
        daybook: d,
        savedAt: new Date().toISOString(),
      });
      // Same keepalive flag so Safari doesn't kill it during page close.
      await fetch("/api/daybook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: fullPayload,
        keepalive: true,
      }).catch(function () {});
    } catch (e) { /* swallow — local JSON is the fallback */ }

    // Always offer the local backup download regardless of outcome.
    downloadJsonLocally(d, filename);

    if (resendOk) {
      writeDaybook({ date: "", certs: [], noAccess: [] });
      // Clear the processed-queue map and the queue itself so tomorrow starts
      // fresh and the processed map doesn't grow forever.
      try { localStorage.removeItem("citizenGas.daybookProcessed"); } catch (e) {}
      try { localStorage.removeItem("citizenGas.queue"); } catch (e) {}
      try { localStorage.removeItem("citizenGas.daybookPhotoPin"); } catch (e) {}
      // Reset the in-memory photo bucket so tomorrow starts fresh.
      try { if (typeof window.cgResetPhotoBucket === "function") window.cgResetPhotoBucket(); } catch (e) {}
      refreshDaybookButton();
      showStatusModal({
        title: "Sent \u2713",
        message: "Daybook emailed to broxburnboilers@gmail.com (photos + JSON attached).\nA copy of the JSON also saved to Downloads as " + filename + ".",
        buttons: [{
          label: "Done", primary: true,
          onClick: function () {
            // End of the day: wipe per-day state and bounce to sign-in,
            // mirroring the legacy Done behaviour.
            try {
              Object.keys(localStorage).forEach(function (k) {
                if (k.indexOf("citizenGas.") === 0
                  && k !== "citizenGas.engineerProfile"
                  && k !== "citizenGas.queue") {
                  localStorage.removeItem(k);
                }
              });
              sessionStorage.removeItem("citizenGas.signinFresh");
              // Clear the per-session 'completed today' tracker so tomorrow
              // starts fresh.
              sessionStorage.removeItem("citizenGas.completedJobIds");
            } catch (e) {}
            window.location.href = "/";
          },
        }],
      });
      return;
    }

    // Failure path — keep the daybook so the engineer can retry.
    var diag = [
      "Status: " + (httpStatus || "no response"),
      "Size: " + sizeKB + " KB",
      "Error: " + (errMsg || "—"),
      "Body: " + (bodyText ? bodyText.slice(0, 200) : "—"),
    ].join("\n");
    showStatusModal({
      title: "Email failed",
      message:
        "The daybook could NOT be emailed. Your data is safe — nothing was deleted.\n\n" +
        "A copy was saved to Downloads as " + filename + ".\n\n" +
        "Diagnostic info (for support):\n" + diag,
      buttons: [
        { label: "Close" },
        { label: "Try again", primary: true, onClick: function () { actuallySendDaybook(d); } },
      ],
    });
  }

  function buildMailtoBody(d, summary, filename) {
    const lines = [];
    lines.push("Citizen Gas — End of Day Daybook");
    lines.push("Date: " + d.date);
    lines.push("Engineer: " + ((d.engineer && d.engineer.fullName) || ""));
    lines.push("");
    lines.push("Jobs completed: " + summary.jobCount);
    lines.push("No-access: " + summary.noAccessCount);
    lines.push("");
    if (d.noAccess && d.noAccess.length) {
      lines.push("=== NO ACCESS ===");
      d.noAccess.forEach(na => {
        lines.push("- " + [na.address1, na.address2, na.postcode].filter(Boolean).join(", "));
      });
      lines.push("");
    }
    lines.push("ATTACH the file: " + filename);
    lines.push("(downloaded to your phone's Downloads folder)");
    return lines.join("\n");
  }

  function downloadJsonLocally(daybook, filename) {
    const json = JSON.stringify(daybook, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
    // CHANGE (auto-send to all recipients): the manual mailto handoff is
    // disabled. The Resend email sent by /api/send-daybook now goes to BOTH
    // broxburnboilers@gmail.com AND lspapandh@gmail.com automatically with
    // photos inline + JSON attached. The engineer no longer needs to do
    // anything after pressing Send Daybook. Function kept (unused) for now
    // in case the email path needs a fallback later.
    // try { openDaybookMailto(daybook, filename); } catch (e) {}
  }

  function openDaybookMailto(daybook, filename) {
    // Today's date in DD/MM/YYYY for the subject line.
    var today = new Date();
    var dd = String(today.getDate()).padStart(2, "0");
    var mm = String(today.getMonth() + 1).padStart(2, "0");
    var yyyy = today.getFullYear();
    var dateStr = dd + "/" + mm + "/" + yyyy;
    var to = "lspapandh@gmail.com";
    var subject = "Gas Safety Daybook " + dateStr;
    var bodyLines = [
      "Hi,",
      "",
      "Please find attached the gas safety daybook for " + dateStr + ".",
      "",
      "The JSON file (\"" + filename + "\") has just downloaded to this phone's Downloads folder.",
      "Please ATTACH it to this email before sending.",
      "",
      "Engineer: " + ((daybook && daybook.engineer && daybook.engineer.fullName) || "Andrew King-Page"),
      "Certificates: " + ((daybook && daybook.certs) || []).length,
      "No-access: " + ((daybook && daybook.noAccess) || []).length,
    ];

    // FEATURE (Materials in daily email): append a per-property breakdown of
    // the materials the engineer logged today, so the office can see at a
    // glance what was used on each job without opening the JSON. If no
    // materials were logged anywhere, emit a single "none recorded" line.
    try {
      var matLines = [];
      var anyMaterials = false;
      var allEntries = []
        .concat((daybook && daybook.certs) || [])
        .concat((daybook && daybook.noAccess) || []);
      allEntries.forEach(function (entry) {
        var mats = entry && entry.materials;
        if (!Array.isArray(mats) || !mats.length) return;
        anyMaterials = true;
        // Resolve a readable address label depending on cert vs no-access shape.
        var addr = "";
        if (entry.certData) {
          addr = [entry.certData.instAddr1, entry.certData.instAddr2, entry.certData.instPostcode]
            .filter(Boolean).join(", ");
        } else {
          addr = [entry.address1, entry.address2, entry.postcode].filter(Boolean).join(", ");
        }
        if (!addr) addr = "(unknown address)";
        matLines.push("");
        matLines.push(addr + ":");
        mats.forEach(function (m) { matLines.push("  \u2022 " + m); });
      });
      bodyLines.push("");
      bodyLines.push("Materials used today:");
      if (anyMaterials) {
        bodyLines = bodyLines.concat(matLines);
      } else {
        bodyLines.push("  (none recorded)");
      }
    } catch (e) { /* never block the email on a materials-summary error */ }

    bodyLines.push("");
    bodyLines.push("Sent from the Citizen Gas app.");
    var mailto = "mailto:" + to
      + "?subject=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(bodyLines.join("\n"));
    // A short delay lets the download dialog appear first (some Android
    // browsers cancel the download if a navigation happens in the same tick).
    setTimeout(function () {
      try {
        window.location.href = mailto;
      } catch (e) {}
    }, 600);
  }

  // ---------- BOOTSTRAP ----------
  window.addEventListener("DOMContentLoaded", function () {
    ensureDaybookButton();
    refreshDaybookButton();
    // Refresh button every 1.5s so it appears as soon as a profile/cert exists
    setInterval(refreshDaybookButton, 1500);
  });
})();

    </script>
