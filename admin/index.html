    <!-- Pre-React auto-folder sweeper. Runs synchronously BEFORE the React
         module loads, so that by the time the bundle reads gsc_records into
         its in-memory state, every record already has a gscFolder pointing
         at a folder named after its issue date (DD/MM/YYYY). -->
    <script>
      (function () {
        // Pre-React folder sweeper. Mirrors folderNameForRecord() in the
        // post-bundle script below — keep these two in sync.
        // Priority: engineerData.certDate (truth) → finalChecks.inspectionDate
        // (work_date + 1y) → legacy fields → savedAt (worst, = today).
        function fmtDateFromIso(iso) {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return null;
          var dd = String(d.getUTCDate()).padStart(2, "0");
          var mm = String(d.getUTCMonth() + 1).padStart(2, "0");
          var yy = d.getUTCFullYear();
          return dd + "/" + mm + "/" + yy;
        }
        function folderNameFor(rec) {
          var eng = rec && rec.engineerData && rec.engineerData.certDate;
          if (eng) {
            var s = fmtDateFromIso(eng);
            if (s) return s;
          }
          var fci = rec && rec.finalChecks && rec.finalChecks.inspectionDate;
          if (fci) {
            var d = new Date(fci);
            if (!isNaN(d.getTime())) {
              var work = new Date(Date.UTC(d.getUTCFullYear() - 1, d.getUTCMonth(), d.getUTCDate(), 12, 0, 0));
              var dd = String(work.getUTCDate()).padStart(2, "0");
              var mm = String(work.getUTCMonth() + 1).padStart(2, "0");
              var yy = work.getUTCFullYear();
              return dd + "/" + mm + "/" + yy;
            }
          }
          var raw = (rec && rec.certData && rec.certData.issueDate)
                 || (rec && rec.certData && rec.certData.inspectionDate)
                 || (rec && rec.signatureData && rec.signatureData.issuedByDate)
                 || (rec && rec.savedAt)
                 || new Date().toISOString();
          var d2 = new Date(raw);
          if (isNaN(d2.getTime())) {
            var m = String(raw).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
            if (m) return String(raw).slice(0, 10);
            d2 = new Date();
          }
          var dd2 = String(d2.getUTCDate()).padStart(2, "0");
          var mm2 = String(d2.getUTCMonth() + 1).padStart(2, "0");
          var yy2 = d2.getUTCFullYear();
          return dd2 + "/" + mm2 + "/" + yy2;
        }
        function dateRegex() { return /^\d{2}\/\d{2}\/\d{4}$/; }
        try {
          var recs = JSON.parse(localStorage.getItem("gsc_records") || "[]");
          var folders = JSON.parse(localStorage.getItem("gsc_folders") || "[]");
          if (!Array.isArray(recs) || !Array.isArray(folders)) return;
          var changed = false;
          for (var i = 0; i < recs.length; i++) {
            var r = recs[i];
            if (!r) continue;
            var name = folderNameFor(r);
            // Re-file logic: leave manually-moved records alone, but move
            // legacy date-folder records into the correct work-date folder.
            if (r.gscFolder) {
              var cur = folders.find(function (x) { return x && x.id === r.gscFolder; });
              if (cur && cur.name === name) continue;
              if (cur && !dateRegex().test(cur.name || "")) continue;  // manual
            }
            var f = folders.find(function (x) { return x && x.name === name; });
            var fid;
            if (f) {
              fid = f.id;
            } else {
              fid = "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
              folders.push({ id: fid, name: name });
            }
            if (r.gscFolder !== fid) {
              r.gscFolder = fid;
              changed = true;
            }
          }
          // Prune empty date-named folders.
          var used = {};
          for (var k = 0; k < recs.length; k++) {
            if (recs[k] && recs[k].gscFolder) used[recs[k].gscFolder] = 1;
          }
          var pruned = folders.filter(function (f) {
            if (!f) return false;
            if (!dateRegex().test(f.name || "")) return true;  // keep manual
            return !!used[f.id];
          });
          if (pruned.length !== folders.length) {
            folders = pruned;
            changed = true;
          }
          if (changed) {
            localStorage.setItem("gsc_records", JSON.stringify(recs));
            localStorage.setItem("gsc_folders", JSON.stringify(folders));
          }
        } catch (e) { /* never block boot */ }
      })();
    </script>

    <!-- Google Sign-In for Drive photo fetch (admin reads engineers' Drives). -->
    <button id="gs-google-btn" type="button" aria-label="Google sign-in" style="
      position: fixed; right: 16px; top: 16px; z-index: 9998;
      background: #fff; color: #18252D; border: 1px solid #d0d7de;
      border-radius: 999px; padding: 8px 14px;
      font: 600 12px/1 ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
      cursor: pointer; align-items: center; gap: 8px; display: inline-flex;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    "><span id="gs-google-btn-label">Sign in with Google (Drive)</span></button>

    <script>
    // ─── Google OAuth controller (admin side) ─────────────────────────
    // Photos in records are stored on engineers' personal Drives and
    // shared with the admin email.  The admin browser fetches each photo
    // directly with this OAuth token (drive.readonly scope).  No service
    // account is involved in the read path.
    const GS_GOOGLE_CLIENT_ID = "576198550128-bk285smjtv35fnnnmql205vl09nre7nr.apps.googleusercontent.com";
    const GS_GOOGLE_TOKEN_KEY = "gs_google_token";
    const GS_DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";

    window.gsGoogleAuth = (function () {
      let tokenClient = null;
      let pendingResolve = null;
      let pendingReject = null;

      function readStored() {
        try { return JSON.parse(localStorage.getItem(GS_GOOGLE_TOKEN_KEY) || "null"); }
        catch (e) { return null; }
      }
      function writeStored(t) {
        try { localStorage.setItem(GS_GOOGLE_TOKEN_KEY, JSON.stringify(t)); } catch (e) {}
      }
      function clearStored() {
        try { localStorage.removeItem(GS_GOOGLE_TOKEN_KEY); } catch (e) {}
      }
      function isFresh(t) {
        return t && t.access_token && t.expires_at && (t.expires_at - Date.now() > 60 * 1000);
      }
      async function fetchEmail(accessToken) {
        try {
          const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + accessToken },
          });
          if (!r.ok) return null;
          const j = await r.json();
          return (j && j.email) || null;
        } catch (e) { return null; }
      }
      function ensureClient() {
        if (tokenClient) return true;
        if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return false;
        tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: GS_GOOGLE_CLIENT_ID,
          scope: GS_DRIVE_SCOPE,
          prompt: "",
          callback: function (resp) {
            if (resp && resp.access_token) {
              const expiresIn = (resp.expires_in || 3600) * 1000;
              const t = {
                access_token: resp.access_token,
                expires_at: Date.now() + expiresIn - 30 * 1000,
                email: null,
                scope: resp.scope || GS_DRIVE_SCOPE,
              };
              fetchEmail(resp.access_token).then(function (em) {
                t.email = em || null;
                writeStored(t);
                renderButton();
                if (pendingResolve) { pendingResolve(t); pendingResolve = null; pendingReject = null; }
              });
            } else if (pendingReject) {
              pendingReject(new Error("oauth declined")); pendingResolve = null; pendingReject = null;
            }
          },
          error_callback: function (err) {
            if (pendingReject) { pendingReject(new Error("oauth error: " + (err && err.type))); pendingResolve = null; pendingReject = null; }
          },
        });
        return true;
      }
      function requestToken(opts) {
        return new Promise(function (resolve, reject) {
          let waited = 0;
          const tick = setInterval(function () {
            if (ensureClient()) {
              clearInterval(tick);
              pendingResolve = resolve; pendingReject = reject;
              try {
                tokenClient.requestAccessToken({ prompt: opts && opts.silent ? "" : "consent" });
              } catch (e) { reject(e); }
            } else if ((waited += 200) >= 8000) {
              clearInterval(tick);
              reject(new Error("Google Identity Services failed to load"));
            }
          }, 200);
        });
      }
      async function getValidToken(opts) {
        const stored = readStored();
        if (isFresh(stored)) return stored;
        try { return await requestToken({ silent: true }); }
        catch (e) {
          if (opts && opts.interactive === false) throw e;
          return await requestToken({ silent: false });
        }
      }
      function signOut() {
        const t = readStored();
        if (t && t.access_token && window.google && window.google.accounts && window.google.accounts.oauth2) {
          try { window.google.accounts.oauth2.revoke(t.access_token, function () {}); } catch (e) {}
        }
        clearStored();
        renderButton();
      }
      function renderButton() {
        const lbl = document.getElementById("gs-google-btn-label");
        if (!lbl) return;
        const t = readStored();
        if (isFresh(t)) lbl.textContent = t.email ? ("Drive: " + t.email) : "Drive signed in";
        else lbl.textContent = "Sign in with Google (Drive)";
      }
      function isSignedIn() { return isFresh(readStored()); }
      function wireButton() {
        const btn = document.getElementById("gs-google-btn");
        if (!btn || btn.__wired) return;
        btn.__wired = true;
        let pressTimer = null;
        btn.addEventListener("touchstart", function () {
          pressTimer = setTimeout(function () { signOut(); pressTimer = null; }, 800);
        });
        btn.addEventListener("touchend", function () {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        });
        btn.addEventListener("click", function () {
          requestToken({ silent: false }).catch(function (err) {
            console.warn("[gs] Google sign-in failed", err);
            alert("Google sign-in failed: " + (err && err.message));
          });
        });
      }
      document.addEventListener("DOMContentLoaded", function () {
        wireButton();
        renderButton();
      });
      return { getValidToken, isSignedIn, signOut, renderButton };
    })();
    // ──────────────────────────────────────────────────────────────────
    </script>

    <script>
    // ============================================================
    // AUTO-UNLOCK: the React app shows a password screen on every
    // page load. Since the admin auth is already gated by
    // sessionStorage.gsAdminAuth (set by the engineer-side admin sign-in),
    // there's no security value in re-typing the password every reload.
    // This script fills 'Test' and clicks 'Unlock App' automatically as
    // soon as the screen appears. Especially important after Import Daybook,
    // which reloads the page to refresh React state from localStorage.
    // ============================================================
    (function () {
      try {
        if (sessionStorage.getItem("gsAdminAuth") !== "1") return;
      } catch (e) { return; }
      var ADMIN_PW = "Test";
      try { ADMIN_PW = sessionStorage.getItem("gsAdminKey") || ADMIN_PW; } catch (e) {}

      function tryUnlock() {
        var pw = document.querySelector('input[type="password"]');
        if (!pw) return false;
        // React-friendly value setter
        try {
          var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
          setter.call(pw, ADMIN_PW);
          pw.dispatchEvent(new Event("input", { bubbles: true }));
          pw.dispatchEvent(new Event("change", { bubbles: true }));
        } catch (e) {
          pw.value = ADMIN_PW;
        }
        // Find Unlock button
        var btns = document.querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) {
          var t = (btns[i].textContent || "").trim();
          if (/unlock/i.test(t)) {
            setTimeout(function (b) { return function () { b.click(); }; }(btns[i]), 50);
            return true;
          }
        }
        return false;
      }

      // Poll until the lock screen appears (or 10s elapses), then unlock once.
      var unlocked = false;
      var start = Date.now();
      var iv = setInterval(function () {
        if (unlocked) { clearInterval(iv); return; }
        if (Date.now() - start > 10000) { clearInterval(iv); return; }
        if (tryUnlock()) unlocked = true;
      }, 120);
    })();
    </script>

    <div id="gs-import-overlay" role="dialog" aria-live="polite">
      <div class="spinner"></div>
      <h2 id="gs-import-title">Importing engineer submissions…</h2>
      <p id="gs-import-msg">Pulling new visits from the cloud queue.</p>
    </div>

    <script>
    (function () {
      // Auth gate — must come from the engineer sign-in screen's Admin button.
      try {
        if (sessionStorage.getItem("gsAdminAuth") !== "1") {
          // Soft redirect back home if landed here without auth.
          window.location.href = "/";
          return;
        }
      } catch (e) {}

      var ADMIN_KEY = "Test";
      try { ADMIN_KEY = sessionStorage.getItem("gsAdminKey") || ADMIN_KEY; } catch (e) {}

      var overlay = document.getElementById("gs-import-overlay");
      var titleEl = document.getElementById("gs-import-title");
      var msgEl = document.getElementById("gs-import-msg");

      function show(title, msg) {
        titleEl.textContent = title;
        msgEl.textContent = msg;
        overlay.classList.add("show");
      }
      function hide() {
        overlay.classList.remove("show");
      }

      // Wait until the React app is mounted enough that we can find the home buttons.
      function waitFor(predicate, timeoutMs) {
        return new Promise(function (resolve, reject) {
          var start = Date.now();
          var iv = setInterval(function () {
            var v = predicate();
            if (v) { clearInterval(iv); resolve(v); }
            else if (Date.now() - start > timeoutMs) { clearInterval(iv); reject(new Error("timeout")); }
          }, 80);
        });
      }

      // Find a clickable element by visible text. Bandofmates uses both
      // <button> elements (tabs, Parse, Import All) and clickable <div>s
      // with cursor:pointer (the home tiles).
      function findClickableByText(text) {
        // 1) Exact match on a real <button>.
        var btns = document.querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) {
          var t = (btns[i].textContent || "").trim();
          if (t === text) return btns[i];
        }
        // 2) Substring match on a <button>.
        for (var j = 0; j < btns.length; j++) {
          var t2 = (btns[j].textContent || "").trim();
          if (t2.indexOf(text) !== -1) return btns[j];
        }
        // 3) Leaf element whose text equals `text` — climb to the nearest
        //    ancestor that actually has a click handler (covers the home tile
        //    divs, where the onClick is on the wrapper, not the inner span).
        var all = document.querySelectorAll("div, span, a");
        for (var k = 0; k < all.length; k++) {
          var el = all[k];
          if (el.children.length !== 0) continue;
          var tt = (el.textContent || "").trim();
          if (tt !== text) continue;
          // a) Prefer the closest ancestor with an inline onclick handler.
          var n = el;
          while (n && n !== document.body) {
            if (n.onclick) return n;
            n = n.parentElement;
          }
          // b) Fallback to the closest cursor:pointer ancestor.
          n = el;
          while (n && n !== document.body) {
            try {
              if (getComputedStyle(n).cursor === "pointer") return n;
            } catch (e) {}
            n = n.parentElement;
          }
          return el;
        }
        return null;
      }
      // Back-compat alias.
      var findButtonByText = findClickableByText;

      function setReactInputValue(el, value) {
        var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
        setter.call(el, value);
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }

      // The deployed bandofmates build no longer shows an Unlock App password
      // gate — it boots straight to the home screen. We still try briefly in
      // case a future build re-introduces it, but never block on it.
      async function unlockReactApp() {
        try {
          var unlockBtn = await waitFor(function () {
            return findClickableByText("Unlock App");
          }, 1500);
          var pwInput = document.querySelector('input[type="password"], input[placeholder="Password"]');
          if (pwInput) {
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(pwInput, ADMIN_KEY);
            pwInput.dispatchEvent(new Event("input", { bubbles: true }));
            pwInput.dispatchEvent(new Event("change", { bubbles: true }));
          }
          await new Promise(function (r) { setTimeout(r, 100); });
          unlockBtn.click();
        } catch (e) {
          // No lock screen — already on home. Continue.
        }
        // In either case, wait for the home tile to appear before proceeding.
        await waitFor(function () { return findClickableByText("GSC Email"); }, 8000);
      }

      // Bandofmates uses alert() to announce success and may use confirm() —
      // suppress both so the import completes silently.
      try { window.alert = function () {}; } catch (e) {}
      try { window.confirm = function () { return true; }; } catch (e) {}

      async function autoImport() {
        // Fetch queued submissions
        show("Importing engineer submissions…", "Checking the cloud queue.");
        var items = [];
        try {
          var resp = await fetch("/api/submissions", {
            method: "GET",
            headers: { "x-admin-key": ADMIN_KEY },
          });
          if (!resp.ok) {
            if (resp.status === 401) {
              show("Auth failed", "Admin key rejected. Please sign in again.");
              setTimeout(function () { sessionStorage.removeItem("gsAdminAuth"); window.location.href = "/"; }, 2500);
              return;
            }
            show("Cloud queue unreachable", "Status " + resp.status + ". You can still use the app manually.");
            setTimeout(hide, 2500);
            return;
          }
          var data = await resp.json();
          items = (data && data.items) || [];
        } catch (e) {
          show("Offline", "Couldn't reach the queue. You can still use the app manually.");
          setTimeout(hide, 2500);
          return;
        }

        if (!items.length) {
          show("No new submissions", "The queue is empty.");
          setTimeout(hide, 1500);
          return;
        }

        show("Found " + items.length + " submission" + (items.length === 1 ? "" : "s"), "Importing into Gas Safety records…");

        // Concatenate every body. The bandofmates parser handles multiple PROPERTY blocks
        // separated by newlines, and END OF JOB resets state.
        var combined = items.map(function (it) {
          return (it.body || "").trim();
        }).filter(Boolean).join("\n\nEND OF JOB\n\n");

        // Build a map: certRef → engineer payload, so after Import All we can
        // override engineerData per-record (Engineer Name + Gas Safe Reg No + Licence No).
        function extractCertRef(body) {
          var m = (body || "").match(/^\s*Cert Ref:\s*(.+?)\s*$/m);
          return m ? m[1].trim() : null;
        }
        var engineerByCertRef = {};
        items.forEach(function (it) {
          var ref = extractCertRef(it.body);
          if (ref && it.engineer) engineerByCertRef[ref] = it.engineer;
        });
        // Snapshot existing record savedAt's so we can detect freshly-imported records.
        var preExistingSavedAt = {};
        try {
          var preRecs = JSON.parse(localStorage.getItem("gsc_records") || "[]");
          preRecs.forEach(function (r) { if (r && r.savedAt) preExistingSavedAt[r.savedAt] = true; });
        } catch (e) {}

        // Drive the UI: unlock → home → GSC Email → Import tab → paste → Parse → Import All
        try {
          // 0. Unlock the bandofmates React app first.
          await unlockReactApp();

          // 1. Click "GSC Email" home tile (it's a div with cursor:pointer).
          await waitFor(function () { return findClickableByText("GSC Email"); }, 8000);
          findClickableByText("GSC Email").click();

          // 2. Click "Import Reply" tab
          await waitFor(function () { return findClickableByText("Import Reply"); }, 4000);
          findClickableByText("Import Reply").click();

          // 3. Find the textarea and fill it
          var ta = await waitFor(function () {
            var els = document.querySelectorAll("textarea");
            for (var i = 0; i < els.length; i++) {
              if ((els[i].placeholder || "").indexOf("Paste the completed email reply") !== -1) return els[i];
            }
            return null;
          }, 4000);
          setReactInputValue(ta, combined);

          // 4. Click Parse Email
          await new Promise(function (r) { setTimeout(r, 200); });
          var parseBtn = findClickableByText("Parse Email");
          if (!parseBtn || parseBtn.disabled) throw new Error("Parse button unavailable");
          parseBtn.click();

          // 5. Wait for parse to finish, then click the create/import action.
          //    The bandofmates button label is "✅ Create N Gas Safety Certificates".
          //    Hunt for it by substring ("Create" + "Certificate") and try a few
          //    fallbacks before giving up.
          await new Promise(function (r) { setTimeout(r, 800); });
          function findCreateBtn() {
            var btns = document.querySelectorAll("button");
            for (var i = 0; i < btns.length; i++) {
              var t = (btns[i].textContent || "").trim();
              if (t.indexOf("Create") !== -1 && t.indexOf("Certificate") !== -1) return btns[i];
            }
            for (var j = 0; j < btns.length; j++) {
              var t2 = (btns[j].textContent || "").trim();
              if (/^✅/.test(t2) || t2.toLowerCase().indexOf("create") === 0) return btns[j];
            }
            return null;
          }
          var importBtn = findCreateBtn();
          // Wait up to 4s if the parse is still running.
          if (!importBtn) {
            try {
              importBtn = await waitFor(findCreateBtn, 4000);
            } catch (e) {}
          }
          if (!importBtn || importBtn.disabled) {
            throw new Error("Create button not found after parse");
          }
          importBtn.click();
          // Bandofmates may show a confirm() dialog — we already auto-accepted
          // any window.confirm via the override below. Wait for the alert and
          // for the records to land in localStorage.
          await waitFor(function () {
            try {
              var rs = JSON.parse(localStorage.getItem("gsc_records") || "[]");
              return rs.length > Object.keys(preExistingSavedAt).length;
            } catch (e) { return false; }
          }, 8000);
          await new Promise(function (r) { setTimeout(r, 300); });

          // 5b. Override engineer fields on every freshly-imported record so the
          // certificate shows the engineer who actually did the visit
          // (Name + Gas Safe Reg No + Licence No), not the admin's default profile.
          try {
            var recs = JSON.parse(localStorage.getItem("gsc_records") || "[]");
            var changed = false;
            for (var ri = 0; ri < recs.length; ri++) {
              var rec = recs[ri];
              if (!rec || preExistingSavedAt[rec.savedAt]) continue; // skip pre-existing
              var ref = rec && rec.certData && rec.certData.certRef;
              var eng = ref ? engineerByCertRef[ref] : null;
              if (!eng) continue;
              rec.engineerData = rec.engineerData || {};
              if (eng.fullName) rec.engineerData.engineerName = eng.fullName;
              if (eng.gasSafeRegNo) rec.engineerData.gasSafeNo = eng.gasSafeRegNo;
              if (eng.licenceNo) rec.engineerData.gasId = eng.licenceNo;
              changed = true;
            }
            if (changed) {
              localStorage.setItem("gsc_records", JSON.stringify(recs));
            }
          } catch (e) { /* leave records unchanged on failure */ }

          // 6. Clear the cloud queue (success).
          await fetch("/api/submissions", {
            method: "DELETE",
            headers: { "x-admin-key": ADMIN_KEY },
          }).catch(function () {});

          show("Done", "Imported " + items.length + " submission" + (items.length === 1 ? "" : "s") + ".");
          setTimeout(hide, 1200);
        } catch (e) {
          show("Auto-import paused", "Found " + items.length + " in queue but the parser screen didn't load in time. The data is still in the textarea — tap Parse Email manually.");
          setTimeout(hide, 4000);
        }
      }

      // Kick off after the bundle has had a moment to mount.
      window.addEventListener("DOMContentLoaded", function () {
        /* auto-import disabled — use Import Daybook button instead */
      });
    })();
    </script>
  
    <script>
// =====================================================
// DAYBOOK IMPORT (admin side)
// =====================================================
// Adds an "Import Daybook" floating button and a hidden file picker.
// On file select, parses the JSON daybook and writes records straight into
// localStorage["gsc_records"] (bypasses the email parser entirely).
//
// Also patches the bundle's "Download PDF" flow so when a record has photos,
// a multi-page PDF is built (cert page first, then one photo per page).

(function () {
  const DAYBOOK_FILE_ID = "gs-daybook-file";
  const DAYBOOK_LOG_ID = "gs-daybook-log";
  const TILE_DAYBOOK_ID = "gs-tile-daybook";
  const TILE_JOBS_ID = "gs-tile-jobs";

  // Find the home dashboard ('What would you like to do?' screen).
  // Returns the React grid container that directly holds the New Job /
  // Records / GSC Email tiles, so we can append our two extra tiles as
  // siblings (same row).
  function findHomeTilesContainer() {
    // Step 1: locate leaf nodes for each of the three React tiles.
    const all = [...document.querySelectorAll("div, span, h1, h2, h3, p")];
    function leafOf(label) {
      for (const el of all) {
        if (el.children.length === 0 && (el.textContent || "").trim() === label) return el;
      }
      return null;
    }
    const leaves = [leafOf("New Job"), leafOf("Records"), leafOf("GSC Email")];
    if (leaves.some(l => !l)) return null;

    // Step 2: build ancestor chains for each leaf.
    function chain(el) {
      const out = [];
      while (el) { out.push(el); el = el.parentElement; }
      return out;
    }
    const chains = leaves.map(chain);

    // Step 3: find the lowest common ancestor of all three leaves.
    const setA = new Set(chains[0]);
    const setB = new Set(chains[1]);
    let lca = null;
    for (const node of chains[2]) {
      if (setA.has(node) && setB.has(node)) { lca = node; break; }
    }
    if (!lca) return null;

    // Sanity: the LCA should be a flex/grid container so siblings line up.
    try {
      const cs = getComputedStyle(lca);
      if (cs.display !== "flex" && cs.display !== "grid" && cs.display !== "inline-flex") return null;
    } catch (e) { return null; }
    return lca;
  }

  function ensureFileInput() {
    let file = document.getElementById(DAYBOOK_FILE_ID);
    if (file) return file;
    file = document.createElement("input");
    file.type = "file";
    file.id = DAYBOOK_FILE_ID;
    file.accept = "application/json,.json";
    file.style.display = "none";
    file.addEventListener("change", onFileChosen);
    document.body.appendChild(file);
    return file;
  }

  function ensureLog() {
    let log = document.getElementById(DAYBOOK_LOG_ID);
    if (log) return log;
    log = document.createElement("div");
    log.id = DAYBOOK_LOG_ID;
    log.style.cssText = [
      "position:fixed", "left:50%", "transform:translateX(-50%)",
      "bottom:24px", "z-index:9998",
      "background:#1a2530", "color:#fff", "border:1px solid #334",
      "border-radius:12px", "padding:14px 18px", "max-width:340px",
      "font:600 13px/1.4 ui-sans-serif,system-ui,sans-serif",
      "display:none", "box-shadow:0 6px 24px rgba(0,0,0,0.4)",
      "text-align:center",
    ].join(";");
    document.body.appendChild(log);
    return log;
  }

  function buildTile(id, label, iconHtml, onClick) {
    const wrap = document.createElement("div");
    wrap.id = id;
    wrap.className = "gs-extra-tile";
    wrap.innerHTML =
      '<div class="gs-tile-circle"><div class="gs-tile-icon">' + iconHtml + '</div></div>' +
      '<div class="gs-tile-label">' + label + '</div>';
    wrap.addEventListener("click", onClick);
    return wrap;
  }

  function ensureUi() {
    ensureFileInput();
    ensureLog();

    const container = findHomeTilesContainer();
    if (!container) {
      // We're not on the home dashboard — remove any orphaned tiles.
      const a = document.getElementById(TILE_DAYBOOK_ID);
      const b = document.getElementById(TILE_JOBS_ID);
      const r = document.getElementById("gs-extra-tile-row");
      if (a) a.remove();
      if (b) b.remove();
      if (r) r.remove();
      return;
    }

    // Drop any old wrapper from previous deploys.
    const oldRow = document.getElementById("gs-extra-tile-row");
    if (oldRow) oldRow.remove();

    // Inject Import Daybook tile DIRECTLY into the React grid so it becomes
    // a sibling of New Job / Records / GSC Email — same row, same gap.
    if (!document.getElementById(TILE_DAYBOOK_ID) || document.getElementById(TILE_DAYBOOK_ID).parentElement !== container) {
      const old = document.getElementById(TILE_DAYBOOK_ID);
      if (old) old.remove();
      const tile = buildTile(TILE_DAYBOOK_ID, "Import Daybook", "\u2B07", function () {
        ensureFileInput().click();
      });
      container.appendChild(tile);
    }

    // Inject Assign Jobs tile as the 5th sibling.
    if (!document.getElementById(TILE_JOBS_ID) || document.getElementById(TILE_JOBS_ID).parentElement !== container) {
      const old = document.getElementById(TILE_JOBS_ID);
      if (old) old.remove();
      const tile = buildTile(TILE_JOBS_ID, "Assign Jobs", "\uD83D\uDCCB", function () {
        window.location.href = "/admin/jobs";
      });
      container.appendChild(tile);
    }
  }

  function showLog(msg, color) {
    const el = document.getElementById(DAYBOOK_LOG_ID);
    if (!el) return;
    el.textContent = msg;
    el.style.borderColor = color || "#334";
    el.style.display = "block";
    clearTimeout(showLog._t);
    showLog._t = setTimeout(() => { el.style.display = "none"; }, 4500);
  }

  function onFileChosen(ev) {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch (e) { showLog("Could not parse JSON: " + e.message, "#c0392b"); return; }
      const result = importDaybook(data);
      const certs = result.imported || 0;
      const dups  = result.duplicates || 0;
      const na    = result.noAccess || 0;
      // BUG-FIX ("Imported N certs" lied when localStorage write failed):
      // If the records couldn't be persisted (typically because the JSON
      // included photos as data URLs and exceeded the browser quota), tell
      // the user honestly. Don't reload — reload would just show an empty
      // Records folder again.
      if (result.saveOk === false) {
        showLog(
          "Could not save records: " + (result.saveErr || "storage full") +
          ". Photos in this JSON are too big for the browser. Re-send today's daybook from the engineer phone (it now uploads photos to Drive separately) or import a slimmer JSON.",
          "#c0392b"
        );
        return;
      }
      let parts = [];
      parts.push("Imported " + certs + " cert" + (certs === 1 ? "" : "s"));
      if (dups) parts.push(dups + " skipped (already imported)");
      if (na) parts.push(na + " no-access logged");
      showLog(parts.join(" · ") + " — refreshing…", "#2a52d4");
      // Persist a one-shot toast across reload via sessionStorage.
      try {
        sessionStorage.setItem("gs_import_toast", parts.join(" · "));
        // Mark that we should auto-unlock the React password screen if it appears.
        sessionStorage.setItem("gs_auto_unlock", "1");
      } catch (e) {}
      // CRITICAL: the React bundle keeps gsc_records in local state and writes it
      // back on every render — it would clobber the localStorage we just wrote.
      // Force a full reload so React re-initializes from the fresh localStorage.
      // The auto-unlock IIFE below will fill the password automatically so the
      // user never sees the lock screen.
      setTimeout(() => { window.location.reload(); }, 600);
    };
    reader.onerror = () => showLog("Could not read file.", "#c0392b");
    reader.readAsText(f);
    // Reset input so re-selecting the same file fires change again.
    ev.target.value = "";
  }

  // Format an ISO/Date string as DD/MM/YYYY for folder names. Falls back to
  // savedAt if issueDate is missing, then to today.
  function folderNameForRecord(rec) {
    // PRIORITY ORDER (most-trustworthy first):
    //   1. engineerData.certDate — the engineer-entered work date (ISO).
    //      This is the SINGLE SOURCE OF TRUTH for when the gas check was
    //      actually carried out. Set by buildRecord() on the engineer side
    //      from prop.date (DD/MM/YYYY entered on the property form).
    //   2. finalChecks.inspectionDate — the next-inspection-due date (ISO).
    //      Used as a fallback only — note it's WORK_DATE + 1 YEAR, so we
    //      subtract a year before using it for the folder name.
    //   3. certData.issueDate — only present on synthetic/imported records;
    //      kept for backwards compatibility with old daybook JSONs.
    //   4. signatureData.issuedByDate / savedAt — last-resort fallbacks.
    // savedAt is the WORST fallback because the engineer's daybook stamps
    // it with the moment the queue is swept (today), NOT the work date.
    const engCertDate = rec && rec.engineerData && rec.engineerData.certDate;
    if (engCertDate) {
      const d = new Date(engCertDate);
      if (!isNaN(d.getTime())) {
        const dd = String(d.getUTCDate()).padStart(2, "0");
        const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
        const yy = d.getUTCFullYear();
        return dd + "/" + mm + "/" + yy;
      }
    }
    const finalChecksInspDate = rec && rec.finalChecks && rec.finalChecks.inspectionDate;
    if (finalChecksInspDate) {
      const d = new Date(finalChecksInspDate);
      if (!isNaN(d.getTime())) {
        // Inspection date is work-date + 1 year; subtract a year to get
        // back to the actual work date used for folder grouping.
        const work = new Date(Date.UTC(d.getUTCFullYear() - 1, d.getUTCMonth(), d.getUTCDate(), 12, 0, 0));
        const dd = String(work.getUTCDate()).padStart(2, "0");
        const mm = String(work.getUTCMonth() + 1).padStart(2, "0");
        const yy = work.getUTCFullYear();
        return dd + "/" + mm + "/" + yy;
      }
    }
    const raw =
      (rec && rec.certData && rec.certData.issueDate) ||
      (rec && rec.certData && rec.certData.inspectionDate) ||
      (rec && rec.signatureData && rec.signatureData.issuedByDate) ||
      (rec && rec.savedAt) ||
      new Date().toISOString();
    let d = new Date(raw);
    if (isNaN(d.getTime())) {
      // Try DD/MM/YYYY input as-is
      const m = String(raw).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) return raw.slice(0, 10);
      d = new Date();
    }
    const dd = String(d.getUTCDate()).padStart(2, "0");
    const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
    const yy = d.getUTCFullYear();
    return dd + "/" + mm + "/" + yy;
  }

  // Look up an existing folder by name, or create one and return its id.
  // Mutates the folders array in place.
  function ensureFolder(folders, name) {
    const found = folders.find(f => f && f.name === name);
    if (found) return found.id;
    const id = "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    folders.push({ id: id, name: name });
    return id;
  }

  function importDaybook(data) {
    if (!data || (!Array.isArray(data.certs) && !Array.isArray(data.noAccess))) {
      showLog("Invalid daybook — no certs/noAccess arrays.", "#c0392b");
      return { imported: 0, duplicates: 0, noAccess: 0 };
    }

    let recs = [];
    try { recs = JSON.parse(localStorage.getItem("gsc_records") || "[]"); }
    catch (e) { recs = []; }

    let folders = [];
    try { folders = JSON.parse(localStorage.getItem("gsc_folders") || "[]"); }
    catch (e) { folders = []; }
    if (!Array.isArray(folders)) folders = [];

    let imported = 0, duplicates = 0;
    (data.certs || []).forEach(rec => {
      if (!rec || !rec.certData || !rec.certData.certRef) return;
      const ref = rec.certData.certRef;
      // Replace existing record with same certRef from today, otherwise add.
      const todayPrefix = (rec.savedAt || "").slice(0, 10);
      const idx = recs.findIndex(r =>
        r && r.certData && r.certData.certRef === ref &&
        ((r.savedAt || "").slice(0, 10) === todayPrefix)
      );
      // Make sure record matches admin's expected shape — passes through cleanly
      // because the engineer side already builds records using the admin schema.
      const cleaned = Object.assign({}, rec);
      // Ensure id exists (admin ignores it but harmless)
      if (!cleaned.id) cleaned.id = "rec_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      // ---- Auto-folder by engineer-entered date ----
      // Each cert is filed into a folder named after its issueDate (DD/MM/YYYY).
      // If the folder doesn't exist yet, it's created. If the record already has
      // a manually-set gscFolder, leave it alone (don't override the user's choice
      // on re-import).
      if (!cleaned.gscFolder) {
        const folderName = folderNameForRecord(cleaned);
        cleaned.gscFolder = ensureFolder(folders, folderName);
      }
      if (idx >= 0) {
        // Preserve any manual folder the user has set on the existing record.
        if (recs[idx] && recs[idx].gscFolder) cleaned.gscFolder = recs[idx].gscFolder;
        recs[idx] = cleaned;
        duplicates++;
      } else {
        recs.push(cleaned);
        imported++;
      }
    });

    // Save no-access entries separately so we can show them in admin (TODO UI)
    const naKey = "gsc_no_access_log";
    let naLog = [];
    try { naLog = JSON.parse(localStorage.getItem(naKey) || "[]"); } catch (e) {}
    let naAdded = 0;
    (data.noAccess || []).forEach(na => {
      naLog.push(Object.assign({}, na, { date: na.date || data.date || new Date().toISOString().slice(0, 10) }));
      naAdded++;
    });

    // BUG-FIX (Records folder empty after import — May 2026):
    // Previously this was `try { setItem... } catch (e) {}`. When the records
    // payload exceeded the browser's localStorage quota (≈ 5–10 MB) the write
    // silently failed but the import still showed "Imported N certs" and the
    // page reloaded — so the user saw an empty Records folder with no
    // explanation. Now: catch the quota error explicitly, surface it to the
    // log, and signal failure to the caller so the toast says something
    // accurate ("Records too big to save — see console / open in chunks").
    let saveOk = true;
    let saveErr = "";
    try {
      localStorage.setItem("gsc_records", JSON.stringify(recs));
    } catch (e) {
      saveOk = false;
      saveErr = (e && (e.name + ": " + e.message)) || "setItem failed";
      console.error("[gsc] gsc_records setItem failed:", e);
    }
    if (saveOk) {
      try { localStorage.setItem("gsc_folders", JSON.stringify(folders)); }
      catch (e) { console.error("[gsc] gsc_folders setItem failed:", e); saveOk = false; }
      try { localStorage.setItem(naKey, JSON.stringify(naLog)); }
      catch (e) { console.warn("[gsc] no-access log setItem failed:", e); /* non-fatal */ }
    }

    return { imported, duplicates, noAccess: naAdded, saveOk: saveOk, saveErr: saveErr };
  }

  // ---------- CLOUD DAYBOOK AUTO-IMPORT ----------
  // BUG-FIX (Photos missing on admin PDFs):
  // The engineer side now POSTs the FULL daybook (including photo data URLs)
  // to /api/daybook on send.  This pulls the queue down, imports each daybook
  // via the same importDaybook() path used by the manual file picker, then
  // clears the cloud queue so we never double-import.
  //
  // Runs once on first admin load (and again on every reload).  Idempotent
  // because importDaybook() upserts by certRef+date.
  let cloudDaybookFetchInFlight = false;
  async function fetchCloudDaybooksOnce() {
    if (cloudDaybookFetchInFlight) return;
    cloudDaybookFetchInFlight = true;
    try {
      const adminKey = (function () {
        try { return sessionStorage.getItem("gsAdminKey") || ""; } catch (e) { return ""; }
      })();
      if (!adminKey) return; // not signed in
      const resp = await fetch("/api/daybook", {
        method: "GET",
        headers: { "x-admin-key": adminKey },
      });
      if (!resp.ok) return;
      const data = await resp.json().catch(function () { return {}; });
      const items = (data && data.items) || [];
      if (!items.length) return;

      let totalCerts = 0, totalDups = 0, totalNa = 0, photoTotal = 0;
      let saveFailed = false;
      let saveFailDetail = "";
      for (const it of items) {
        const d = it && it.daybook;
        if (!d) continue;
        // Count photos for the toast.
        (d.certs || []).forEach(function (c) {
          if (Array.isArray(c.photos)) photoTotal += c.photos.length;
        });
        const r = importDaybook(d);
        totalCerts += r.imported || 0;
        totalDups  += r.duplicates || 0;
        totalNa    += r.noAccess || 0;
        if (r.saveOk === false) {
          saveFailed = true;
          saveFailDetail = r.saveErr || "storage full";
        }
      }

      // BUG-FIX: don't clear the cloud queue if persisting locally failed —
      // otherwise the records are lost forever. Surface the error and bail.
      if (saveFailed) {
        showLog(
          "Imported certs but could not save them locally (" + saveFailDetail +
          "). Cloud queue NOT cleared so the data is preserved — contact support.",
          "#c0392b"
        );
        return;
      }

      // Clear the cloud queue ONLY after a successful import.
      await fetch("/api/daybook", {
        method: "DELETE",
        headers: { "x-admin-key": adminKey },
      }).catch(function () {});

      const parts = [];
      parts.push("Pulled " + totalCerts + " cert" + (totalCerts === 1 ? "" : "s") + " from cloud");
      if (photoTotal) parts.push(photoTotal + " photo" + (photoTotal === 1 ? "" : "s"));
      if (totalDups) parts.push(totalDups + " duplicate" + (totalDups === 1 ? "" : "s"));
      if (totalNa) parts.push(totalNa + " no-access");
      try {
        sessionStorage.setItem("gs_import_toast", parts.join(" \u00b7 "));
        sessionStorage.setItem("gs_auto_unlock", "1");
      } catch (e) {}
      // Reload so the React bundle re-reads fresh gsc_records from localStorage.
      // (React holds gsc_records in component state and would clobber our write.)
      //
      // CRITICAL: only reload ONCE per session, otherwise we hit a loop:
      //   - load 1: cloud has items → import → reload
      //   - load 2: cloud now empty (DELETE finished) BUT propagation lag may
      //     leave items still visible → import again → reload again …
      // Worse, even if the cloud truly is empty, React's initial mount writes
      // an empty gsc_records BEFORE our setTimeout fires — if we then reload,
      // the loop never lets the user actually see the records.
      // Solution: gate the reload with a sessionStorage flag so we reload AT
      // MOST once per browser session.  The records are already in
      // localStorage from importDaybook(); the reload just refreshes React
      // state to display them.
      if (totalCerts > 0 || totalDups > 0 || totalNa > 0) {
        let alreadyReloaded = false;
        try { alreadyReloaded = sessionStorage.getItem("gs_cloud_reloaded") === "1"; } catch (e) {}
        if (!alreadyReloaded) {
          try { sessionStorage.setItem("gs_cloud_reloaded", "1"); } catch (e) {}
          showLog(parts.join(" \u00b7 ") + " \u2014 refreshing\u2026", "#2a52d4");
          setTimeout(function () { window.location.reload(); }, 700);
        } else {
          // Already reloaded once. Just show the toast — the user will see
          // the records on next navigation (React lazy-reads from localStorage
          // when it routes between screens).
          showLog(parts.join(" \u00b7 "), "#2a52d4");
        }
      }
    } catch (e) {
      // best-effort — never break admin over a failed cloud fetch
    } finally {
      cloudDaybookFetchInFlight = false;
    }
  }

  // ---------- PDF WITH PHOTOS ----------
  // The bundle generates a single-page cert PDF via html2canvas + jsPDF (or
  // similar). We don't override that — instead we patch the click handler on
  // the "Download PDF" button so AFTER the bundle saves the PDF, we splice
  // photos as additional pages.
  //
  // Simpler approach: hook the saveAs() / download blob URL. But hooking the
  // bundle's internals is fragile. Instead, we add an EXTRA button next to
  // the bundle's Download PDF: "⬇ Download with Photos".
  //
  // This button uses the bundle's existing PDF render, then appends photo
  // pages using pdf-lib (loaded from CDN on first use).

  // Locate the "Download PDF" button on the cert preview screen and add a
  // sibling button with photos.
  let pdfLibPromise = null;
  function loadPdfLib() {
    if (pdfLibPromise) return pdfLibPromise;
    pdfLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
      s.onload = () => resolve(window.PDFLib);
      s.onerror = () => reject(new Error("pdf-lib failed to load"));
      document.head.appendChild(s);
    });
    return pdfLibPromise;
  }

  function getCurrentPreviewRecord() {
    // The bundle puts the cert preview into the DOM. The certRef shown in
    // top-right of the preview can be matched against gsc_records to find the
    // active record (which has any photos attached).
    let recs = [];
    try { recs = JSON.parse(localStorage.getItem("gsc_records") || "[]"); } catch (e) { return null; }
    const previewArea = document.querySelector("[class*='Preview'], [data-cert-preview], .preview, body");
    const txt = (document.body.textContent || "");
    // Heuristic: find the most recent record whose certRef appears in the page text.
    let match = null;
    for (let i = recs.length - 1; i >= 0; i--) {
      const ref = recs[i] && recs[i].certData && recs[i].certData.certRef;
      if (ref && txt.indexOf(ref) !== -1) { match = recs[i]; break; }
    }
    return match;
  }

  // Resolve a photo entry to raw bytes + mime type. Supports legacy
  // dataUrl entries and Drive-backed entries.  Drive entries are now
  // OAuth-fetched directly from googleapis.com using the admin's own
  // Google session (drive.readonly scope) — engineers grant the admin
  // email reader on their files at upload time.  We still fall back to
  // the legacy /api/get-photo (service-account proxy) for older records
  // that pre-date the OAuth migration.
  async function loadPhotoBytes(ph) {
    if (ph && ph.driveFileId) {
      // Try OAuth-direct first.
      try {
        if (window.gsGoogleAuth) {
          const tok = await window.gsGoogleAuth.getValidToken({ interactive: false });
          if (tok && tok.access_token) {
            const url = "https://www.googleapis.com/drive/v3/files/" +
              encodeURIComponent(ph.driveFileId) + "?alt=media";
            const resp = await fetch(url, {
              headers: { Authorization: "Bearer " + tok.access_token },
            });
            if (resp.ok) {
              const buf = await resp.arrayBuffer();
              const mime = (ph.mimeType || resp.headers.get("content-type") || "image/jpeg").toLowerCase();
              return { bytes: new Uint8Array(buf), isPng: mime.indexOf("png") !== -1 };
            }
            // 401/403 → admin's token doesn't see this file.  Fall back.
            console.warn("[gs] OAuth Drive fetch failed " + resp.status + " for " + ph.driveFileId + " — falling back to /api/get-photo");
          }
        }
      } catch (e) {
        console.warn("[gs] OAuth Drive fetch errored", e, "— falling back to /api/get-photo");
      }
      // Legacy SA proxy fallback.
      const adminKey = (function () {
        try { return sessionStorage.getItem("gsAdminKey") || ""; } catch (e) { return ""; }
      })();
      const resp = await fetch(
        "/api/get-photo?id=" + encodeURIComponent(ph.driveFileId),
        { headers: { "x-admin-key": adminKey } }
      );
      if (!resp.ok) throw new Error("drive fetch failed: HTTP " + resp.status);
      const buf = await resp.arrayBuffer();
      const mime = (ph.mimeType || resp.headers.get("content-type") || "image/jpeg").toLowerCase();
      return { bytes: new Uint8Array(buf), isPng: mime.indexOf("png") !== -1 };
    }
    // Legacy data-URL entry.
    if (ph && ph.dataUrl && ph.dataUrl.startsWith("data:image/")) {
      const isPng = ph.dataUrl.indexOf("image/png") !== -1;
      const b64 = ph.dataUrl.split(",")[1];
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      return { bytes, isPng };
    }
    throw new Error("photo has neither driveFileId nor dataUrl");
  }

  async function buildPhotoPdfPages(record, basePdfBytes) {
    const PDFLib = await loadPdfLib();
    const doc = await PDFLib.PDFDocument.load(basePdfBytes);
    const photos = (record && record.photos) || [];
    let skippedPhotos = 0;
    for (const ph of photos) {
      if (!ph || (!ph.dataUrl && !ph.driveFileId)) {
        skippedPhotos++; continue;
      }
      let bytes, isPng;
      try {
        const loaded = await loadPhotoBytes(ph);
        bytes = loaded.bytes; isPng = loaded.isPng;
      } catch (loadErr) {
        console.warn("Skipping photo " + (ph.label || "?") + ": " + (loadErr && loadErr.message));
        skippedPhotos++; continue;
      }
      let img;
      try {
        img = isPng ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
      } catch (e) {
        // try the other format if guess was wrong
        try { img = isPng ? await doc.embedJpg(bytes) : await doc.embedPng(bytes); }
        catch (e2) { skippedPhotos++; continue; }
      }
      const pageWidth = 595.28, pageHeight = 841.89; // A4 portrait
      const page = doc.addPage([pageWidth, pageHeight]);
      const margin = 36;
      const maxW = pageWidth - margin * 2;
      const maxH = pageHeight - margin * 2 - 40; // leave room for label
      const { width: iw, height: ih } = img.scale(1);
      const ratio = Math.min(maxW / iw, maxH / ih);
      const w = iw * ratio, h = ih * ratio;
      const x = (pageWidth - w) / 2;
      const y = (pageHeight - h) / 2 + 20;
      page.drawImage(img, { x, y, width: w, height: h });
      const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
      const label = (ph.label || "Photo").toUpperCase();
      const labelWidth = font.widthOfTextAtSize(label, 11);
      page.drawText(label, {
        x: (pageWidth - labelWidth) / 2,
        y: y - 24,
        size: 11,
        font,
        color: PDFLib.rgb(0.2, 0.2, 0.2),
      });
    }
    return await doc.save();
  }

  // ---------- VISIT BADGE INJECTION ----------
  // The user wants a bold black "Visit 1" / "Visit 2" line on the gas-safety
  // cert preview, placed directly under "Certificate No: <ref>" in the top
  // right of the cert. The bundle's React component doesn't render this, so
  // we inject it into the DOM whenever the cert preview is mounted. Both the
  // visible preview AND the html2canvas snapshot pick it up.
  function ensureVisitBadge() {
    try {
      // The cert preview top-right has three stacked single-line divs:
      //   1) "Certificate Reference"  (caption, fontSize:8, fontWeight:700)
      //   2) "<certRef value>"        (boxed value)
      //   3) "Certificate No: <certRef value>"  (single combined line)
      // The user wants the Visit badge directly under #3, in bold black.
      // Find every leaf div whose text begins with "Certificate No:" and inject
      // a sibling badge after it. The badge is captured by html2canvas into
      // the Download PDF output automatically.
      const allDivs = document.querySelectorAll("div");
      for (const lab of allDivs) {
        if (lab.children && lab.children.length > 0) continue; // leaf only
        const txt = (lab.textContent || "").trim();
        if (!/^Certificate\s*No\s*[:.]/i.test(txt)) continue;
        // Skip if badge already injected immediately after.
        if (lab.nextElementSibling &&
            lab.nextElementSibling.classList &&
            lab.nextElementSibling.classList.contains("cg-visit-badge")) continue;
        // Extract the certRef from the line: "Certificate No: <ref>"
        const m = txt.match(/^Certificate\s*No\s*[:.]\s*(.+)$/i);
        const refFromLine = m ? m[1].trim() : "";
        // Determine the visit number for the active cert preview record.
        const visit = getVisitNumberForActivePreview(refFromLine);
        if (!visit || (visit !== 1 && visit !== 2)) continue;
        // Build the badge.
        const badge = document.createElement("div");
        badge.className = "cg-visit-badge";
        badge.textContent = "Visit " + visit;
        badge.style.cssText =
          "font-size:11px; font-weight:900; color:#000; " +
          "text-align:center; margin-top:4px; letter-spacing:0.5px;";
        lab.insertAdjacentElement("afterend", badge);
      }
    } catch (e) {
      // Best-effort — never break the admin app over a badge.
    }
  }

  function getVisitNumberForActivePreview(refFromLine) {
    // The certRef parsed from the "Certificate No: <ref>" line maps to a
    // record in gsc_records. Fall back to scanning the visible boxed value
    // if the line-extracted ref is empty.
    let ref = (refFromLine || "").trim();
    if (!ref) return null;
    let recs = [];
    try { recs = JSON.parse(localStorage.getItem("gsc_records") || "[]"); } catch (e) { return null; }
    // Find the most recent record whose certRef matches.
    for (let i = recs.length - 1; i >= 0; i--) {
      const r = recs[i];
      if (!r || !r.certData) continue;
      if ((r.certData.certRef || "").trim() === ref) {
        const v = r.certData.visit;
        if (typeof v === "number") return v;
        if (typeof v === "string") return parseInt(v, 10) || null;
        return null;
      }
    }
    return null;
  }

  // Hijack the bundle's "Download PDF" button so EVERY cert PDF includes
  // photos as additional pages whenever the active record has any.
  // The bundle's default save produces a single-page landscape A4 with no
  // photos. We replace that flow: when the user clicks Download PDF, we
  // run our html2canvas+pdf-lib pipeline that always includes photo pages.
  // If the record has no photos, we fall through to the bundle's default.
  function ensurePhotoDownloadBtn() {
    const buttons = [...document.querySelectorAll("button")];
    const dlBtn = buttons.find(b => /download pdf/i.test((b.textContent || "")));
    if (!dlBtn) return;
    if (dlBtn.dataset.photoHijacked) return;
    dlBtn.dataset.photoHijacked = "1";
    // Capture-phase listener so we run BEFORE the bundle's React onClick.
    dlBtn.addEventListener(
      "click",
      function (ev) {
        const rec = getCurrentPreviewRecord();
        if (!rec || !rec.photos || !rec.photos.length) {
          // No photos: let the bundle's default Download PDF run.
          return;
        }
        // Photos exist — take over.
        ev.preventDefault();
        ev.stopImmediatePropagation();
        ev.stopPropagation();
        downloadWithPhotos(rec);
      },
      true // capture
    );
    // Also annotate the button so the user can see how many photos will be appended.
    try {
      const rec = getCurrentPreviewRecord();
      if (rec && rec.photos && rec.photos.length && !dlBtn.dataset.photoCountShown) {
        dlBtn.dataset.photoCountShown = "1";
        const badge = document.createElement("span");
        badge.textContent = " (+ " + rec.photos.length + " photo" + (rec.photos.length === 1 ? "" : "s") + ")";
        badge.style.cssText = "font-size:11px;font-weight:600;opacity:0.85;margin-left:4px;";
        dlBtn.appendChild(badge);
      }
    } catch (e) {}
  }

  async function downloadWithPhotos(rec) {
    showLog("Generating PDF with photos…");
    // Step 1: trigger the bundle's existing "Download PDF" via a hidden flow.
    // Easiest: instead of intercepting, build the cert-page server-side using
    // html2canvas + jsPDF on the existing preview DOM. The preview is already
    // mounted (we're on the preview screen).
    try {
      const certPdfBytes = await buildCertPdfFromPreview();
      const finalBytes = await buildPhotoPdfPages(rec, certPdfBytes);
      const blob = new Blob([finalBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const ref = (rec.certData && rec.certData.certRef) || "Gas Safety Cert";
      a.href = url;
      a.download = ref.replace(/[^A-Za-z0-9]+/g, "_") + ".pdf";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      showLog("PDF saved with " + rec.photos.length + " photo page(s).", "#2a52d4");
    } catch (e) {
      showLog("PDF generation failed: " + (e.message || "unknown"), "#c0392b");
    }
  }

  // Build the cert-page PDF by rasterising the visible preview DOM.
  // Mirrors the bundle's own `Cf` flow: forces the preview to 1200px wide
  // before snapshotting so the cert renders at full landscape A4 width.
  async function buildCertPdfFromPreview() {
    await loadHtml2CanvasIfNeeded();
    await loadJsPdfIfNeeded();
    const target = findCertPreviewElement();
    if (!target) throw new Error("Could not find cert preview");
    // Match the bundle's stretch: width 1200px, then capture full scrollHeight.
    const W = 1200;
    const prev = { w: target.style.width, mw: target.style.maxWidth, mn: target.style.minWidth };
    target.style.width = W + "px";
    target.style.maxWidth = W + "px";
    target.style.minWidth = W + "px";
    await new Promise(r => setTimeout(r, 200));
    const canvas = await window.html2canvas(target, {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: "#fff",
      width: W,
      height: target.scrollHeight,
      windowWidth: W,
      scrollX: 0,
      scrollY: 0,
    });
    target.style.width = prev.w;
    target.style.maxWidth = prev.mw;
    target.style.minWidth = prev.mn;
    const imgData = canvas.toDataURL("image/jpeg", 0.97);
    const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const pageW = 297, pageH = 210;
    const aspect = canvas.width / canvas.height;
    const pageAspect = pageW / pageH;
    let dw, dh, dx, dy;
    if (aspect > pageAspect) {
      dw = pageW; dh = pageW / aspect; dx = 0; dy = (pageH - dh) / 2;
    } else {
      dh = pageH; dw = pageH * aspect; dy = 0; dx = (pageW - dw) / 2;
    }
    pdf.addImage(imgData, "JPEG", dx, dy, dw, dh);
    return pdf.output("arraybuffer");
  }

  function findCertPreviewElement() {
    // The bundle's cert preview is a WHITE-background card containing the
    // certificate. The wrapper around it (dark grey backdrop) also contains
    // the same text but isn't what we want to render. Pick the SMALLEST
    // qualifying element with a white-ish background — that's the cert card.
    const candidates = [...document.querySelectorAll("div, section")];
    let best = null, bestArea = Infinity;
    for (const el of candidates) {
      const txt = el.textContent || "";
      if (txt.length < 500) continue;
      if (!/Gas Safety Record/i.test(txt)) continue;
      const r = el.getBoundingClientRect();
      if (r.width < 600 || r.height < 300) continue;
      // Must have a white-ish background to qualify as the cert card.
      const bg = getComputedStyle(el).backgroundColor || "";
      const m = bg.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (!m) continue;
      const r1 = +m[1], g1 = +m[2], b1 = +m[3];
      if (r1 < 240 || g1 < 240 || b1 < 240) continue;
      const area = r.width * r.height;
      if (area < bestArea) { best = el; bestArea = area; }
    }
    // Fallback: any element with the cert text, smallest by area.
    if (!best) {
      let smallest = null, smallestArea = Infinity;
      for (const el of candidates) {
        const txt = el.textContent || "";
        if (txt.length < 500) continue;
        if (!/Gas Safety Record/i.test(txt)) continue;
        const r = el.getBoundingClientRect();
        if (r.width < 600 || r.height < 300) continue;
        const area = r.width * r.height;
        if (area < smallestArea) { smallest = el; smallestArea = area; }
      }
      best = smallest;
    }
    return best;
  }

  let html2canvasPromise = null;
  function loadHtml2CanvasIfNeeded() {
    if (window.html2canvas) return Promise.resolve();
    if (html2canvasPromise) return html2canvasPromise;
    html2canvasPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("html2canvas failed to load"));
      document.head.appendChild(s);
    });
    return html2canvasPromise;
  }

  let jspdfPromise = null;
  function loadJsPdfIfNeeded() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
    if (jspdfPromise) return jspdfPromise;
    jspdfPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("jsPDF failed to load"));
      document.head.appendChild(s);
    });
    return jspdfPromise;
  }

  // ---------- AUTO-FOLDER SWEEPER ----------
  // Catch-all: ensure every record in gsc_records has a gscFolder set to a
  // date-named folder. This covers ALL ingestion paths (Import Daybook,
  // GSC Email reply parser, future paths) — not just the importDaybook()
  // function. Runs on boot and again whenever localStorage changes.
  function autoFolderAllRecords() {
    let recs = [];
    let folders = [];
    try { recs = JSON.parse(localStorage.getItem("gsc_records") || "[]"); } catch (e) { return; }
    try { folders = JSON.parse(localStorage.getItem("gsc_folders") || "[]"); } catch (e) { folders = []; }
    if (!Array.isArray(recs) || !Array.isArray(folders)) return;
    let changedRecs = false;
    let changedFolders = false;
    for (var i = 0; i < recs.length; i++) {
      var rec = recs[i];
      if (!rec) continue;
      var name = folderNameForRecord(rec);
      // If the record is already filed in a folder whose name matches its
      // computed work-date folder, leave it alone. If the names differ, we
      // RE-FILE the record into the correct folder. This handles the legacy
      // case where records were filed into a today-named folder (because
      // folderNameForRecord used to fall back to savedAt = today) instead
      // of the engineer-entered work date. Manual user moves are NOT
      // overridden because we only check the work-date folder name match
      // against the engineer-entered date — if a record was MANUALLY moved
      // to a non-date folder, that folder name won't match either, so we'd
      // re-file it. To preserve manual moves, we only re-file when the
      // current folder's name parses as DD/MM/YYYY (i.e. a date folder).
      if (rec.gscFolder) {
        var currentFolder = folders.find(function (f) { return f && f.id === rec.gscFolder; });
        if (currentFolder && currentFolder.name === name) continue;  // already correct
        // If currentFolder's name is NOT a date (manual move), keep it.
        if (currentFolder && !/^\d{2}\/\d{2}\/\d{4}$/.test(currentFolder.name || "")) continue;
      }
      var existing = folders.find(function (f) { return f && f.name === name; });
      var fid;
      if (existing) {
        fid = existing.id;
      } else {
        fid = "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
        folders.push({ id: fid, name: name });
        changedFolders = true;
      }
      if (rec.gscFolder !== fid) {
        rec.gscFolder = fid;
        changedRecs = true;
      }
    }
    // Drop any date-named folder that no longer contains records. Manual
    // (non-date) folders are kept even if empty so the user's organisation
    // survives.
    var usedFolderIds = {};
    for (var k = 0; k < recs.length; k++) {
      if (recs[k] && recs[k].gscFolder) usedFolderIds[recs[k].gscFolder] = 1;
    }
    var prunedFolders = folders.filter(function (f) {
      if (!f) return false;
      var isDateFolder = /^\d{2}\/\d{2}\/\d{4}$/.test(f.name || "");
      if (!isDateFolder) return true;       // keep manual folders
      return !!usedFolderIds[f.id];          // drop empty date folders
    });
    if (prunedFolders.length !== folders.length) {
      folders = prunedFolders;
      changedFolders = true;
    }
    if (changedRecs) { try { localStorage.setItem("gsc_records", JSON.stringify(recs)); } catch (e) {} }
    if (changedFolders) { try { localStorage.setItem("gsc_folders", JSON.stringify(folders)); } catch (e) {} }
    return changedRecs || changedFolders;
  }

  // ---------- BOOT ----------
  window.addEventListener("DOMContentLoaded", function () {
    setTimeout(ensureUi, 400);
    // First sweep on boot — catches anything imported via legacy paths.
    setTimeout(autoFolderAllRecords, 600);
    // Re-sweep every 3s while admin is open — covers records added
    // mid-session (e.g. via GSC Email parse).
    setInterval(autoFolderAllRecords, 3000);
    // Watch for screen changes — re-add the dashboard tiles when home is shown,
    // remove them when navigating away. Also handles the cert-preview photo btn
    // and the Visit 1/2 badge injection on cert previews.
    const mo = new MutationObserver(() => {
      ensureUi();
      ensurePhotoDownloadBtn();
      ensureVisitBadge();
    });
    mo.observe(document.body, { childList: true, subtree: true });
    // Also re-check periodically — html2canvas-driven PDF flows can rerender
    // without triggering a mutation we observe.
    setInterval(ensureVisitBadge, 1500);
    // Pull any photo-bearing daybooks from the cloud queue. Slight delay so
    // the React bundle has had time to mount and write its initial state to
    // localStorage — we want our import to be the LAST writer.
    setTimeout(fetchCloudDaybooksOnce, 1500);
  });
})();

    </script>
  </body>
