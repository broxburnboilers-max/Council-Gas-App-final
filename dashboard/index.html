    <!-- Records normaliser: every record lives inside a date subfolder (DD Mon YYYY). -->
    <script>
    (function () {
      var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      function dateFolderName(d) {
        return String(d.getDate()).padStart(2,"0") + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
      }
      function isDateFolderName(s) {
        return /^\d{2}\s(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s\d{4}$/.test(String(s||"").trim());
      }
      function recordDate(r) {
        var iso = r && (r.createdAt || r.inspectionDate || r.certDate);
        var d = iso ? new Date(iso) : null;
        if (!d || isNaN(d.getTime())) d = new Date();
        return d;
      }

      function normaliseRecords() {
        var records, folders;
        try { records = JSON.parse(localStorage.getItem("gsc_records") || "[]"); } catch (e) { records = []; }
        try { folders = JSON.parse(localStorage.getItem("gsc_folders") || "[]"); } catch (e) { folders = []; }
        if (!Array.isArray(records) || !Array.isArray(folders)) return;

        // Index existing date folders by name.
        var byName = {};
        folders.forEach(function (f) { if (f && isDateFolderName(f.name)) byName[f.name] = f; });

        var changed = false;

        // Make sure every record points to a date folder matching its creation date.
        records.forEach(function (r) {
          if (!r) return;
          var name = dateFolderName(recordDate(r));
          var folder = byName[name];
          if (!folder) {
            folder = { id: "folder_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), name: name };
            folders.push(folder);
            byName[name] = folder;
            changed = true;
          }
          if (r.gscFolder !== folder.id) { r.gscFolder = folder.id; changed = true; }
        });

        // Drop non-date folders entirely.
        var keep = [], dropped = {};
        folders.forEach(function (f) {
          if (f && isDateFolderName(f.name)) keep.push(f);
          else if (f && f.id) { dropped[f.id] = true; changed = true; }
        });
        // Any record that pointed to a dropped folder will already have been
        // re-assigned above (since we ran the date-folder pass first).
        // Drop empty date folders too — only keep folders that contain at least one record.
        var folderHasRecord = {};
        records.forEach(function (r) { if (r && r.gscFolder) folderHasRecord[r.gscFolder] = true; });
        keep = keep.filter(function (f) {
          if (folderHasRecord[f.id]) return true;
          changed = true;
          return false;
        });

        if (changed) {
          localStorage.setItem("gsc_records", JSON.stringify(records));
          localStorage.setItem("gsc_folders", JSON.stringify(keep));
        }
      }

      // Run once on load, and then re-run whenever the dashboard might have just
      // created new records (after auto-import, after manual save).
      window.addEventListener("DOMContentLoaded", normaliseRecords);
      window.addEventListener("storage", function (ev) {
        if (ev && (ev.key === "gsc_records" || ev.key === "gsc_folders")) normaliseRecords();
      });
      // Lightweight polling so navigation between screens within the same tab also catches changes.
      var lastRecsLen = -1;
      setInterval(function () {
        try {
          var raw = localStorage.getItem("gsc_records") || "[]";
          var len = raw.length;
          if (len !== lastRecsLen) { lastRecsLen = len; normaliseRecords(); }
        } catch (e) {}
      }, 1500);
    })();
    </script>

      // (Transfer Records / Export / Import sit below the row list and stay visible.)
      var RECORDS_KEEP = ["gas safety certificates"];
      var RECORDS_KILL = ["reminders due", "boiler service records", "gas works",
                          "gas isolation", "invoices", "quotes", "account reports",
                          "yearly reports", "yearly report", "warning notices",
                          "warning notice"];

      // Climb until we reach the actual row/tile card: an ancestor whose parent has
      // enough siblings to be a list or a grid (≥5). We must move at least one level

      function climbToTile(el) {

        else document.body.classList.remove("cg-on-cert");
      }

      function applyFilters() {
        var root = document.getElementById("root");
        if (!root) return;
        tagCertificate(root);
        var labels = root.querySelectorAll("div, span, p, h2, h3, h4");
        labels.forEach(function (el) {
          if (el.children.length > 0) return; // leaf text nodes only
          var t = (el.textContent || "").trim().toLowerCase();
          if (!t || t.length > 30) return;

          // Home-screen tiles
          if (HOME_KNOWN.indexOf(t) !== -1) {
            var tile = climbToTile(el);
            if (HOME_ALLOW.indexOf(t) !== -1) tile.classList.remove("cg-hide-tile");
            else tile.classList.add("cg-hide-tile");
            return;
          }

          // Records-page rows
          if (RECORDS_KILL.indexOf(t) !== -1) {
            climbToTile(el).classList.add("cg-hide-tile");
            return;
          }
          if (RECORDS_KEEP.indexOf(t) !== -1) {
            climbToTile(el).classList.remove("cg-hide-tile");

      var mo = new MutationObserver(function () { applyFilters(); ensureVisitBadge(); });
      window.addEventListener("DOMContentLoaded", function () {
        applyFilters();

      // ---------- VISIT BADGE INJECTION ----------
      // The user wants a bold black "Visit 1" / "Visit 2" line on the gas-safety
      // cert preview, placed directly under the "Certificate No: <ref>" line

          for (var i = 0; i < allDivs.length; i++) {
            var lab = allDivs[i];

            var txt = (lab.textContent || "").trim();
            if (!/^Certificate\s*No\s*[:.]/i.test(txt)) continue;
            if (lab.nextElementSibling &&
                lab.nextElementSibling.classList &&
                lab.nextElementSibling.classList.contains("cg-visit-badge")) continue;
            var m = txt.match(/^Certificate\s*No\s*[:.]\s*(.+)$/i);
            var ref = m ? m[1].trim() : "";

            var badge = document.createElement("div");

            badge.textContent = "Visit " + visit;
            badge.style.cssText =
              "font-size:11px; font-weight:900; color:#000; " +
              "text-align:center; margin-top:4px; letter-spacing:0.5px;";
            lab.insertAdjacentElement("afterend", badge);
          }
        } catch (e) {}
      }
      function lookupVisitForRef(ref) {
        var recs = [];
        try { recs = JSON.parse(localStorage.getItem("gsc_records") || "[]"); } catch (e) { return null; }
        for (var i = recs.length - 1; i >= 0; i--) {
          var r = recs[i];
          if (!r || !r.certData) continue;
          if ((r.certData.certRef || "").trim() === ref) {
            var v = r.certData.visit;
            if (typeof v === "number") return v;
            if (typeof v === "string") return parseInt(v, 10) || null;
            return null;
          }
        }
        return null;
      }
    })();

          + '<div style="font-size:20px;font-weight:700;margin-bottom:4px;">Creating certificates…</div>'
          + '<div id="cg-msg" style="font-size:15px;color:#b8c2c8;">Preparing your data</div>'
          + '</div>';
        document.body.insertAdjacentHTML("beforeend", html);
        document.body.classList.add("cg-stealth");
        // Reveal hidden tiles so the queue auto-clicker can find GSC Email etc.
        document.body.classList.add("cg-show-all-tiles");
        splash = document.getElementById("cg-splash");
        msgEl  = document.getElementById("cg-msg");
      }

      // ── Decide intent ─────────────────────────────────────────────────────
      var queue = [];
      var legacyPrefill = null;
      try {
        var u = new URL(window.location.href);
        var isAdmin = u.searchParams.get("admin") === "1";
        var pre = u.searchParams.get("prefill");
        if (pre) {
          try { legacyPrefill = decodeURIComponent(escape(atob(decodeURIComponent(pre)))); }
          catch (e) { try { legacyPrefill = decodeURIComponent(pre); } catch (_e) { legacyPrefill = pre; } }
        }
        u.searchParams.delete("prefill");
        u.searchParams.delete("admin");
        history.replaceState(null, "", u.pathname + (u.search || "") + (u.hash || ""));

        if (isAdmin) {
          try { queue = JSON.parse(localStorage.getItem("citizenGas.queue") || "[]"); } catch (e) { queue = []; }
        } else if (legacyPrefill && legacyPrefill.trim()) {
          queue = [{ id: "legacy_" + Date.now(), createdAt: Date.now(), body: legacyPrefill }];
        }
      } catch (e) { console.error("intent capture failed", e); }

      // No work to do? Let the dashboard render normally with the password gate.
      if (!queue || queue.length === 0) { return; }

      // We have work — show the splash now.
      showSplash();

      // ── Translate Citizen Gas body → GSC parser template ──────────────────
      function getEng(body) { var m = body.match(/^Engineer:\s*(.+)$/m); return m ? m[1].trim() : ""; }
      function splitProperties(body) {
        var parts = body.split(/\n\s*PROPERTY\s+\d+\s*\n/gi);
        if (parts.length <= 1) return [];
        return parts.slice(1).map(function (chunk) { return chunk.split(/\n=+\n/)[0]; });
      }
      function fieldVal(block, key) {
        var rx = new RegExp("^" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*:\\s*(.*)$", "mi");
        var m = block.match(rx); return m ? m[1].trim() : "";
      }
      function getApplianceBlocks(propBlock) {
        var out = [];
        var rx = /APPLIANCE\s+(\d+)\s*\n([\s\S]*?)(?=\n\s*APPLIANCE\s+\d+\s*\n|\nFAULTS\b|\nCOOKER\b|\nALARMS\b|\nALARM\b|\nFAULT\s+\d|\n=+|$)/gi;
        var m;
        while ((m = rx.exec(propBlock)) !== null) out.push({ idx: parseInt(m[1], 10), body: m[2] });
        return out;
      }
      function getFaultBlocks(propBlock) {
        var out = [];
        var fIdx = propBlock.search(/\nFAULTS\b/i);
        if (fIdx >= 0) {
          var faultsSec = propBlock.slice(fIdx).split(/\n=+|\n\s*$/)[0];
          if (!/None reported/i.test(faultsSec)) {
            var pieces = faultsSec.split(/\n\s*\n/).slice(1);
            pieces.forEach(function (p, i) { if (p.trim()) out.push({ idx: i + 1, body: p }); });
          }
        }
        return out;
      }
      function buildGSCTemplate(citizenBody) {
        var props = splitProperties(citizenBody);
        if (props.length === 0) return citizenBody;

        var lines = [];
        var engineerName = getEng(citizenBody);
        // Emit the Engineer line at the very top so the bundle's __pickEng helper
        // picks the wizard's engineer name instead of the hardcoded fallback.
        if (engineerName) {
          lines.push("Engineer: " + engineerName);
          lines.push("");
        }

        props.forEach(function (block, pi) {
          var n = pi + 1;
          var addr1     = fieldVal(block, "Install Address 1");
          var addr2     = fieldVal(block, "Install Address 2");
          var postcode  = fieldVal(block, "Install Postcode");
          var date      = fieldVal(block, "Date");
          var coAlarm   = fieldVal(block, "Carbon Monoxide Alarm");
          var fireAlarm = fieldVal(block, "Fire Alarm");

          var certRef = "GSC-" + (Date.now() + n).toString().slice(-8);
          var clientName = addr1 || "Customer";

          lines.push("PROPERTY " + n);
          lines.push("------------------------------");
          lines.push("Cert Ref: " + certRef);
          lines.push("Date: " + (date || ""));
          lines.push("Client Name: " + clientName);
          lines.push("Client Address 1: " + (addr1 || ""));
          lines.push("Client Address 2: " + (addr2 || ""));
          lines.push("Client Address 3: ");
          lines.push("Client Postcode: " + (postcode || ""));
          lines.push("Client Tel: ");
          lines.push("Client Email: ");
          lines.push("Install Name: " + clientName);
          lines.push("Install Address 1: " + (addr1 || ""));
          lines.push("Install Address 2: " + (addr2 || ""));
          lines.push("Install Address 3: ");
          lines.push("Install Postcode: " + (postcode || ""));
          lines.push("Install Tel: ");
          lines.push("");

          var apps = getApplianceBlocks(block);
          apps.forEach(function (a, ai) {
            var ab = a.body;
            var loc   = fieldVal(ab, "Location");
            var typ   = fieldVal(ab, "Type");
            var make  = fieldVal(ab, "Make");
            var model = fieldVal(ab, "Model");
            var heat  = fieldVal(ab, "Heat Input");
            var op    = fieldVal(ab, "Operating Pressure");

            lines.push("APPLIANCE " + (ai + 1));
            lines.push("Location: " + (loc || ""));
            lines.push("Type: " + (typ || (ai === 0 ? "Boiler" : (ai === 1 ? "Cooker" : "Gas Fire"))));
            lines.push("Make: " + (make || ""));
            lines.push("Model: " + (model || ""));
            lines.push("Heat Input: " + (heat || "NA"));
            lines.push("CO Reading: NA");
            lines.push("CO2 Reading: NA");
            lines.push("Combustion Analysis Reading: NA");
            lines.push("Operating Pressure: " + (op || "NA"));
            lines.push("Flue Type: " + (ai === 0 ? "RS" : "FL"));
            lines.push("Appliance Inspected: Yes");
            lines.push("Appliance Serviced: No");
            lines.push("Appliance Safe to Use: Yes");
            lines.push("Safety Devices: Yes");
            lines.push("Ventilation: Pass");
            lines.push("Flue Visual: Pass");
            lines.push("Flue Performance: Pass");
            lines.push("Landlords Appliance: " + (ai === 0 ? "Yes" : "No"));
            lines.push("");
          });

          var faults = getFaultBlocks(block);
          faults.forEach(function (f, fi) {
            var fb = f.body;
            var details = fieldVal(fb, "Fault") || fb.split("\n").filter(function(x){return x.trim();}).slice(0,1).join(" ");
            var remedial = fieldVal(fb, "Remedial") || "";
            var warning  = fieldVal(fb, "Warning Notice Fixed") || "No";
            lines.push("FAULT " + (fi + 1));
            lines.push("Fault Details: " + details);
            lines.push("Remedial Work: " + remedial);
            lines.push("Warning Notice Fixed: " + warning);
            lines.push("");
          });

          if (coAlarm)   lines.push("Carbon Monoxide Alarm: " + coAlarm);
          if (fireAlarm) lines.push("Fire Alarm: " + fireAlarm);
          lines.push("");
        });

        lines.push("END OF JOB");
        return lines.join("\n");
      }
      function dateFolderName(d) {
        var dd = String(d.getDate()).padStart(2, "0");
        var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return dd + " " + months[d.getMonth()] + " " + d.getFullYear();
      }

      // Build a per-job translation map keyed by createdAt (for date-folder name)
      var jobs = queue.map(function (q) {
        var translated;
        try { translated = buildGSCTemplate(q.body || ""); }
        catch (e) { console.error("[adapter] translate failed", e); translated = q.body || ""; }
        var d = q.createdAt ? new Date(q.createdAt) : new Date();
        return { id: q.id, createdAt: q.createdAt || Date.now(), translated: translated, folderName: dateFolderName(d) };
      });
      console.log("[adapter] queued jobs:", jobs.length);

      // Suppress alert() during auto-flow
      var _origAlert = window.alert;
      window.alert = function (msg) { console.log("[adapter] suppressed alert:", msg); };
      function restoreAlert() { try { window.alert = _origAlert; } catch (e) {} }

      // ── Drive the dashboard ───────────────────────────────────────────────
      function setReactInputValue(el, value) {
        var proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
        var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
        setter.call(el, value);
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }
      function findByText(tag, text) {
        // Prefer the smallest (leaf-most) matching element so we don't grab outer wrappers.
        var nodes = document.querySelectorAll(tag);
        var needle = (text || "").trim();
        var needleLower = needle.toLowerCase();
        var exact = [], sub = [];
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          // Skip invisible nodes
          try {
            var rect = n.getBoundingClientRect && n.getBoundingClientRect();
            if (rect && rect.width === 0 && rect.height === 0) continue;
          } catch (e) {}
          var t = ((n.textContent || "") + "").trim();
          if (!t) continue;
          var tLower = t.toLowerCase();
          if (tLower === needleLower) exact.push(n);
          else if (tLower.indexOf(needleLower) >= 0) sub.push(n);
        }
        function byShortest(a, b) {
          return (a.textContent || "").length - (b.textContent || "").length;
        }
        if (exact.length) { exact.sort(byShortest); return exact[0]; }
        if (sub.length) { sub.sort(byShortest); return sub[0]; }
        return null;
      }
      function climbToClickable(el) {
        var c = el;
        // First pass: prefer real buttons / role=button / explicit onclick.
        for (var i = 0; i < 8 && c; i++) {
          if (c.tagName === "BUTTON" || c.onclick || (c.getAttribute && c.getAttribute("role") === "button")) return c;
          c = c.parentElement;
        }
        // Second pass: fall back to the nearest ancestor with cursor:pointer (React tile handlers).
        c = el;
        for (var j = 0; j < 8 && c; j++) {
          try {
            if (c.nodeType === 1 && getComputedStyle(c).cursor === "pointer") return c;
          } catch (e) {}
          c = c.parentElement;
        }
        return el;
      }
      function snapshotRecordIds() {
        try {
          var arr = JSON.parse(localStorage.getItem("gsc_records") || "[]");
          var ids = {};
          arr.forEach(function (r) { ids[r.savedAt || r.id || JSON.stringify(r).slice(0,80)] = true; });
          return ids;
        } catch (e) { return {}; }
      }
      // Read the engineer profile saved by the wizard (citizenGas.engineerProfile)
      // so we can stamp the real engineer details onto each new certificate record.
      function readEngineerProfile() {
        try {
          var p = JSON.parse(localStorage.getItem("citizenGas.engineerProfile") || "{}");
          return {
            fullName: (p.fullName || "").trim(),
            gasSafeRegNo: (p.gasSafeRegNo || "").trim(),
            licenceNo: (p.licenceNo || "").trim()
          };
        } catch (e) { return { fullName: "", gasSafeRegNo: "", licenceNo: "" }; }
      }

      function tagNewRecordsIntoFolder(beforeIds, folderName) {
        try {
          var records = JSON.parse(localStorage.getItem("gsc_records") || "[]");
          var folders = JSON.parse(localStorage.getItem("gsc_folders") || "[]");
          var existing = folders.find(function (f) { return f && f.name === folderName; });
          var folderId = existing ? existing.id : ("f_" + Date.now());
          if (!existing) { folders.push({ id: folderId, name: folderName }); localStorage.setItem("gsc_folders", JSON.stringify(folders)); }
          var prof = readEngineerProfile();
          var changed = false;
          records.forEach(function (r) {
            var key = r.savedAt || r.id || JSON.stringify(r).slice(0,80);
            if (!beforeIds[key]) {
              if (!r.gscFolder) { r.gscFolder = folderId; changed = true; }
              // Stamp the wizard's engineer details onto the new record so the
              // certificate shows them instead of the bundle's hardcoded fallbacks.
              if (prof.fullName) {
                if (r.signerName !== prof.fullName) { r.signerName = prof.fullName; changed = true; }
                if (r.engineerName !== prof.fullName) { r.engineerName = prof.fullName; changed = true; }
                if (r.issuedBy !== prof.fullName) { r.issuedBy = prof.fullName; changed = true; }
              }
              if (prof.gasSafeRegNo) {
                if (r.gasSafeNo !== prof.gasSafeRegNo) { r.gasSafeNo = prof.gasSafeRegNo; changed = true; }
              }
              if (prof.licenceNo) {
                if (r.engineerId !== prof.licenceNo) { r.engineerId = prof.licenceNo; changed = true; }
              }
            }
          });
          if (changed) localStorage.setItem("gsc_records", JSON.stringify(records));
        } catch (e) { console.error("[adapter] folder tag failed", e); }
      }

      var BUDGET_MS = 60000 + jobs.length * 30000; // generous per-job budget
      var startedAt = Date.now();
      var jobIdx = 0;
      var phase = "wait-unlock";
      var beforeIds = null;

      function nextJob() {
        jobIdx++;
        if (jobIdx >= jobs.length) {
          // Done with all jobs
          // Clear queue
          try { localStorage.removeItem("citizenGas.queue"); } catch (e) {}
          phase = "go-records";
          return setTimeout(tick, 300);
        }
        // Go back to home, then GSC Email again for next job
        var back = findByText("button", "Back") || findByText("button", "Home")
                || document.querySelector('button[aria-label="Back"]');
        if (back) climbToClickable(back).click();
        beforeIds = snapshotRecordIds();
        phase = "wait-home";
        setTimeout(tick, 400);
      }

      function tick() {
        if (Date.now() - startedAt > BUDGET_MS) {
          restoreAlert();
          hideSplashShowApp();
          return;
        }

        if (phase === "wait-unlock") {
          var pwd = document.querySelector('input[type="password"]');
          if (pwd) {
            // Auto-unlock: dashboard accepts any non-empty password.
            // Fill it and submit so the user doesn't have to type anything.
            try {
              setReactInputValue(pwd, "x");
              setMsg("Unlocking…");
              // Try Enter key first (most React password forms submit on Enter).
              pwd.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true }));
              pwd.dispatchEvent(new KeyboardEvent("keypress", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true }));
              pwd.dispatchEvent(new KeyboardEvent("keyup", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true }));
              // Also try clicking the nearest submit button as fallback.
              setTimeout(function () {
                if (!document.querySelector('input[type="password"]')) return; // already unlocked
                var form = pwd.closest && pwd.closest("form");
                if (form) {
                  var sb = form.querySelector('button[type="submit"], button');
                  if (sb) { sb.click(); return; }
                  try { form.requestSubmit ? form.requestSubmit() : form.submit(); return; } catch (e) {}
                }
                // No form — find any visible button on screen (Unlock / Continue / Submit).
                var btns = Array.from(document.querySelectorAll("button"));
                for (var i = 0; i < btns.length; i++) {
                  var b = btns[i];
                  if (b.disabled) continue;
                  var t = (b.textContent || "").trim().toLowerCase();
                  if (/unlock|continue|submit|enter|go|sign\s*in|log\s*in/.test(t)) { b.click(); return; }
                }
                if (btns.length === 1) btns[0].click();
              }, 250);
            } catch (e) { console.error("[adapter] auto-unlock failed", e); }
            return setTimeout(tick, 600);
          }
          document.body.classList.add("cg-stealth");
          setMsg("Processing " + jobs.length + " visit" + (jobs.length === 1 ? "" : "s"));
          beforeIds = snapshotRecordIds();
          phase = "wait-home";
          return setTimeout(tick, 200);
        }

        if (phase === "wait-home") {
          var gscNode = findByText("div", "GSC Email") || findByText("button", "GSC Email") || findByText("span", "GSC Email");
          if (gscNode) {
            climbToClickable(gscNode).click();
            setMsg("Reading visit " + (jobIdx + 1) + " of " + jobs.length);
            phase = "wait-import-tab";
          }
          return setTimeout(tick, 250);
        }

        if (phase === "wait-import-tab") {
          var importTab = findByText("button", "Import Reply") || findByText("div", "Import Reply") || findByText("span", "Import Reply");
          if (importTab) climbToClickable(importTab).click();
          phase = "wait-textarea";
          return setTimeout(tick, 250);
        }

        if (phase === "wait-textarea") {
          var ta = document.querySelector('textarea');
          if (ta) {
            setReactInputValue(ta, jobs[jobIdx].translated);
            setMsg("Parsing visit " + (jobIdx + 1));
            phase = "wait-parse";
          }
          return setTimeout(tick, 250);
        }

        if (phase === "wait-parse") {
          var btn = findByText("button", "Parse Email") || findByText("button", "Parse");
          if (btn && !btn.disabled) {
            btn.click();
            phase = "wait-import-button";
          }
          return setTimeout(tick, 300);
        }

        if (phase === "wait-import-button") {
          // The real button text is e.g. "✅ Create 1 Gas Safety Certificate".
          // Match it via a regex sweep over enabled buttons, then fall back to known labels.
          var imp = null;
          var allBtns = Array.from(document.querySelectorAll("button"));
          for (var bi = 0; bi < allBtns.length; bi++) {
            var b = allBtns[bi];
            if (b.disabled) continue;
            var bt = (b.innerText || b.textContent || "").trim();
            if (/create\b.*\bcertif/i.test(bt) || /create\b.*\bgsc/i.test(bt)) { imp = b; break; }
          }
          if (!imp) {
            imp = findByText("button", "Create Certificates")
               || findByText("button", "Create Certificate")
               || findByText("button", "Import")
               || findByText("button", "Save");
          }
          if (imp && !imp.disabled) {
            console.log("[adapter] clicking import button:", (imp.innerText || "").trim().slice(0, 60));
            imp.click();
            phase = "wait-records";
          }
          return setTimeout(tick, 350);
        }

        if (phase === "wait-records") {
          var afterIds = snapshotRecordIds();
          var added = false;
          for (var k in afterIds) { if (!beforeIds[k]) { added = true; break; } }
          if (added) {
            tagNewRecordsIntoFolder(beforeIds, jobs[jobIdx].folderName);
            setMsg("Saved to folder " + jobs[jobIdx].folderName);
            return setTimeout(nextJob, 600);
          }
          return setTimeout(tick, 300);
        }

        if (phase === "go-records") {
          var ok = findByText("button", "OK") || findByText("button", "Ok") || findByText("button", "Done");
          if (ok) climbToClickable(ok).click();
          var back = findByText("button", "Back") || findByText("button", "Home")
                  || document.querySelector('button[aria-label="Back"]');
          if (back) climbToClickable(back).click();
          phase = "wait-records-tile";
          return setTimeout(tick, 350);
        }

        if (phase === "wait-records-tile") {
          var rec = findByText("div", "Records") || findByText("button", "Records") || findByText("span", "Records");
          if (rec) {
            climbToClickable(rec).click();
            phase = "done";
            restoreAlert();
            setTimeout(hideSplashShowApp, 250);
            return;
          }
          if (Date.now() - startedAt > BUDGET_MS - 5000) { hideSplashShowApp(); return; }
          return setTimeout(tick, 250);
        }
      }

      window.addEventListener("DOMContentLoaded", function () { setTimeout(tick, 350); });
      setTimeout(hideSplashShowApp, BUDGET_MS + 1000);
    })();
    </script>
  </body>
</html>
