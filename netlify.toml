[build]
  command = ""
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Existing Citizen Gas dashboard SPA
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/index.html"
  status = 200

# Gas Safety admin app SPA
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Citizen Gas SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
